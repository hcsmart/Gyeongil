<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>공정이동표 — GI MES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:12px/1.5 'Malgun Gothic','맑은 고딕',sans-serif;color:#1d2833;background:#eef1f4;padding:18px}
.sheet{width:210mm;min-height:140mm;margin:0 auto;background:#fff;border:1px solid #c6d0da;padding:11mm 12mm}
.hd{display:flex;align-items:center;border-bottom:3px solid #1d2833;padding-bottom:6px}
.hd h1{font-size:21px;letter-spacing:6px}
.hd .co{margin-left:auto;text-align:right;font-size:11px;color:#526171}
.top{display:flex;gap:12px;margin-top:10px}
.inf{flex:1;border:1px solid #8494a4;border-collapse:collapse;width:100%}
.inf th{background:#f0f4f8;border:1px solid #b6c3cf;width:86px;font-size:11px;padding:4px 6px;text-align:left;color:#41556a}
.inf td{border:1px solid #b6c3cf;padding:4px 8px;font-weight:700}
.qrbox{width:132px;text-align:center}
.qrbox img{width:120px;height:120px;image-rendering:pixelated}
.qrbox .cap{font-size:10px;color:#526171;margin-top:2px;line-height:1.35}
.rt{margin-top:10px}
.rt h3{font-size:12px;color:#1d2833;border-left:4px solid #2e6497;padding-left:7px;margin-bottom:5px}
.mv{width:100%;border-collapse:collapse}
.mv th{background:#f0f4f8;border:1px solid #8494a4;font-size:11px;padding:4px 3px;color:#41556a}
.mv td{border:1px solid #8494a4;height:30px;padding:3px 5px;font-size:11px}
.mv td.c{text-align:center}
.mv td.done{background:#f2f8f3;color:#15803d;font-weight:700}
/* 이동경로 칩 : 사내 1개 + 공정 (완료 · 진행중 · 다음 · 대기) */
.fl{display:flex;flex-wrap:wrap;align-items:center;gap:3px 4px;font-weight:400}
.fl i{font-style:normal;color:#8494a4;font-weight:700}
.fl b{display:inline-block;padding:2px 7px;border:1px solid #c4cfd9;border-radius:3px;
  background:#f2f4f6;color:#7b8794;font-size:11px;font-weight:700;white-space:nowrap}
.fl b.home{background:#33465a;border-color:#26374a;color:#fff}
.fl b.done{background:#eef7f0;border-color:#2f7d4d;color:#1d5a35}
.fl b.wip{background:#e9f2fc;border-color:#2e77bd;color:#1d568c}
.fl b.inw{background:#fdf1e4;border-color:#e8862e;color:#8a5a12}
.fl b.next{background:#fff;border-style:dashed;border-color:#2e77bd;color:#1d568c}
.fl b.close{background:#2f7d4d;border-color:#1d5a35;color:#fff}
.fl s{text-decoration:none;font-size:10px;color:#526171;margin-left:6px;font-weight:400}
.foot{margin-top:9px;font-size:10.5px;color:#526171;line-height:1.7;border-top:1px dashed #b6c3cf;padding-top:6px}
.bar{margin:14px auto 0;width:210mm;display:flex;gap:8px;justify-content:flex-end}
.bar button{height:30px;padding:0 16px;border:1px solid #2e6497;background:#2e77bd;color:#fff;font-weight:700;cursor:pointer}
.bar button.gray{background:#fff;color:#41556a;border-color:#9fadba}
@media print{ body{background:#fff;padding:0} .bar{display:none} .sheet{border:0;width:auto;margin:0} }
</style>
<script src="ki_config.js"></script>
<script src="ki_core.js"></script>
<script src="ki_qr.js"></script>
</head>
<body>
<div class="sheet" id="sheet">불러오는 중...</div>
<div class="bar">
  <button class="gray" onclick="history.length>1?history.back():window.close()">닫기</button>
  <button class="gray" id="btReissue">♻ 재발행 (기존 QR 폐기)</button>
  <button onclick="window.print()">🖨 인쇄</button>
</div>
<script>
(async function(){
  if(!await KI.guard(null))return;   /* 로그인만 확인 */
  if(!(KI.can('lot-route','view')||KI.can('lot-scan','view'))){
    document.getElementById('sheet').textContent='이동표 발행 권한이 없습니다.'; return; }
  const esc=KI.esc;
  const part=new URLSearchParams(location.search).get('lot')||'';
  const box=document.getElementById('sheet');
  if(!part){ box.textContent='LOT 번호가 없습니다. (lot_tag.html?lot=LOT번호)'; return; }

  const [prog,osp,rts,rcpt,moves,vens]=await Promise.all([
    KI.get(OBJ.lotProg+'?select=*&part=eq.'+encodeURIComponent(part)+'&order=no.asc&limit=1'),
    KI.get(OBJ.ospOrder+'?select=*&part=eq.'+encodeURIComponent(part)+'&order=no.asc'),
    KI.get(OBJ.stdRoute+'?select=*'),
    KI.get(OBJ.lotReceipt+'?select=*&part=eq.'+encodeURIComponent(part)+'&limit=1').catch(()=>[]),
    KI.get(OBJ.lotMove+'?select=*&part=eq.'+encodeURIComponent(part)+'&order=move_date.asc,move_id.asc&limit=100').catch(()=>[]),
    KI.get(OBJ.vendor+'?select=vendor_name,phone,contact_name,contact_phone,proc_codes&order=sort_order.asc').catch(()=>[])
  ]);
  const venOf=n=>vens.find(v=>v.vendor_name===n)||null;
  const r=prog[0]||{}, last=osp[osp.length-1]||{};
  const rt = r.route_no ? rts.find(x=>String(x.standard_process_no)===String(r.route_no))
           : rts.find(x=>String(x.standard_process_no)===String(last.route_no||''));
  const steps = rt&&Array.isArray(rt.steps)?rt.steps:[];
  const seen = new Set((Array.isArray(r.steps)?r.steps:[]).map(s=>s.mp));
  const hist = mp => (Array.isArray(r.steps)?r.steps:[]).find(s=>s.mp===mp)||{};
  const ordOf = mp => osp.filter(o=>o.mp===mp).sort((a,b)=>(Number(b.no)||0)-(Number(a.no)||0))[0]||{};
  const mvOf  = mp => moves.filter(m=>m.mp===mp&&(m.io==='입고'||m.io==='출고'));
  const qtyOf = mp => { const o=ordOf(mp); return o.qty!=null?Number(o.qty):null; };

  /* QR : 일회성 토큰 발행 — 로그인 없이 이 LOT만 열람·기록 가능 */
  let tok='';
  try{ tok=await KI.POST('rpc/ki_lot_token_issue',{p_part:part,p_days:365}); }
  catch(e){ tok=''; }
  const base=location.href.replace(/[^/]*(\?.*)?$/,'');
  const url = tok ? base+'lot_qr.html?t='+encodeURIComponent(tok)
                  : base+'lot_scan.html?lot='+encodeURIComponent(part);
  const qr=qrcode(0,'M'); qr.addData(url,'Byte'); qr.make();

  /* 이동이력 기반 물류흐름 — 진행등록 화면과 동일한 표현 */
  const procs = await KI.get(OBJ.process+'?select=process_code,process_name&order=sort_order.asc').catch(()=>[]);
  const pName = c=>{ const p=procs.find(x=>x.process_code===c); return p?p.process_name:''; };
  const node  = (mp,ven)=>[mp?(pName(mp)?mp+'·'+pName(mp):mp):'', ven||''].filter(Boolean).join(' ')||'사내';

  const asc = moves.slice().sort((a,b)=>String(a.move_date||'').localeCompare(String(b.move_date||''))
    ||(Number(a.move_id)||0)-(Number(b.move_id)||0));
  /* 공정 완료 = 그 공정을 마치고 경일FB(사내)로 입고된 상태
     · 미입고 반출건(sdate 있고 idate 없음)이 있으면 제품은 아직 그 외주처에 있다 */
  const openAll = osp.filter(o=>o.sdate&&!o.idate)
      .sort((a,b)=>String(b.sdate||'').localeCompare(String(a.sdate||''))
                 ||(Number(b.no)||0)-(Number(a.no)||0));
  const isIn  = o => String(o&&o.move_kind||'외주')==='사내';
  const openO = openAll.find(o=>!isIn(o))||null;      /* 외주 보유 */
  const openI = openAll.find(isIn)||null;             /* 사내 작업장 이동 */
  const wipMp = openO?(openO.mp||''):'';
  const inMp  = openI?(openI.mp||''):'';
  const doneMp = new Set();
  osp.filter(o=>o.idate&&o.mp).forEach(o=>doneMp.add(o.mp));
  asc.filter(m=>m.mp&&m.io==='입고').forEach(m=>doneMp.add(m.mp));
  (Array.isArray(r.steps)?r.steps:[]).forEach(s=>{ if(s.mp) doneMp.add(s.mp); });
  if(wipMp) doneMp.delete(wipMp);
  if(inMp)  doneMp.delete(inMp);
  /* 제품의 현재 위치 : recv 종결 / wip 외주 보유 / home 사내 보유 */
  const pos = rcpt[0] ? 'recv' : (wipMp ? 'wip' : 'home');
  const restMp = steps.filter(x=>!doneMp.has(x)&&x!==wipMp&&x!==inMp);

  /* 이동경로 : 외주는 공정마다 사내로 되돌아오므로 사내 노드는 앞의 하나만 둔다 */
  const routeFlow = () => {
    if(!rt) return '(미매칭)';
    const chip=(cls,t,sub)=>'<b class="'+cls+'">'+t+(sub?'<s>'+sub+'</s>':'')+'</b>';
    const homeSub = pos==='recv' ? '✓ 종결 '+esc(rcpt[0].in_date||'')
      : pos!=='home' ? '출발 · 복귀 지점'
      : openI ? '현재 위치 · 사내 '+esc(openI.vendor||'작업장')+' 작업중'
      : (restMp.length?'현재 위치 · 다음 반출 대기':'현재 위치 · 사내입고 대기');
    let h=chip(pos==='recv'?'close':(pos==='home'?'home':''), '🏭 사내', homeSub);
    steps.forEach(x=>{
      const nm=esc(x)+(pName(x)?'·'+esc(pName(x)):'');
      const ven=(ordOf(x).vendor)||'';
      h+='<i>→</i>';
      h+= x===wipMp     ? chip('wip', nm, (ven?ven+' ':'')+'진행중')
        : x===inMp      ? chip('inw', nm, (openI&&openI.vendor?openI.vendor+' ':'')+'사내 작업중')
        : doneMp.has(x) ? chip('done', nm, (ven?ven+' ':'')+'✓ 완료')
        : x===restMp[0] ? chip('next', nm, '다음 공정')
        : chip('', nm, '');
    });
    return '<div class="fl">'+h+'</div>';
  };

  let loc='사내'; const prevAt={};
  const flow = asc.map(v=>{
    const here=node(v.mp,v.vendor); let f='',t='',q=null;
    if(v.io==='출고'){        f=loc; t=here; q=v.out_qty; prevAt[here]=loc; loc=here; }
    else if(v.io==='도착'){   f=prevAt[here]||'사내'; t=here; q=v.in_qty; loc=here; }
    else if(v.io==='입고'){   f=here; t='사내 복귀'; q=v.in_qty; loc='사내'; }
    else if(v.io==='사내입고'){f=(v.mp||v.vendor)?here:loc; t='사내입고 (종결)'; q=v.in_qty; loc='사내'; }
    else return null;
    return {d:v.move_date||'', io:v.io, f:f, t:t, q:q, s:Number(v.short_qty)||0, rmk:v.remark||v.reason||''};
  }).filter(Boolean);

  const rows = flow.map((x,i)=>'<tr>'+
    '<td class="c">'+(i+1)+'</td>'+
    '<td class="c">'+esc(x.d)+'</td>'+
    '<td class="c'+(x.io==='사내입고'?' done':'')+'">'+esc(x.io)+'</td>'+
    '<td>'+esc(x.f)+'</td>'+
    '<td class="c" style="color:#7b8794">▶</td>'+
    '<td'+(x.io==='사내입고'?' class="done"':'')+'>'+esc(x.t)+'</td>'+
    '<td class="c">'+(x.q!=null?Number(x.q).toLocaleString():'')+'</td>'+
    '<td class="c"'+(x.s?' style="color:#b23030;font-weight:800"':'')+'>'+(x.s?x.s.toLocaleString():'')+'</td>'+
    '<td></td>'+
    '<td>'+esc(x.rmk)+'</td>'+
  '</tr>').join('');
  const blank='<tr>'+'<td class="c"></td>'.repeat(3)+'<td></td><td class="c"></td><td></td>'+
    '<td class="c"></td><td class="c"></td><td></td><td></td></tr>';
  const restN = Math.max(restMp.length*2, 2);

  box.innerHTML=
    '<div class="hd"><h1>공 정 이 동 표</h1>'+
    '<div class="co">GI MES · 발행 '+new Date().toISOString().slice(0,10)+'<br>발행자 '+esc((KI.me()||{}).emp_name||'')+'</div></div>'+
    '<div class="top">'+
      '<table class="inf"><tbody>'+
        '<tr><th>LOT 번호</th><td style="font-size:15px">'+esc(part)+'</td><th>JOB</th><td>'+esc(r.job||last.job||'')+'</td></tr>'+
        '<tr><th>품번</th><td>'+esc(last.map_part||'')+'</td><th>금형제번</th><td>'+esc(last.mold_no||'')+'</td></tr>'+
        '<tr><th>표준공정</th><td colspan="3">'+
          (rt?'<div style="margin-bottom:4px">'+esc(rt.standard_process_name)+' ('+steps.length+'단계 · 완료 '+
              steps.filter(x=>doneMp.has(x)).length+'/'+steps.length+')</div>':'')+
          routeFlow()+'</td></tr>'+
        '<tr><th>총수량</th><td>'+(last.qty!=null?Number(last.qty).toLocaleString():'')+'</td>'+
            '<th>사내입고</th><td>'+(rcpt[0]?esc(rcpt[0].in_date)+' · '+Number(rcpt[0].qty||0).toLocaleString():'미입고')+'</td></tr>'+
      '</tbody></table>'+
      '<div class="qrbox">'+qr.createImgTag(4,8)+
        '<div class="cap">휴대폰 카메라로 스캔 →<br><b>출고 · 입고 · 특기사항</b> 기록<br>'+
        (tok?'<b style="color:#15803d">로그인 불필요</b>':'<b style="color:#b06a12">로그인 필요</b>')+'</div></div>'+
    '</div>'+
    '<div class="rt"><h3>공정별 입출고 기록 (물류 흐름)</h3>'+
    '<table class="mv"><thead><tr>'+
      '<th style="width:30px">순번</th><th style="width:66px">일자</th><th style="width:54px">구분</th>'+
      '<th>출고처</th><th style="width:16px"></th><th>입고처</th>'+
      '<th style="width:52px">수량</th><th style="width:42px">부족</th>'+
      '<th style="width:52px">확인(인)</th><th style="width:22%">특기사항</th>'+
    '</tr></thead><tbody>'+(rows||'')+blank.repeat(restN)+'</tbody></table></div>'+
    '<div class="foot">'+
      '· 각 공정 <b>입출고 시 QR을 스캔</b>하여 수량과 특기사항을 기록해 주십시오. 시스템에 즉시 반영됩니다.<br>'+
      '· 불량 등으로 <b>수량이 부족하게 출고되는 경우</b> 반드시 부족수량과 사유를 기록해 주십시오.<br>'+
      '· QR 사용이 불가한 경우 본 이동표에 수기 기재 후 LOT과 함께 반송해 주십시오.<br>'+
      '· 본 이동표는 <b>LOT당 1장</b>만 발행됩니다. 제품과 함께 다음 공정 · 다음 업체로 전달해 주십시오. '+
      '<b>분실 시 발주처에 재발행을 요청</b>하시고, 기존 이동표는 폐기해 주십시오.'+
    '</div>'+
    (function(){
      const names=[...new Set(osp.map(o=>o.vendor).filter(Boolean))];
      const hit=names.map(venOf).filter(Boolean);
      if(!hit.length) return '';
      return '<div class="foot" style="border-top:1px solid #b6c3cf">'+
        '<b>협력사 연락처</b> — '+hit.map(v=>esc(v.vendor_name)+
          (v.contact_name?' '+esc(v.contact_name):'')+
          (v.contact_phone||v.phone?' ☎'+esc(v.contact_phone||v.phone):'')).join(' · ')+'</div>';
    })();
  const rb=document.getElementById('btReissue');
  if(rb) rb.addEventListener('click',async()=>{
    if(!KI.can('lot-route','edit')&&!KI.isAdmin()) return alert('재발행 권한이 없습니다.');
    if(!confirm('기존 공정이동표 QR을 폐기하고 새로 발행합니다.\n(분실 · 훼손 시에만 사용)\n계속할까요?'))return;
    try{ await KI.POST('rpc/ki_lot_token_revoke',{p_part:part}); location.reload(); }
    catch(e){ alert('❌ '+e.message); }
  });
})().catch(e=>{ document.getElementById('sheet').textContent='❌ '+e.message; });
</script>
</body>
</html>
