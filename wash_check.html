<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KI MES</title>
<link rel="stylesheet" href="ki_style.css">
<script src="ki_config.js"></script>
<script src="ki_core.js"></script>
</head>
<body>
<script>
(async function(){
  if(!await KI.guard('wash-check'))return;
  const $=KI.$, el=KI.el, esc=KI.esc;
  const cur=KI.chrome('wash-check');
  const CAN_S=KI.can('wash-check','save');
  let STAT=[], STEPS=[], HIST=[], sel=null;

  const ui=KI.page(cur,[
    ['💾 세척 등록','primary',()=>save()],
    ['정기세척 일괄 등록','green',()=>bulk()],
    ['새로고침','',()=>load()],
    ['엑셀(CSV)','',()=>csv()]
  ]);
  const nt=el('div','note');
  nt.innerHTML='<b>일상세척</b>: 생산완료 후 · <b>정기세척</b>: [점검기준 › 점검주기 기준]의 타발수·기간 도래 시. '+
    '정기세척을 등록하면 그 시점의 누적 타발수가 <b>새 기준점</b>이 되어 사용 타발수가 0으로 리셋됩니다.';
  ui.pg.appendChild(nt);

  /* 요약 */
  const sum=el('div','gv-sum'); sum.style.margin='0 7px';
  sum.innerHTML=['도래','임박','미실시','정상'].map(k=>
    '<div class="b"><div class="v" id="s_'+k+'">0</div><div class="k">'+k+'</div></div>').join('');
  ui.pg.appendChild(sum);

  const w=el('div','gv-wrap');
  w.innerHTML=
    '<div class="gv-left" style="width:420px"><div class="pane-h">세척 도래현황</div>'+
      '<div class="ui-find"><input type="text" id="q" placeholder="품번 · 금형명 · 고객사">'+
        '<select id="fs" style="height:23px;border:1px solid #aeb9c4">'+
        '<option value="">전체</option><option>도래</option><option>임박</option><option>미실시</option><option>정상</option></select></div>'+
      '<div class="ui-list" id="list"></div></div>'+
    '<div class="gv-right"><div class="pane-h" id="ttl">세척 등록</div><div class="gv-bd">'+
      '<div style="display:grid;grid-template-columns:100px 1fr 100px 1fr;gap:6px;align-items:center">'+
        '<label style="color:#526171;font-weight:700">세척일</label><input type="date" id="fDate" style="height:26px;border:1px solid #aeb9c4;padding:0 6px">'+
        '<label style="color:#526171;font-weight:700">실시자</label><input type="text" id="fBy" style="height:26px;border:1px solid #aeb9c4;padding:0 6px">'+
        '<label style="color:#526171;font-weight:700">세척 구분</label><select id="fType" style="height:26px;border:1px solid #aeb9c4"><option>정기</option><option>일상</option></select>'+
        '<label style="color:#526171;font-weight:700">누적 타발수</label><input type="text" id="fShot" style="height:26px;border:1px solid #aeb9c4;padding:0 6px" placeholder="대장 자동">'+
      '</div>'+
      '<div id="warn" style="margin-top:8px"></div>'+
      '<div style="margin-top:10px;font-weight:800;color:#41556a">세척항목 <span id="stepCnt" style="color:#8b98a5;font-weight:400"></span></div>'+
      '<div id="steps" style="margin-top:5px"></div>'+
      '<div style="margin-top:10px;display:grid;grid-template-columns:100px 1fr;gap:6px;align-items:center">'+
        '<label style="color:#526171;font-weight:700">판정</label><select id="fJudge" style="height:26px;border:1px solid #aeb9c4"><option>양호</option><option>불량</option></select>'+
        '<label style="color:#526171;font-weight:700">비고</label><input type="text" id="fRem" style="height:26px;border:1px solid #aeb9c4;padding:0 6px">'+
      '</div>'+
      '<div style="margin-top:12px" id="hist"></div>'+
    '</div><div class="gv-foot"><span class="msg" id="wMsg" style="font-weight:700"></span>'+
      '<button class="btn primary" id="bSave" style="margin-left:auto">💾 세척 등록</button></div></div>';
  ui.pg.appendChild(w);
  $('#fDate').value=new Date().toISOString().slice(0,10);
  $('#fBy').value=(KI.me()||{}).emp_name||'';

  const fmt=v=>v==null?'':Number(v).toLocaleString();
  function badge(st){
    const c={'도래(타발수)':'#fbe4e4;color:#b23030','도래(기간)':'#fbe4e4;color:#b23030',
             '임박':'#fdeeda;color:#b05c12','미실시':'#f1f3f5;color:#77828c','정상':'#e2f0e6;color:#15803d'}[st];
    return '<span class="badge" style="background:'+(c||'#eee')+'">'+esc(st)+'</span>';
  }
  function drawSum(){
    const g={'도래':0,'임박':0,'미실시':0,'정상':0};
    STAT.forEach(r=>{ const k=String(r.wash_status||'').startsWith('도래')?'도래':r.wash_status; if(g[k]!=null)g[k]++; });
    Object.keys(g).forEach(k=>$('#s_'+k).textContent=g[k]);
  }
  function drawList(){
    const q=$('#q').value.trim().toLowerCase(), f=$('#fs').value;
    const box=$('#list'); box.innerHTML='';
    STAT.filter(r=>(!q||[r.mold_code,r.mold_name,r.customer_name].some(v=>String(v||'').toLowerCase().includes(q)))
                && (!f || (f==='도래'?String(r.wash_status).startsWith('도래'):r.wash_status===f)))
      .forEach(r=>{
        const row=el('div','ui-row'+(sel&&sel.mold_code===r.mold_code?' sel':''));
        row.style.gridTemplateColumns='96px 1fr 100px';
        row.innerHTML='<div style="font-weight:700">'+esc(r.mold_code)+'</div>'+
          '<div>'+esc(r.mold_name||'')+'<small style="display:block;color:#96a2ad">'+
            esc(r.prod_type)+(r.rule_label?' · '+esc(r.rule_label):'')+' · 사용 '+fmt(r.used_shot)+' / '+fmt(r.limit_shot)+' ('+(r.shot_pct??0)+'%)'+
            (r.days_since!=null?' · '+r.days_since+'일':'')+'</small></div>'+
          '<div class="center">'+badge(r.wash_status)+'</div>';
        row.addEventListener('click',()=>{ sel=r;
          box.querySelectorAll('.ui-row.sel').forEach(x=>x.classList.remove('sel'));
          row.classList.add('sel'); pick();
        });
        box.appendChild(row);
      });
  }
  function pick(){
    $('#ttl').textContent='세척 등록 — '+sel.mold_code+' '+(sel.mold_name||'');
    $('#fShot').value=fmt(sel.cur_shot);
    const wn=$('#warn');
    if(String(sel.wash_status).startsWith('도래'))
      wn.innerHTML='<div class="note" style="margin:0;border-left-color:#b23030;background:#fdf3f3;color:#8a3b3b">'+
        '⚠ <b>'+esc(sel.wash_status)+'</b> — 사용 타발수 '+fmt(sel.used_shot)+' / 한도 '+fmt(sel.limit_shot)+
        (sel.days_since!=null?' · 마지막 정기세척 '+sel.days_since+'일 경과':'')+'</div>';
    else if(sel.wash_status==='미실시')
      wn.innerHTML='<div class="note" style="margin:0">정기세척 이력이 없습니다. 첫 정기세척을 등록하면 기준점이 설정됩니다.</div>';
    else wn.innerHTML='';
    drawHist();
  }
  ['q','fs'].forEach(id=>$('#'+id).addEventListener('input',drawList));

  function drawSteps(){
    const box=$('#steps'); box.innerHTML='';
    STEPS.filter(s=>s.is_active!==false).forEach(s=>{
      const l=el('label'); l.style.cssText='display:flex;gap:6px;align-items:center;padding:3px 0;color:#4d5a68';
      l.innerHTML='<input type="checkbox" class="ws" value="'+esc(s.step_name)+'"> <b style="color:#7b8794">'+s.step_no+'</b> '+esc(s.step_name);
      box.appendChild(l);
    });
    $('#stepCnt').textContent='('+box.querySelectorAll('.ws').length+'항목 · 정기세척은 전 항목 완료 권장)';
  }
  async function drawHist(){
    const h=$('#hist'); if(!sel){h.innerHTML='';return;}
    const rows=await KI.get(OBJ.wash+'?select=*&mold_code=eq.'+encodeURIComponent(sel.mold_code)+'&order=wash_date.desc&limit=10');
    h.innerHTML='<div style="font-weight:800;color:#41556a;margin-bottom:4px">세척 이력</div>'+
      (rows.length?'<table class="grid"><thead><tr><th style="width:92px">세척일</th><th style="width:60px">구분</th>'+
      '<th style="width:80px">실시자</th><th style="width:100px">누적 타발수</th><th style="width:60px">단계</th>'+
      '<th style="width:60px">판정</th><th>비고</th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td class="center">'+esc(r.wash_date)+'</td>'+
        '<td class="center">'+(r.wash_type==='정기'?'<span class="badge b-run">정기</span>':'일상')+'</td>'+
        '<td class="center">'+esc(r.worker||'')+'</td><td class="num">'+fmt(r.shot_count)+'</td>'+
        '<td class="center">'+(r.step_done||0)+'/6</td>'+
        '<td class="center">'+(r.judgement==='불량'?'<span style="color:#b23030;font-weight:700">불량</span>':'양호')+'</td>'+
        '<td>'+esc(r.remark||'')+'</td></tr>').join('')+'</tbody></table>'
      :'<div style="color:#96a2ad">세척 이력이 없습니다.</div>');
  }

  async function save(){
    const m=$('#wMsg');
    if(!sel){ m.className='msg err'; m.textContent='좌측에서 금형을 선택하세요.'; return; }
    if(!$('#fBy').value.trim()){ m.className='msg err'; m.textContent='실시자를 입력하세요.'; return; }
    const type=$('#fType').value;
    const steps=[...document.querySelectorAll('.ws:checked')].map(c=>c.value);
    if(type==='정기' && steps.length<STEPS.length &&
       !confirm('정기세척인데 '+steps.length+'/'+STEPS.length+'항목만 체크되어 있습니다.\n그대로 등록할까요?')) return;
    const shot=Number(String($('#fShot').value).replace(/[^0-9.]/g,''))||null;
    m.className='msg'; m.textContent='저장중...';
    try{
      await KI.ins(TBL.wash,[{mold_code:sel.mold_code, wash_date:$('#fDate').value||null,
        wash_type:type, worker:$('#fBy').value.trim(), shot_count:shot,
        steps:steps, judgement:$('#fJudge').value, remark:$('#fRem').value||null}]);
      m.className='msg ok';
      m.textContent='✓ '+type+'세척 등록'+(type==='정기'?' · 기준점 '+fmt(shot)+'타로 리셋':'');
      KI.msg('✓ '+sel.mold_code+' '+type+'세척 등록');
      $('#fRem').value=''; document.querySelectorAll('.ws:checked').forEach(c=>c.checked=false);
      await load(); 
    }catch(e){ m.className='msg err'; m.textContent='❌ '+e.message; }
  }
  $('#bSave').addEventListener('click',save);
  if(!CAN_S){ $('#bSave').disabled=true; $('#bSave').style.opacity=.5; }

  async function bulk(){
    if(!CAN_S) return alert('저장 권한이 없습니다.');
    const mode=prompt('일괄 등록 대상\n 1 = 도래 금형만\n 2 = 도래 + 임박(90%↑)','1');
    if(mode!=='1'&&mode!=='2')return;
    const tgt=STAT.filter(r=>String(r.wash_status).startsWith('도래')||(mode==='2'&&r.wash_status==='임박'));
    if(!tgt.length) return alert('대상 금형이 없습니다.');
    const by=$('#fBy').value.trim()||'일괄';
    if(!confirm(tgt.length+'건에 정기세척(6단계 완료·양호) 이력을 만듭니다.\n'+
       '누적 타발수가 새 기준점이 되어 사용 타발수가 리셋됩니다.\n\n'+
       tgt.map(r=>r.mold_code).join(', ')+'\n\n계속할까요?'))return;
    try{
      const all=STEPS.filter(s=>s.is_active!==false).map(s=>s.step_name);
      await KI.ins(TBL.wash, tgt.map(r=>({mold_code:r.mold_code, wash_date:$('#fDate').value||null,
        wash_type:'정기', worker:by, shot_count:r.cur_shot, steps:all, judgement:'양호',
        remark:'일괄 등록'})));
      await load(); alert('✓ '+tgt.length+'건 정기세척 등록 완료');
    }catch(e){ alert('❌ '+e.message); }
  }

  function csv(){
    const head=['품번','금형명','고객사','등급','생산구분','기준점','현재누적','사용타발수','한도','소진율','경과일','판정'];
    const body=STAT.map(r=>[r.mold_code,r.mold_name,r.customer_name,r.grade,r.prod_type,
      r.base_shot,r.cur_shot,r.used_shot,r.limit_shot,r.shot_pct,r.days_since,r.wash_status]
      .map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','));
    const a=el('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+head.join(',')+'\n'+body.join('\n')],{type:'text/csv'}));
    a.download='세척도래현황_'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  }

  async function load(){
    const [st,sp]=await Promise.all([
      KI.get(OBJ.washStat+'?select=*&order=mold_code.asc'),
      KI.get(OBJ.washStep+'?select=*&order=step_no.asc')
    ]);
    STAT=st; STEPS=sp;
    if(!sel){
      const pm=new URLSearchParams(location.search).get('mold');
      if(pm) sel=STAT.find(r=>r.mold_code===pm)||null;
    }
    if(sel) sel=STAT.find(r=>r.mold_code===sel.mold_code)||null;
    drawSum(); drawList(); drawSteps();
    if(sel) pick();
    KI.msg('세척 대상 '+STAT.length+'건');
  }
  try{ await load(); }
  catch(e){
    const b=document.querySelector('#list');
    if(b) b.innerHTML='<div style="padding:18px;color:#b0442f;line-height:1.8">'+
      '❌ 데이터를 불러오지 못했습니다.<br><b>'+KI.esc(e.message)+'</b><br>'+
      '<span style="color:#7b8794">관리자에게 문의하거나 [새로고침]을 눌러 다시 시도하세요.</span></div>';
    KI.msg('❌ '+e.message);
  }
})();
</script>
</body>
</html>
