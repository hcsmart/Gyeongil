<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KI MES - 통합관리시스템</title>
<style>
:root{
  --top1-h:36px; --top2-h:72px; --left-w:210px; --tab-h:32px;
  --blue:#2d66ad; --blue-dark:#1f4f8c; --line:#a9b6c4;
  --text:#25313d; --shadow:rgba(24,45,67,.15);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--text);background:#dfe5ea;overflow:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
body.locked .top-level-1,body.locked .top-level-2,body.locked .left-panel,
body.locked .workspace,body.locked .bottom-status{display:none}

/* ===== PIN 잠금 ===== */
.pin-lock{position:fixed;inset:0;z-index:900;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(160deg,#233c5c,#12233a)}
body.locked .pin-lock{display:flex}
.pl-logo{color:#e8f0fa;font-size:22px;font-weight:900;letter-spacing:1px}
.pl-logo span{color:#7fb3ea}
.pl-sub{color:#9fb6cf;font-size:12px}
.pl-notice{margin:2px 0 4px;padding:7px 14px;border:1px solid #3d6ea8;border-radius:4px;
  background:rgba(45,102,173,.22);color:#cfe0f2;font-size:12px}
.pl-notice b{color:#ffd166;font-size:13px;letter-spacing:1px}
.pl-hint{color:#cfe0f2;font-size:12px;height:16px}
.pl-hint.ok{color:#7ee3a6}.pl-hint.err{color:#ff9a9a}
.pl-dots{display:flex;gap:10px;margin:4px 0 2px}
.pl-dot{width:13px;height:13px;border-radius:50%;border:1px solid #6f8fb5;background:transparent}
.pl-dot.on{background:#7fb3ea;border-color:#7fb3ea}
.pl-dots.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pl-keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.pl-key{height:52px;border:1px solid #48688f;border-radius:4px;background:linear-gradient(#2f4f74,#24405f);color:#e8f1fa;font-size:18px;font-weight:700}
.pl-key:hover{background:#365a83}
.pl-lockout{color:#ff9a9a;font-size:12px}
.pl-ver{position:fixed;bottom:12px;color:#5f7994;font-size:11px}

/* 1차 메뉴 */
.top-level-1{position:fixed;left:0;right:0;top:0;height:var(--top1-h);z-index:100;display:flex;align-items:stretch;
  background:linear-gradient(#f9fbfc,#e4eaf0);border-bottom:1px solid #8d9aaa;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.app-mark{width:78px;display:flex;align-items:center;justify-content:center;border-right:1px solid #b7c1cb;background:#f1f4f7;
  font-weight:900;color:#b63b30;letter-spacing:.5px}
.l1-menu{display:flex;align-items:stretch;overflow:auto;white-space:nowrap}
.l1-btn{min-width:110px;padding:0 14px;border:0;border-right:1px solid #c6ced6;background:transparent;color:#3d4a58;font-weight:700}
.l1-btn:hover{background:#edf3f9;color:var(--blue-dark)}
.l1-btn.active{background:#dce8f5;color:var(--blue-dark);box-shadow:inset 0 -3px 0 var(--blue)}
.top-status{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 10px;color:#6f7c89;font-size:11px;
  background:#f8fafc;border-left:1px solid #c6ced6}
.status-dot{width:7px;height:7px;background:#2f9d63;border-radius:50%}
.status-dot.off{background:#c0392b}
.gs-wrap{position:relative;display:flex;align-items:center}
.gs-input{height:22px;width:150px;border:1px solid #aeb9c4;padding:0 6px;background:#fff}
.gs-pop{position:absolute;top:26px;right:0;width:280px;max-height:320px;overflow:auto;z-index:200;background:#fff;
  border:1px solid #8494a4;box-shadow:0 4px 10px rgba(0,0,0,.18);display:none}
.gs-pop.on{display:block}
.gs-item{padding:6px 8px;border-bottom:1px solid #eef1f4;cursor:pointer;color:#42515f}
.gs-item:hover{background:#e8f1fa}
.gs-item b{color:#1f4f8c}
.gs-item .p{color:#8b98a5;font-size:10px}
.mini-btn{height:22px;border:1px solid #9aa8b6;background:linear-gradient(#fff,#e6ebf0);padding:0 8px;color:#43536a}
.mini-btn:hover{border-color:#6e8fb3;background:#edf5fd}

/* 2차 메뉴 */
.top-level-2{position:fixed;top:var(--top1-h);left:0;right:0;height:var(--top2-h);z-index:90;display:flex;align-items:stretch;
  background:linear-gradient(#f7f9fb,#e8edf2);border-bottom:1px solid #929fad}
.l2-title{width:78px;display:flex;align-items:center;justify-content:center;background:#eef2f6;border-right:1px solid #bdc7d0;color:#677482;font-weight:700}
.l2-menu{display:flex;align-items:stretch;overflow:auto;min-width:0}
.l2-btn{position:relative;min-width:96px;padding:8px 10px 6px;border:0;border-right:1px solid #ccd3da;background:transparent;color:#4b5967;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.l2-btn:hover{background:#fdfefe}
.l2-btn.active{background:#fff;color:var(--blue-dark);box-shadow:inset 0 -3px 0 var(--blue)}
.l2-icon{width:28px;height:28px;display:grid;place-items:center;font-size:18px;border:1px solid #bcc7d2;
  background:linear-gradient(#fff,#e9eef3);box-shadow:inset 0 0 0 1px #fff}
.l2-label{font-weight:700;font-size:11px}

/* 좌측 메뉴 */
.left-panel{position:fixed;top:calc(var(--top1-h) + var(--top2-h));left:0;bottom:0;width:var(--left-w);z-index:80;
  background:#f4f6f8;border-right:1px solid #8f9dab;box-shadow:2px 0 4px rgba(0,0,0,.04);display:flex;flex-direction:column}
.left-head{height:34px;padding:0 10px;display:flex;align-items:center;gap:7px;background:linear-gradient(#edf2f6,#dbe3ea);
  border-bottom:1px solid #9eabb8;color:#314355;font-weight:800}
.left-head .tiny{font-size:10px;color:#7a8793;margin-left:auto}
.tree{padding:4px 0;overflow:auto;flex:1;background:#f8fafb}
.tree-group{border-bottom:1px solid #d5dce3}
.tree-caption{padding:7px 10px;background:#edf2f6;color:#546271;font-weight:800;display:flex;align-items:center;gap:6px}
.tree-caption::before{content:"▾";font-size:10px;color:#738394}
.tree-item{width:100%;border:0;background:transparent;text-align:left;padding:7px 8px 7px 26px;color:#475563;
  border-top:1px solid #f1f3f5;position:relative}
.tree-item::before{content:"•";position:absolute;left:15px;color:#7d8b99}
.tree-item:hover{background:#e8f0f8;color:#1f4f8c}
.tree-item.active{background:#d6e5f6;color:#153f74;font-weight:800;box-shadow:inset 3px 0 0 var(--blue)}
.recent-box{border-top:1px solid #9eabb8;background:#eef2f6;padding:4px 0 6px;max-height:150px;overflow:auto}
.recent-cap{padding:5px 10px;color:#667483;font-weight:800;font-size:11px}
.recent-item{width:100%;border:0;background:transparent;text-align:left;padding:5px 10px 5px 20px;color:#5a6875;position:relative}
.recent-item::before{content:"↩";position:absolute;left:8px;color:#96a3b0;font-size:10px}
.recent-item:hover{background:#dfe9f4;color:#1f4f8c}

/* 본문 + 누적 탭 */
.workspace{position:fixed;top:calc(var(--top1-h) + var(--top2-h));left:var(--left-w);right:0;bottom:0;background:#cdd5dc;
  display:flex;flex-direction:column;min-width:0}
.tabbar{height:var(--tab-h);display:flex;align-items:flex-end;gap:2px;padding:4px 5px 0;
  background:linear-gradient(#e7ecf1,#cfd7df);border-bottom:1px solid #8493a2;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.tab{height:28px;min-width:115px;max-width:210px;display:flex;align-items:center;border:1px solid #97a6b5;border-bottom:0;
  background:linear-gradient(#f5f7f9,#d9e0e7);color:#566371;padding:0 5px 0 9px;box-shadow:0 -1px 0 rgba(255,255,255,.7) inset;cursor:pointer}
.tab.active{background:#fff;color:#234d7f;font-weight:800;border-color:#7990a8;position:relative;z-index:2}
.tab .tab-title{overflow:hidden;text-overflow:ellipsis}
.tab .close{margin-left:auto;width:20px;height:20px;border:0;background:transparent;color:#7e8994;font-size:14px;line-height:18px;padding:0}
.tab .close:hover{background:#e1e7ed;color:#b23030}
.tab .close.hide{visibility:hidden}

.content-shell{flex:1;min-height:0;padding:7px;padding-bottom:29px;background:#dfe4e9}
.page{height:100%;background:#fff;border:1px solid #8f9cab;box-shadow:0 1px 3px var(--shadow);display:none;overflow:auto;flex-direction:column}
.page.active{display:flex}
.page-title{height:34px;display:flex;align-items:center;padding:0 9px;gap:8px;flex:0 0 auto;
  background:linear-gradient(#fbfcfd,#e8edf2);border-bottom:1px solid #a9b6c2}
.page-title h2{font-size:14px;margin:0;color:#41556a;font-weight:800}
.page-title h2::before{content:"◯";margin-right:5px;color:#76879a;font-size:13px}
.page-title .sub{font-size:10px;color:#8894a0}
.page-actions{margin-left:auto;display:flex;gap:4px}
.erp-btn{height:24px;padding:0 10px;border:1px solid #9aa8b6;background:linear-gradient(#fff,#e1e7ec);color:#405163}
.erp-btn:hover{border-color:#6e8fb3;background:#edf5fd}
.erp-btn.primary{background:linear-gradient(#4f84c0,#2e67a8);color:#fff;border-color:#24578f}

/* 검색 조건 */
.search-panel{margin:7px;border:1px solid #a9b6c3;background:#f7f9fb;flex:0 0 auto}
.search-row{display:grid;grid-template-columns:96px minmax(130px,1fr) 96px minmax(130px,1fr) 96px minmax(130px,1fr);border-bottom:1px solid #d6dde4}
.search-row:last-child{border-bottom:0}
.search-label{display:flex;align-items:center;padding:5px 7px;background:#edf2f6;border-right:1px solid #d1d9e0;color:#526171;font-weight:700}
.search-field{padding:4px 6px;border-right:1px solid #e0e5ea;display:flex;align-items:center;gap:4px}
.search-field:last-child{border-right:0}
.search-field input,.search-field select{height:24px;width:100%;border:1px solid #aeb9c4;background:#fff;padding:0 6px;color:#42515f}

/* 그리드 */
.grid-wrap{margin:7px;border:1px solid #8494a4;overflow:auto;background:#fff;flex:1;min-height:120px}
.grid-toolbar{height:28px;background:#edf2f6;border-bottom:1px solid #aab6c1;display:flex;align-items:center;padding:0 6px;gap:4px;
  color:#697785;position:sticky;top:0;z-index:3}
.grid-toolbar .right{margin-left:auto}
table.erp-grid{width:100%;border-collapse:collapse;table-layout:fixed}
.erp-grid th{height:27px;background:linear-gradient(#f3f6f8,#dce3e9);border-right:1px solid #aab7c3;border-bottom:1px solid #91a0af;
  color:#4a5968;font-weight:800;text-align:center;padding:0 5px;white-space:nowrap;position:sticky;top:28px;z-index:2}
.erp-grid td{height:26px;border-right:1px solid #d0d7de;border-bottom:1px solid #d9dfe5;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erp-grid tr:nth-child(even) td{background:#fafbfc}
.erp-grid tr:hover td{background:#e8f1fa}
.erp-grid tr.selected td{background:#2f68ad;color:#fff}
.erp-grid .num{text-align:right}
.erp-grid .center{text-align:center}
.badge{display:inline-block;padding:0 6px;border-radius:2px;font-weight:700;font-size:11px;border:1px solid transparent}
.b-wait{background:#fdf3e0;color:#8a5b12;border-color:#e6cfa2}
.b-run{background:#e6f0fb;color:#1f4f8c;border-color:#b8cfe9}
.b-done{background:#e6f5eb;color:#15803d;border-color:#b4ddc3}
.b-late{background:#fdecec;color:#b91c1c;border-color:#eab8b8}
.bar{height:12px;background:#e6ebf0;border:1px solid #c8d2dc;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(#5b93cd,#2e67a8)}
.trace-chain{color:#41556a}
.trace-chain b{color:#1f4f8c}

.info-box{margin:7px;border:1px solid #aab6c2;background:#f8fafc;padding:10px;line-height:1.8;color:#4d5a68;flex:0 0 auto}
.info-box b{color:#2e5f95}

/* 설정(비밀번호) */
.set-wrap{padding:12px;overflow:auto;flex:1;min-height:0;background:#f2f5f8}
.set-card{max-width:640px;border:1px solid #a0aebc;background:#fff;margin-bottom:12px}
.set-card h3{margin:0;height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:#41556a;
  background:linear-gradient(#f4f7fa,#e5ebf1);border-bottom:1px solid #b3bfca}
.set-card h3 .tag{margin-left:auto;font-size:10px;font-weight:400;padding:1px 6px;border:1px solid #c3ccd6;background:#fff;color:#7b8794}
.set-body{padding:12px}
.set-row{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:8px;margin-bottom:8px}
.set-row label{color:#526171;font-weight:700}
.set-row input{height:28px;border:1px solid #aeb9c4;padding:0 8px;color:#42515f;letter-spacing:4px;font-size:14px}
.set-foot{display:flex;gap:6px;align-items:center;padding-top:6px;border-top:1px solid #e3e8ed;margin-top:10px}
.set-msg{font-size:11px;font-weight:700}
.set-msg.ok{color:#15803d}.set-msg.err{color:#b91c1c}
.set-note{max-width:640px;margin:0 0 10px;padding:8px 10px;border:1px solid #d8c48a;background:#fdf7e3;color:#7a6321;line-height:1.7}
.set-note b{color:#a4761a}
.set-warn{max-width:640px;margin:0 0 10px;padding:8px 10px;border:1px solid #e0a9a9;background:#fdecec;color:#8c2b2b;line-height:1.7}

/* 하단 상태바 */
.bottom-status{position:fixed;left:var(--left-w);right:0;bottom:0;height:22px;display:flex;align-items:center;padding:0 8px;
  background:#e7ecf0;border-top:1px solid #9aa8b5;color:#6f7b87;font-size:10px;z-index:85}
.bottom-status .right{margin-left:auto}

@media(max-width:900px){
  :root{--left-w:175px}
  .l1-btn{min-width:90px;padding:0 10px}
  .l2-btn{min-width:80px}
  .search-row{grid-template-columns:88px 1fr 88px 1fr}
  .search-row .hide-sm{display:none}
  .gs-input{width:100px}
}
</style>
</head>
<body class="locked">

<!-- PIN 잠금 -->
<div class="pin-lock" id="pinLock">
  <div class="pl-logo">KI <span>MES</span></div>
  <div class="pl-sub">통합관리시스템</div>
  <div class="pl-notice" id="plNotice">초기 비밀번호 : <b>123456</b> (6자리) · 접속 후 [설정 &gt; 비밀번호 설정]에서 변경하세요</div>
  <div class="pl-hint" id="plHint">6자리 PIN을 입력하세요</div>
  <div class="pl-dots" id="plDots"></div>
  <div class="pl-lockout" id="plLockout" style="display:none"></div>
  <div class="pl-keypad" id="plKeypad"></div>
  <div class="pl-ver">v4.0 · 통합관리</div>
</div>

<!-- 1차 메뉴 -->
<header class="top-level-1">
  <div class="app-mark">KI MES</div>
  <nav class="l1-menu" id="l1Menu"></nav>
  <div class="top-status">
    <div class="gs-wrap">
      <input class="gs-input" id="gsInput" placeholder="🔍 메뉴 검색" autocomplete="off">
      <div class="gs-pop" id="gsPop"></div>
    </div>
    <button class="mini-btn" id="verBtn" title="변경이력">ⓘ</button>

    <button class="mini-btn" id="logoutBtn">🔒</button>
    <span class="status-dot" id="netDot"></span><span id="netTxt">Connected</span><span id="clock"></span>
  </div>
</header>

<!-- 2차 메뉴 -->
<section class="top-level-2">
  <div class="l2-title">업무메뉴</div>
  <nav class="l2-menu" id="l2Menu"></nav>
</section>

<!-- 좌측 메뉴 -->
<aside class="left-panel">
  <div class="left-head"><span id="leftTitle">메뉴</span><span class="tiny">MENU</span></div>
  <div class="tree" id="treeMenu"></div>
  <div class="recent-box">
    <div class="recent-cap">최근 사용</div>
    <div id="recentList"></div>
  </div>
</aside>

<main class="workspace">
  <div class="tabbar" id="tabbar"></div>
  <div class="content-shell" id="contentShell"></div>
</main>

<div class="bottom-status">
  <span id="stUser">사용자: -</span>
  <span style="margin-left:18px">KI 통합관리시스템</span>
  <span class="right" id="stRight">KI MES v4.0 · Ready</span>
</div>

<script>
/* ==================== 설정 ==================== */
const VER = 'v3.0';

  '[v3.0] · Supabase 실데이터 연동 / PIN 서버 저장\n'+
  '[v2.0] · 화면 프레임 신규 구축';

const SUPABASE_URL = 'https://ipggvrzxfcryzryileuv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CHO-dAOU00HNwno52255mg_H3C1_vew';

const PIN_LEN = 6;
const DEFAULT_PIN = '123456';
/* --- DB 오브젝트 (KI MES 전용, 모두 ki_ 접두어) ---------------
   타 Supabase 이전 시 아래 이름만 맞춰주면 됨
   ki_app_settings   : 자체 테이블 (PIN 등 설정)
   ki_v_*            : 기존 시스템 테이블을 감싼 조회 전용 뷰
------------------------------------------------------------- */
const DB_PREFIX = 'ki_';
const OBJ = {
  settings : DB_PREFIX+'app_settings',
  order    : DB_PREFIX+'v_osp_order',
  receipt  : DB_PREFIX+'v_osp_receipt',
  progress : DB_PREFIX+'v_lot_progress',
  route    : DB_PREFIX+'v_std_route',
  vendor   : DB_PREFIX+'v_vendor',
  process  : DB_PREFIX+'v_process'
};
const TBL_SET = OBJ.settings;
const K_MASTER = 'pin_master', K_USER = 'pin_user';

const LK_AUTH='ki_session', LK_FAIL='ki_pin_fail', LK_TABS='ki_lot_tabs', LK_RECENT='ki_lot_recent',
      LK_PINCACHE='ki_pin_cache';
const SESSION_DAYS=7, MAX_FAIL=5, LOCKOUT_SEC=60;

/* ==================== 메뉴 ==================== */
const MENU = [
  { key:'sales', name:'영업/수주', second:[
    { key:'so', name:'수주', icon:'▣', groups:[{ name:'수주', items:[
      {id:'sales-order', n:'수주등록', t:'auto', src:'ki_v_sale_orders', d:'고객 발주(PO) 등록 내역'},
      {id:'sales-order-st', n:'수주현황', t:'auto', src:'ki_v_sale_order_status_rows', d:'수주 진행상태 현황'},
      {id:'sales-lines', n:'수주 품목', t:'auto', src:'ki_v_order_lines', d:'수주 품목(라인) 상세'},
      {id:'sales-status', n:'매출현황', t:'auto', src:'ki_v_sales_status_view', d:'기간별 매출 집계'}
    ]}]},
    { key:'sp', name:'판매계획', icon:'📈', groups:[{ name:'판매계획', items:[
      {id:'sales-plan', n:'판매계획', t:'auto', src:'ki_v_sales_plans', d:'연간/월간 판매계획'},
      {id:'sales-plan-st', n:'계획현황', t:'auto', src:'ki_v_sales_plan_status_rows', d:'계획 대비 진척'}
    ]}]},

/* ==================== Supabase ==================== */
async function sbGet(path){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:HDR});
  if(!r.ok) throw new Error('조회 실패 ('+r.status+')');
  return await r.json();
}
async function sbPatch(path,body){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{
    method:'PATCH',headers:Object.assign({'Content-Type':'application/json',Prefer:'return=representation'},HDR),
    body:JSON.stringify(body)});
  if(!r.ok) throw new Error('저장 실패 ('+r.status+')');
  return await r.json();
}
async function sbUpsert(path,body){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{
    method:'POST',headers:Object.assign({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},HDR),
    body:JSON.stringify(body)});
  if(!r.ok) throw new Error('저장 실패 ('+r.status+')');
  return await r.json();
}

/* ==================== PIN (서버 저장) ==================== */
async function sha256hex(t){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function pinCache(){ try{return JSON.parse(localStorage.getItem(LK_PINCACHE)||'{}')}catch(e){return{}} }
function setPinCache(o){ localStorage.setItem(LK_PINCACHE,JSON.stringify(o)); }

async function loadPins(){
  try{
    const rows=await sbGet(TBL_SET+'?select=key,value&key=in.('+K_MASTER+','+K_USER+')');
    const o={};
    rows.forEach(r=>o[r.key]=r.value);
    if(o[K_MASTER]&&o[K_USER]){ setPinCache(o); return o; }
  }catch(e){}
  const c=pinCache();
  if(c[K_MASTER]&&c[K_USER]) return c;      // 오프라인 폴백
  const d=await sha256hex(DEFAULT_PIN);
  return {[K_MASTER]:d,[K_USER]:d};
}
async function savePin(key,hash,who){
  const body={key:key,value:hash,updated_at:new Date().toISOString(),updated_by:who||'-'};
  try{ await sbUpsert(TBL_SET,[body]); }
  catch(e){ await sbPatch(TBL_SET+'?key=eq.'+key,{value:hash,updated_at:body.updated_at,updated_by:body.updated_by}); }
  const c=pinCache(); c[key]=hash; setPinCache(c);
}
async function isDefaultPin(){
  const d=await sha256hex(DEFAULT_PIN), p=await loadPins();
  return {master:p[K_MASTER]===d, user:p[K_USER]===d};
}

function getSession(){
  try{ const s=JSON.parse(localStorage.getItem(LK_AUTH)||'null');
    if(!s||!s.exp||s.exp<Date.now()){localStorage.removeItem(LK_AUTH);return null;} return s;
  }catch(e){return null}
}
function setSession(o){ o.exp=Date.now()+SESSION_DAYS*864e5; localStorage.setItem(LK_AUTH,JSON.stringify(o)); }
function clearSession(){ localStorage.removeItem(LK_AUTH); }
function getFail(){ try{return JSON.parse(localStorage.getItem(LK_FAIL)||'{"count":0,"until":0}')}catch(e){return{count:0,until:0}} }
function setFail(f){ localStorage.setItem(LK_FAIL,JSON.stringify(f)); }
function clearFail(){ localStorage.removeItem(LK_FAIL); }

function buildKeypad(){
  const kp=byId('plKeypad'); kp.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','←','0','✓'].forEach(k=>{
    const b=document.createElement('button'); b.className='pl-key'; b.textContent=k;
    b.addEventListener('click',()=>{ if(k==='←')pinDel(); else if(k!=='✓')pinPress(k); });
    kp.appendChild(b);
  });
}
function buildDots(){
  const d=byId('plDots'); d.innerHTML='';
  for(let i=0;i<PIN_LEN;i++){ const o=document.createElement('div'); o.className='pl-dot'; d.appendChild(o); }
}
function updateDots(){ [...byId('plDots').children].forEach((d,i)=>d.classList.toggle('on',i<curPin.length)); }
function shakeDots(){ const d=byId('plDots'); d.classList.add('shake'); setTimeout(()=>d.classList.remove('shake'),350); curPin=''; updateDots(); }
function pinPress(n){
  if(curPin.length>=PIN_LEN)return;
  if(getFail().until>Date.now())return;
  curPin+=n; updateDots();
  if(curPin.length===PIN_LEN) setTimeout(pinDone,150);
}
function pinDel(){ if(!curPin)return; curPin=curPin.slice(0,-1); updateDots(); }

async function pinDone(){
  const hint=byId('plHint'); hint.className='pl-hint'; hint.textContent='확인 중...';
  try{
    const h=await sha256hex(curPin), p=await loadPins();
    if(h===p[K_MASTER]){
      clearFail(); setSession({role:'admin',name:'관리자'});
      hint.classList.add('ok'); hint.textContent='✓ 관리자 인증'; setTimeout(unlock,300); return;
    }
    if(h===p[K_USER]){
      clearFail(); setSession({role:'user',name:'사용자'});
      hint.classList.add('ok'); hint.textContent='✓ 사용자 인증'; setTimeout(unlock,300); return;
    }
    const f=getFail(); f.count=(f.count||0)+1;
    if(f.count>=MAX_FAIL){ f.until=Date.now()+LOCKOUT_SEC*1000; f.count=0; setFail(f); checkLockout(); }
    else { setFail(f); hint.classList.add('err'); hint.textContent='PIN 불일치 ('+f.count+'/'+MAX_FAIL+')'; }
    shakeDots();
  }catch(err){ hint.classList.add('err'); hint.textContent='❌ '+err.message; shakeDots(); }
}
function checkLockout(){
  const f=getFail(), msg=byId('plLockout');
  if(f.until>Date.now()){
    msg.style.display='block';
    const upd=()=>{
      const s=Math.ceil((f.until-Date.now())/1000);
      if(s<=0){ msg.style.display='none'; clearFail(); clearInterval(lockTimer);
        byId('plHint').className='pl-hint'; byId('plHint').textContent=PIN_LEN+'자리 PIN을 입력하세요'; return; }
      msg.textContent='🔒 '+s+'초 후 재시도';
    };
    upd(); clearInterval(lockTimer); lockTimer=setInterval(upd,1000);
  } else msg.style.display='none';
}
function unlock(){
  document.body.classList.remove('locked');
  byId('pinLock').style.display='none';
  applySession(); bootApp();
}
function applySession(){
  const s=getSession(); if(!s)return;
  byId('userBtn').textContent='👤 '+(s.role==='admin'?'관리자':'사용자');
  byId('stUser').textContent='사용자: '+(s.role==='admin'?'관리자':'사용자');
}

function openPage(id){
  const def=ITEM[id]; if(!def)return;
  if(!openTabs.has(id)){ openTabs.set(id,{id:id,title:def.it.n}); ensurePage(id); }
  activateTab(id);
  currentL1=def.l1; currentL2=def.l2;
  buildL1(); buildL2(); buildTree(); pushRecent(id); saveTabs();
}
function activateTab(id){
  activeTab=id;
  pageEls.forEach((el,k)=>el.classList.toggle('active',k===id));
  renderTabs(); buildTree(); saveTabs();
}
function closePage(id){
  if(openTabs.size<=1)return;
  openTabs.delete(id);
  const el=pageEls.get(id); if(el){ el.remove(); pageEls.delete(id); }
  if(activeTab===id) activateTab([...openTabs.keys()].pop());
  else { renderTabs(); saveTabs(); }
}
function renderTabs(){
  const bar=byId('tabbar'); bar.innerHTML='';
  const only=openTabs.size<=1;
  [...openTabs.values()].forEach(t=>{
    const d=document.createElement('div'); d.className='tab'+(t.id===activeTab?' active':'');
    const s=document.createElement('span'); s.className='tab-title'; s.textContent=t.title;
    const c=document.createElement('button'); c.className='close'+(only?' hide':''); c.textContent='×';
    c.addEventListener('click',ev=>{ev.stopPropagation();closePage(t.id);});
    d.appendChild(s); d.appendChild(c);
    d.addEventListener('click',()=>activateTab(t.id)); bar.appendChild(d);
  });
  requestAnimationFrame(()=>{ const a=bar.querySelector('.tab.active'); if(a)a.scrollIntoView({block:'nearest',inline:'nearest'}); });
}
function pageHead(it,extra){
  const h=document.createElement('div'); h.className='page-title';
  const t=document.createElement('h2'); t.textContent=it.n;
  const s=document.createElement('span'); s.className='sub'; s.textContent=it.d||'';
  const a=document.createElement('div'); a.className='page-actions';
  (extra||[]).forEach(([label,cls,fn])=>{
    const b=document.createElement('button'); b.className='erp-btn'+(cls?' '+cls:''); b.textContent=label;
    b.addEventListener('click',fn); a.appendChild(b);
  });
  const close=document.createElement('button'); close.className='erp-btn'; close.textContent='닫기';
  close.addEventListener('click',()=>closePage(it.id)); a.appendChild(close);
  h.appendChild(t); h.appendChild(s); h.appendChild(a); return h;
}

  if(kind==='date2'){

    optList(kind).forEach(v=>{ const o=document.createElement('option'); o.textContent=v; s.appendChild(o); });
    w.appendChild(s);
  }
  return w;
}

function readFilters(sp){

/* ==================== 데이터 가공 ==================== */
const today=()=>new Date();
function dayDiff(s){
  if(!s)return null;
  const d=new Date(s+'T00:00:00'); if(isNaN(d))return null;
  return Math.floor((today()-d)/864e5);
}
function procName(code){ return PROCMAP[code]||''; }

function postStock(rows){
  return rows.filter(r=>!r.idate)
    .map((r,i)=>Object.assign({},r,{
      _i:i+1, _days:dayDiff(r.odate),
      _due: !r.edate ? '-' : (dayDiff(r.edate)>0 ? '지연' : '정상')
    }));
}
function postTrace(rows){
  const out=[];
  rows.forEach(r=>{
    const steps=Array.isArray(r.steps)?r.steps:[];
    const chain=steps.map(s=>s.mp).join(' → ');
    steps.forEach((s,i)=>{
      out.push({
        job:r.job, part:r.part, proc:r.proc, seq:i+1,
        mp:s.mp, mpName:procName(s.mp), vendor:s.vendor, date:s.date,
        prevMp: i>0?steps[i-1].mp:'-', nextMp: i<steps.length-1?steps[i+1].mp:'-',
        chain:chain
      });
    });
  });
  out.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  out.forEach((r,i)=>r._i=i+1);
  return out;
}
/* 진행 공정열과 가장 잘 맞는 표준공정 경로 추정 */
function matchRoute(mps){
  let best=null, bestScore=-1;
  ROUTES.forEach(rt=>{
    const st=Array.isArray(rt.steps)?rt.steps:[];
    let hit=0, pos=0;
    mps.forEach(m=>{ const k=st.indexOf(m,pos); if(k>=0){ hit++; pos=k+1; } });
    const score=hit*100 - st.length;           // 많이 맞고 짧은 경로 우선
    if(hit>0 && score>bestScore){ bestScore=score; best=rt; }
  });
  return best;
}
function postRoute(rows){
  return rows.map((r,i)=>{
    const steps=Array.isArray(r.steps)?r.steps:[];
    const last=steps[steps.length-1]||{};
    const mps=steps.map(s=>s.mp);
    const rt=matchRoute(mps);
    const stdSteps=rt?rt.steps:[];
    const total=stdSteps.length||steps.length||1;
    const done=Math.min(steps.length,total);
    const nextMp=stdSteps[done]||'';
    return {
      _i:i+1, job:r.job, part:r.part, proc:r.proc,
      mp:last.mp||'-', mpName:procName(last.mp), vendor:last.vendor||'-', date:last.date||'',
      stdName: rt?rt.standard_process_name:'(미매칭)',
      nextMp: nextMp ? nextMp+(procName(nextMp)?' · '+procName(nextMp):'') : '완료',
      done:done, total:total, _rate:total?Math.round(done/total*100):0,
      chain:steps.map(s=>s.mp+'('+(s.vendor||'')+')').join(' → ')
    };
  });
}
function postStd(rows){
  return rows.map(r=>{
    const st=Array.isArray(r.steps)?r.steps:[];
    return Object.assign({},r,{_cnt:st.length,_steps:st.join(' → ')});
  });
}
function postIssue(rows){
  return rows.filter(r=>r.odate).map((r,i)=>Object.assign({_i:i+1},r));
}
const POST={stock:postStock,issue:postIssue,trace:postTrace,route:postRoute,std:postStd};

function applyLocalFilter(rows,filters){
  return rows.filter(r=>filters.every(f=>{
    const v=r[f.f];
    if(f.op==='like') return String(v==null?'':v).toLowerCase().includes(f.v.toLowerCase());
    if(f.op==='eq')   return String(v==null?'':v)===f.v;
    if(f.op==='gte')  return String(v==null?'':v)>=f.v;
    if(f.op==='lte')  return String(v==null?'':v)<=f.v;
    if(f.op==='min')  return Number(v||0)>=Number(f.v);
    return true;
  }));
}

/* ==================== 셀 렌더 ==================== */
function cellHtml(row,col){
  const [label,w,cls,field,ctype]=col;
  const v=row[field];
  if(ctype==='won')  return v?Number(v).toLocaleString():'';
  if(ctype==='days') return v==null?'-':v+'일';
  if(ctype==='mp')   return v?esc(v)+(procName(v)?' · '+esc(procName(v)):''):'';
  if(ctype==='st'){
    const s=String(v==null?'':v);
    const k = /완료|확인|정상/.test(s)?'b-done' : /지연|취소/.test(s)?'b-late' : /대기/.test(s)?'b-wait':'b-run';
    return s?'<span class="badge '+k+'">'+esc(s)+'</span>':'';
  }
  if(ctype==='bar'){
    const p=Number(v||0);
    return '<div class="bar" title="'+p+'%"><i style="width:'+Math.max(0,Math.min(100,p))+'%"></i></div>';
  }
  if(ctype==='bool') return v===true?'<span class="badge b-done">✓</span>':(v===false?'<span style="color:#a7b3bf">–</span>':'');
  if(ctype==='json'){
    if(v==null)return '';
    const s=Array.isArray(v)?v.map(x=>typeof x==='object'?JSON.stringify(x):x).join(' → '):JSON.stringify(v);
    return '<span class="trace-chain">'+esc(s.length>120?s.slice(0,120)+'…':s)+'</span>';
  }
  if(ctype==='chain') return '<span class="trace-chain">'+esc(String(v==null?'':v)).replace(/→/g,'<b>→</b>')+'</span>';
  return esc(String(v==null?'':v));
}


/* ==================== 스키마 자동 인식 ==================== */
async function loadSchema(){
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/',{headers:HDR});
    if(!r.ok) return;
    const spec=await r.json();
    const defs=spec.definitions||(spec.components&&spec.components.schemas)||{};
    Object.keys(defs).forEach(k=>{
      const props=defs[k].properties||{};
      SCHEMA[k]=Object.keys(props).map(c=>({name:c,type:props[c].type,format:props[c].format}));
    });
  }catch(e){}
}
function colWidth(c,t){
  if(isDateCol(c)) return 92;
  if(t==='boolean') return 58;
  if(isMoneyCol(c)) return 100;
  if(isNumCol(c))   return 78;
  const L=label(c).length;
  return Math.min(180, Math.max(72, L*15));
}
function autoCols(list){
  const cols=list.map(f=>{
    const c=f.name, t=f.type;
    const cls = (t==='number'||t==='integer') ? 'num' : (t==='boolean'||isDateCol(c)) ? 'center' : '';
    const ctype = t==='boolean' ? 'bool'
                : isMoneyCol(c) && (t==='number'||t==='integer') ? 'won'
                : (t==='object'||t==='array'||f.format==='jsonb') ? 'json'
                : /(status|판정|judgement|^st$|order_status|match_status|result)/.test(c) ? 'st' : '';
    return [label(c), colWidth(c,t), cls, c, ctype];
  });
  if(cols.length) cols[cols.length-1][1]=0;   // 마지막 컬럼 가변폭
  return cols;
}
const SEARCH_PRIORITY=[/^job/,/^part/,/vendor/,/customer/,/^item/,/^model/,/status$|^st$/,/name$/,/code$/,/^proc|^mp$/];
function autoSearch(list){
  const out=[], used={};
  const dateCol=list.find(f=>isDateCol(f.name));
  if(dateCol){ out.push([label(dateCol.name),'date2',dateCol.name]); used[dateCol.name]=1; }
  SEARCH_PRIORITY.forEach(rx=>{
    if(out.length>=6) return;
    list.forEach(f=>{
      if(out.length>=6||used[f.name]) return;
      if(f.type!=='string'||isDateCol(f.name)) return;
      if(!rx.test(f.name)) return;
      used[f.name]=1;
      out.push([label(f.name), /^(vendor|vendor_name)$/.test(f.name)?'sel-vendor':'text', f.name]);
    });
  });
  list.forEach(f=>{
    if(out.length>=6||used[f.name]||f.type!=='string'||isDateCol(f.name))return;
    used[f.name]=1; out.push([label(f.name),'text',f.name]);
  });
  return out.length?out:[['검색','text','__none']];
}
function autoDef(it,rows){
  let list=SCHEMA[it.src];
  if((!list||!list.length) && rows && rows.length){
    const r0=rows[0];
    list=Object.keys(r0).map(c=>({name:c,type:typeof r0[c]==='number'?'number':(typeof r0[c]==='boolean'?'boolean':'string')}));
  }
  list=list||[];
  const order = list.length ? list[0].name+'.asc' : null;
  return { table:it.src, select:'*', order:order, cols:autoCols(list), search:autoSearch(list), auto:true };
}

function buildGridPage(p,it){
  const def = VIEWS[it.id] || autoDef(it,null);
  if(!def || !def.table){
    p.appendChild(pageHead(it,[]));
    const w=document.createElement('div'); w.className='info-box';
    w.innerHTML='<b>'+esc(it.n)+'</b> — 연결된 데이터 오브젝트가 없습니다.';
    p.appendChild(w); return;
  }
  const state={rows:[]};
  const head=pageHead(it,[
    ['조회','primary',b=>run(b.target)],
    ['초기화','',()=>{ sp.querySelectorAll('input').forEach(i=>i.value=''); sp.querySelectorAll('select').forEach(s=>s.selectedIndex=0); }],
    ['엑셀(CSV)','',()=>exportCsv(it,def,state.rows)],
    ['인쇄','',()=>window.print()]
  ]);
  p.appendChild(head);
  const sp=buildSearchPanel(def); p.appendChild(sp);

  const gw=document.createElement('div'); gw.className='grid-wrap';
  const tb=document.createElement('div'); tb.className='grid-toolbar';
  const info=document.createElement('span'); info.textContent=def.table;
  info.style.color='#94a1ae'; info.style.fontSize='10px';
  const cnt=document.createElement('span'); cnt.className='right'; cnt.textContent='총 0건';
  tb.appendChild(info); tb.appendChild(cnt); gw.appendChild(tb);

  const tbl=document.createElement('table'); tbl.className='erp-grid';
  const thead=document.createElement('thead'); const tr=document.createElement('tr');
  def.cols.forEach(([n,w])=>{ const th=document.createElement('th'); th.textContent=n; if(w)th.style.width=w+'px'; tr.appendChild(th); });
  thead.appendChild(tr); tbl.appendChild(thead);
  const tbody=document.createElement('tbody'); tbl.appendChild(tbody);
  gw.appendChild(tbl); p.appendChild(gw);

  function msg(txt){
    tbody.innerHTML='';
    const r=document.createElement('tr'), d=document.createElement('td');
    d.colSpan=def.cols.length; d.className='center'; d.style.color='#8894a0'; d.style.height='60px'; d.textContent=txt;
    r.appendChild(d); tbody.appendChild(r);
  }
  async function run(btn){
    const old=btn?btn.textContent:''; if(btn){btn.textContent='조회중...';btn.disabled=true;}
    msg('조회중...');
    try{
      const filters=readFilters(sp);
      let q=def.table+'?select='+(def.select||'*');
      if(def.where) q+='&'+def.where;
      if(def.order) q+='&order='+def.order;
      q+='&limit=2000';
      let rows=await sbGet(q);
      if(def.auto && !def.cols.length && rows.length){
        const nd=autoDef(it,rows); def.cols=nd.cols;
        tr.innerHTML=''; def.cols.forEach(([n,w])=>{ const th=document.createElement('th'); th.textContent=n; if(w)th.style.width=w+'px'; tr.appendChild(th); });
      }
      if(def.post) rows=POST[def.post](rows);
      else rows=rows.map((r,i)=>Object.assign({_i:i+1},r));
      rows=applyLocalFilter(rows,filters);
      state.rows=rows;
      tbody.innerHTML='';
      if(!rows.length){ msg('조회 결과가 없습니다'); }
      else rows.forEach(r=>{
        const trr=document.createElement('tr');
        def.cols.forEach(c=>{
          const td=document.createElement('td'); td.className=c[2]||'';
          td.innerHTML=cellHtml(r,c);
          td.title=td.textContent;
          trr.appendChild(td);
        });
        trr.addEventListener('click',()=>{
          tbody.querySelectorAll('tr.selected').forEach(x=>x.classList.remove('selected'));
          trr.classList.add('selected');
        });
        tbody.appendChild(trr);
      });
      cnt.textContent='총 '+rows.length.toLocaleString()+'건';
    }catch(e){ msg('❌ '+e.message); cnt.textContent='총 0건'; }
    if(btn){btn.textContent=old;btn.disabled=false;}
  }
  msg('조회 조건을 입력한 후 [조회] 버튼을 누르세요');
  setTimeout(()=>run(null),100);
}
function exportCsv(it,def,rows){
  if(!rows.length){ alert('내보낼 데이터가 없습니다.'); return; }
  const head=def.cols.map(c=>c[0]);
  const body=rows.map(r=>def.cols.map(c=>{
    const v=r[c[3]]; return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  }).join(','));
  const csv='\ufeff'+head.join(',')+'\n'+body.join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=it.n+'_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

      const d=ITEM[id], el=document.createElement('div'); el.className='gs-item';
      el.innerHTML='<b>'+esc(d.it.n)+'</b><div class="p">'+esc(d.path)+'</div>';
      el.addEventListener('click',()=>{ openPage(id); inp.value=''; pop.classList.remove('on'); });
      pop.appendChild(el);
    });
    pop.classList.add('on');
  };
  inp.addEventListener('input',render);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ inp.value=''; pop.classList.remove('on'); }
    if(e.key==='Enter'){ const f=pop.querySelector('.gs-item'); if(f)f.click(); }
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('.gs-wrap')) pop.classList.remove('on'); });
}
function pushRecent(id){
  let list=[]; try{ list=JSON.parse(localStorage.getItem(LK_RECENT)||'[]'); }catch(e){}
  list=[id].concat(list.filter(x=>x!==id)).slice(0,6);
  localStorage.setItem(LK_RECENT,JSON.stringify(list)); renderRecent();
}
function renderRecent(){
  let list=[]; try{ list=JSON.parse(localStorage.getItem(LK_RECENT)||'[]'); }catch(e){}
  const box=byId('recentList'); box.innerHTML='';
  list.filter(id=>ITEM[id]).forEach(id=>{
    const b=document.createElement('button'); b.className='recent-item'; b.textContent=ITEM[id].it.n;
    b.addEventListener('click',()=>openPage(id)); box.appendChild(b);
  });
}
function saveTabs(){ localStorage.setItem(LK_TABS,JSON.stringify({tabs:[...openTabs.keys()],active:activeTab})); }
function restoreTabs(){
  let st=null; try{ st=JSON.parse(localStorage.getItem(LK_TABS)||'null'); }catch(e){}
  let ids=(st&&st.tabs&&st.tabs.length)?st.tabs.filter(id=>ITEM[id]):[];
  if(!ids.length) ids=[HOME_ID];
  ids.forEach(id=>{ openTabs.set(id,{id:id,title:ITEM[id].it.n}); ensurePage(id); });
  const act=(st&&ITEM[st.active])?st.active:ids[0];
  const d=ITEM[act]; currentL1=d.l1; currentL2=d.l2; activateTab(act);
}

/* ==================== 부팅 ==================== */
function tick(){
  byId('clock').textContent=new Date().toLocaleString('ko-KR',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
async function checkNet(){
  let ok=true;
  try{ await sbGet(TBL_SET+'?select=key&limit=1'); }catch(e){ ok=false; }
  byId('netDot').classList.toggle('off',!ok);
  byId('netTxt').textContent=ok?'Connected':'Offline';
}
async function loadMasters(){
  try{
    const v=await sbGet(OBJ.vendor+'?select=vendor_name&order=vendor_name.asc');
    VENDORS=[...new Set(v.map(x=>x.vendor_name).filter(Boolean))];
  }catch(e){ VENDORS=[]; }
  try{
    const p=await sbGet(OBJ.process+'?select=process_code,process_name,process_group,sort_order&order=sort_order.asc');
    PROCS=p.filter(x=>x.process_group==='가공').map(x=>({code:x.process_code,name:x.process_name}));
    p.forEach(x=>PROCMAP[x.process_code]=x.process_name);
  }catch(e){ PROCS=[]; }
  try{
    ROUTES=await sbGet(OBJ.route+'?select=standard_process_no,standard_process_name,steps&order=standard_process_no.asc');
  }catch(e){ ROUTES=[]; }
}
async function bootApp(){
  buildL1(); buildL2();
  await Promise.all([loadSchema(), loadMasters()]);
  restoreTabs(); buildTree(); renderRecent(); initSearch();
  tick(); setInterval(tick,30000);
  checkNet(); setInterval(checkNet,120000);
}
byId('verBtn').addEventListener('click',()=>alert(CHANGELOG));
byId('logoutBtn').addEventListener('click',()=>{
  if(!confirm('로그아웃 하시겠습니까?\n다시 접속하려면 PIN을 입력해야 합니다.'))return;
  clearSession(); location.reload();
});
byId('userBtn').addEventListener('click',()=>{
  const s=getSession(); if(!s)return;
  const days=Math.max(0,Math.ceil((s.exp-Date.now())/864e5));
  alert('👤 '+(s.role==='admin'?'관리자 (마스터 PIN)':'사용자 (일반 PIN)')+'\n\n⏱ 자동 잠금까지: '+days+'일');
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key.toLowerCase()==='k'){ e.preventDefault(); byId('gsInput').focus(); }
});

(async function init(){
  buildKeypad(); buildDots(); updateDots(); checkLockout();
  try{ const d=await isDefaultPin(); if(!d.master&&!d.user) byId('plNotice').style.display='none'; }catch(e){}
  const s=getSession();
  if(s){ document.body.classList.remove('locked'); byId('pinLock').style.display='none'; applySession(); bootApp(); }
})();
</script>
