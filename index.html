<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GI MES - 로그인</title>
<link rel="stylesheet" href="ki_style.css">
<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(160deg,#233c5c,#12233a);overflow:hidden}
.lg{color:#e8f0fa;font-size:26px;font-weight:900;letter-spacing:1px;margin-bottom:2px}
.lg span{color:#7fb3ea}
.card{width:320px;background:rgba(255,255,255,.06);border:1px solid #3d6ea8;border-radius:5px;padding:16px 18px}
.f{margin-bottom:10px}
.f label{display:block;color:#a9c2da;font-size:11px;font-weight:700;margin-bottom:4px}
.f input{width:100%;height:34px;border:1px solid #48688f;border-radius:3px;background:#1b2f49;
  color:#e8f1fa;padding:0 10px;font-size:14px}
.f input:focus{outline:none;border-color:#7fb3ea;background:#22395a}
.f .dm{color:#6f8fb5;font-size:11px;margin-top:3px}
.go{width:100%;height:38px;border:0;border-radius:3px;background:linear-gradient(#3f7ab4,#2b5c96);
  color:#fff;font-size:14px;font-weight:700}
.go:hover{background:#3a6ea6}
.go:disabled{opacity:.55}
.hint{height:32px;color:#cfe0f2;font-size:12px;text-align:center;line-height:1.5;padding-top:6px}
.hint.err{color:#ff9a9a}.hint.ok{color:#7ee3a6}
.ver{position:fixed;bottom:12px;color:#5f7994;font-size:11px;text-align:center;line-height:1.7}
.ver b{display:block;color:#8fa8c2;font-size:12px;font-weight:700;letter-spacing:.4px}
.err{max-width:520px;padding:12px 14px;border:1px solid #a3524f;border-radius:4px;
  background:rgba(160,60,55,.22);color:#ffd9d9;font-size:12px;line-height:1.9;text-align:left}
.err b{color:#ffb3b3}
.err code{display:block;margin-top:6px;padding:7px 9px;background:rgba(0,0,0,.28);color:#cfe0f2;
  font-family:Consolas,monospace;font-size:11px}
</style>
<script src="ki_config.js"></script>
<script src="ki_core.js"></script>
</head>
<body>
<div class="lg">GI <span>MES</span></div>
<div id="app"></div>
<div class="ver" id="ver"></div>

<script>
if(typeof KI==='undefined' || typeof KI_CFG==='undefined'){
  const box=document.createElement('div'); box.className='err';
  box.innerHTML='<b>⚠ 공통 스크립트를 불러오지 못했습니다.</b><br>'+
    'index.html 과 같은 폴더에 아래 파일이 함께 있어야 합니다.'+
    '<code>index.html<br>ki_style.css<br>ki_config.js<br>ki_core.js</code>';
  document.getElementById('app').appendChild(box);
  throw new Error('KI core not loaded');
}
const C=KI.CFG, $=KI.$;
document.getElementById('ver').innerHTML='<b>금형 · 외주 LOT · 온습도 업무자동화 시스템</b>'+
  '금형 점검·평가부터 외주 LOT 추적, 설비 환경 모니터링까지 한 곳에서 &nbsp;·&nbsp; GI MES '+C.VER;

document.getElementById('app').innerHTML=
  '<div class="card">'+
    '<div class="f"><label>아이디</label><input id="uid" autocomplete="username" placeholder="예: hcsmart">'+
      '<div class="dm">로그인 계정 : <span id="dm">-</span></div></div>'+
    '<div class="f"><label>비밀번호</label><input id="pw" type="password" autocomplete="current-password"></div>'+
    '<button class="go" id="go">로그인</button>'+
  '</div>'+
  '<div class="hint" id="hint">아이디와 비밀번호를 입력하세요</div>';

const uid=$('#uid'), pw=$('#pw'), hint=$('#hint');
uid.addEventListener('input',()=>$('#dm').textContent = uid.value.trim()?KI.emailOf(uid.value):'-');
[uid,pw].forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }));
$('#go').addEventListener('click',go);

function dest(){
  const r=new URLSearchParams(location.search).get('r');
  if(r && /^[a-z_]+\.html$/.test(r)){
    /* QR 스캔으로 진입한 경우 LOT 번호를 함께 복원 */
    if(r==='lot_scan.html'){
      let lot='';
      try{ lot=localStorage.getItem('ki_scan_lot')||''; }catch(e){}
      if(lot) return r+'?lot='+encodeURIComponent(lot);
    }
    return r;
  }
  /* 기본 화면 권한이 없는 계정(협력사 등)은 접근 가능한 첫 화면으로 */
  const home=C.LANDING||'mold_due.html';
  const homeId=Object.keys(FLAT).find(k=>FLAT[k].it.f===home);
  if(!homeId || KI.can(homeId,'view')) return home;
  const ok=Object.keys(FLAT).find(k=>KI.can(k,'view'));
  return ok?FLAT[ok].it.f:home;
}
async function go(){
  const id=uid.value.trim(), p=pw.value;
  if(!id){ hint.className='hint err'; hint.textContent='아이디를 입력하세요.'; uid.focus(); return; }
  if(!p){ hint.className='hint err'; hint.textContent='비밀번호를 입력하세요.'; pw.focus(); return; }
  $('#go').disabled=true; hint.className='hint'; hint.textContent='확인 중...';
  try{
    const me=await KI.signIn(id,p);
    hint.className='hint ok';
    hint.textContent='✓ '+me.emp_name+'님 ('+(me.role==='관리자'?'관리자':'사용자')+') 로그인';
    setTimeout(()=>location.href=dest(),350);
  }catch(e){
    hint.className='hint err'; hint.textContent='❌ '+e.message;
    pw.value=''; pw.focus(); $('#go').disabled=false;
  }
}
/* 이미 로그인 상태면 통과 */
(async()=>{
  if(!KI.loadSess())return;
  if(await KI.loadMe()) location.href=dest(); else await KI.signOut();
})();
uid.focus();
</script>
</body>
</html>
