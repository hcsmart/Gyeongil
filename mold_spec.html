<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GI MES</title>
<link rel="stylesheet" href="ki_style.css">
<script src="ki_config.js"></script>
<script src="ki_core.js"></script>
</head>
<body>
<script>
(async function(){
  if(!await KI.guard('mold-spec'))return;
  const $=KI.$, el=KI.el, esc=KI.esc;
  const cur=KI.chrome('mold-spec');

  const T_MOLD='ki_mold_master', T_TYPE='ki_mold_type', T_MAT='ki_material';
  let TYPES=[], MATS=[], ROWS=[], key=null;      // key : 수정중인 금형제번

  const CAN_S=KI.can('mold-spec','save'), CAN_E=KI.can('mold-spec','edit'), CAN_D=KI.can('mold-spec','delete');
  /* 저장 · 신규등록 · 삭제는 폼 하단 버튼에만 둔다 (상단 중복 제거 → 상단바 폭 확보)
     엑셀 버튼 라벨은 다른 조회화면(KI.grid)과 같은 문자열을 쓴다 —
     드롭다운 우측 실행메뉴와 [?act=버튼명] 자동실행이 라벨로 매칭되기 때문이다. */
  const acts=[];
  if(CAN_S)        acts.push(['엑셀업로드','',()=>uploader.open()]);
  acts.push(['엑셀다운로드','',()=>exportCsv()],['새로고침','',()=>loadAll()]);
  const ui=KI.page(cur,acts);

  /* ---------- 엑셀 템플릿 업로드 ---------- */
  const upDef={edit:{table:T_MOLD, pk:'mold_no', fields:[
    ['mold_no','금형제번','text',null,'req'],
    ['mold_type_code','금형타입','lookup',()=>TYPES.map(t=>({v:t.mold_type_code,t:t.mold_type_name}))],
    ['material_code','소재재질','lookup',()=>MATS.map(m=>({v:m.material_code,t:m.material_name}))],
    ['thickness_mm','소재두께(mm)','num'],
    ['width_mm','소재폭(mm)','num'],
    ['pitch_mm','피치(mm)','num'],
    ['density','비중','num'],
    ['part_no','매칭품번','text'],
    ['asset_owner','자산처','text'],
    ['remark','비고','area']
  ]}};
  const uploader=KI.makeUpload(upDef,'금형정보',()=>ROWS,
    async n=>{ await loadMolds(); msg('✓ 엑셀 업로드 '+n+'건이 저장되었습니다.',true); });

  /* ---------- 입력 폼 ---------- */
  const F=el('div','form');
  F.innerHTML=
    '<div class="form-row">'+
      '<div class="form-lb req">금형제번</div><div class="form-fd"><input id="f_no" maxlength="30" placeholder="예: M-2401"></div>'+
      '<div class="form-lb">금형타입</div><div class="form-fd"><select id="f_type"></select></div>'+
      '<div class="form-lb">소재재질</div><div class="form-fd"><select id="f_mat"></select></div>'+
      '<div class="form-lb">비중</div><div class="form-fd"><input id="f_den" type="number" step="0.01" placeholder="자동"></div>'+
    '</div>'+
    '<div class="form-row">'+
      '<div class="form-lb">소재두께(mm)</div><div class="form-fd"><input id="f_t" type="number" step="0.01"></div>'+
      '<div class="form-lb">소재폭(mm)</div><div class="form-fd"><input id="f_w" type="number" step="0.1"></div>'+
      '<div class="form-lb">피치(mm)</div><div class="form-fd"><input id="f_p" type="number" step="0.1"></div>'+
      '<div class="form-lb">소재중량(g)</div><div class="form-fd"><div class="calc" id="f_g">-</div></div>'+
    '</div>'+
    '<div class="form-row">'+
      '<div class="form-lb">매칭품번</div><div class="form-fd"><input id="f_part" maxlength="40" '+
        'placeholder="이 금형으로 생산되는 제품번호"></div>'+
      '<div class="form-lb">자산처</div><div class="form-fd"><input id="f_own" maxlength="40"></div>'+
      '<div class="form-lb">비고</div><div class="form-fd" style="grid-column:span 3"><input id="f_rem" maxlength="200"></div>'+
    '</div>'+
    '<div class="form-bar">'+
      '<button class="btn primary" id="b_save">💾 저장</button>'+
      '<button class="btn new" id="b_new">＋ 신규등록</button>'+
      '<button class="btn danger" id="b_del">✕ 삭제</button>'+
      '<span class="st" id="f_msg"></span>'+
    '</div>';
  ui.pg.appendChild(F);

  /* ---------- 목록 ---------- */
  const gw=el('div','grid-wrap');
  const tb=el('div','grid-tb');
  const fnd=el('input'); fnd.placeholder='금형제번 / 품번 / 자산처 검색';
  fnd.style.cssText='height:22px;border:1px solid #aeb9c4;padding:0 6px;width:220px';
  const cnt=el('span','right','총 0건');
  tb.appendChild(fnd); tb.appendChild(cnt); gw.appendChild(tb);
  const COLS=[['금형제번',100,'','mold_no'],['금형타입',130,'','mold_type_name'],['소재재질',170,'','material_name'],
    ['두께(mm)',86,'num','thickness_mm'],['폭(mm)',84,'num','width_mm'],['피치(mm)',84,'num','pitch_mm'],
    ['비중',66,'num','density'],['소재중량(g)',100,'num','unit_weight_g'],
    ['매칭품번(제품번호)',120,'','part_no'],['자산처',110,'','asset_owner'],['비고',0,'','remark']];
  const tbl=el('table','grid'), th=el('thead'), tr=el('tr');
  COLS.forEach(c=>{ const t=el('th',null,c[0]); if(c[1])t.style.width=c[1]+'px'; tr.appendChild(t); });
  th.appendChild(tr); tbl.appendChild(th);
  const tbody=el('tbody'); tbl.appendChild(tbody); gw.appendChild(tbl); ui.pg.appendChild(gw);

  /* ---------- 공통 ---------- */
  const V=id=>$('#'+id).value.trim();
  const N=id=>{ const v=V(id); return v===''?null:Number(v); };
  function msg(t,ok){ const m=$('#f_msg'); m.className='st '+(ok?'ok':'err'); m.textContent=t; KI.msg(t); }
  function weight(){
    const t=N('f_t'), w=N('f_w'), p=N('f_p'), d=N('f_den');
    if([t,w,p,d].some(x=>x==null||isNaN(x))){ $('#f_g').textContent='-'; return null; }
    const g=(t/10)*(w/10)*(p/10)*d;
    $('#f_g').textContent=g.toFixed(2)+' g';
    return g;
  }
  ['f_t','f_w','f_p','f_den'].forEach(id=>$('#'+id).addEventListener('input',weight));
  $('#f_mat').addEventListener('change',()=>{
    const m=MATS.find(x=>x.material_code===V('f_mat'));
    if(m && m.density!=null){ $('#f_den').value=m.density; weight(); }
  });

  function clearForm(){
    key=null;
    ['f_no','f_t','f_w','f_p','f_den','f_part','f_own','f_rem'].forEach(i=>$('#'+i).value='');
    $('#f_type').selectedIndex=0; $('#f_mat').selectedIndex=0;
    $('#f_no').readOnly=false; $('#f_g').textContent='-';
    tbody.querySelectorAll('tr.sel').forEach(x=>x.classList.remove('sel'));
    msg('신규 입력 모드입니다.',true);
    $('#f_no').focus();
  }
  function fill(r){
    key=r.mold_no;
    $('#f_no').value=r.mold_no; $('#f_no').readOnly=true;
    $('#f_type').value=r.mold_type_code||''; $('#f_mat').value=r.material_code||'';
    $('#f_t').value=r.thickness_mm??''; $('#f_w').value=r.width_mm??'';
    $('#f_p').value=r.pitch_mm??''; $('#f_den').value=r.density??'';
    $('#f_part').value=r.part_no||''; $('#f_own').value=r.asset_owner||''; $('#f_rem').value=r.remark||'';
    weight(); msg(r.mold_no+' 항목을 선택했습니다. (수정 모드)',true);
  }

  /* ---------- 저장 / 삭제 ---------- */
  async function save(){
    const no=V('f_no');
    if(!no) return msg('금형제번을 입력하세요.');
    const body={ mold_type_code:V('f_type')||null, material_code:V('f_mat')||null,
      thickness_mm:N('f_t'), width_mm:N('f_w'), pitch_mm:N('f_p'), density:N('f_den'),
      part_no:V('f_part')||null, asset_owner:V('f_own')||null, remark:V('f_rem')||null,
      updated_at:new Date().toISOString() };
    try{
      if(key){ await KI.upd(T_MOLD,'mold_no=eq.'+encodeURIComponent(key),body); msg('✓ '+key+' 수정되었습니다.',true); }
      else{
        if(ROWS.find(r=>r.mold_no===no)) return msg('이미 등록된 금형제번입니다.');
        body.mold_no=no; await KI.ins(T_MOLD,[body]); msg('✓ '+no+' 등록되었습니다.',true); key=no; $('#f_no').readOnly=true;
      }
      await loadMolds();
    }catch(e){ msg('❌ '+e.message); }
  }
  async function remove(){
    if(!key) return msg('삭제할 항목을 목록에서 선택하세요.');
    if(!confirm(key+' 금형정보를 삭제하시겠습니까?'))return;
    try{ await KI.del(T_MOLD,'mold_no=eq.'+encodeURIComponent(key));
      msg('✓ 삭제되었습니다.',true); clearForm(); await loadMolds();
    }catch(e){ msg('❌ '+e.message); }
  }
  $('#b_save').addEventListener('click',save);
  $('#b_new').addEventListener('click',clearForm);
  $('#b_del').addEventListener('click',remove);
  if(!(CAN_S||CAN_E)){ $('#b_save').disabled=true; $('#b_save').style.opacity=.5; }
  if(!CAN_S){ $('#b_new').disabled=true; $('#b_new').style.opacity=.5; }
  if(!CAN_D){ $('#b_del').disabled=true; $('#b_del').style.opacity=.5; }

  /* ---------- 목록 렌더 ---------- */
  function draw(){
    const q=fnd.value.trim().toLowerCase();
    const rows=ROWS.filter(r=>!q||[r.mold_no,r.part_no,r.asset_owner,r.material_name,r.mold_type_name]
      .some(v=>String(v||'').toLowerCase().includes(q)));
    tbody.innerHTML='';
    if(!rows.length){ const t=el('tr'),d=el('td','center','등록된 금형이 없습니다.');
      d.colSpan=COLS.length; d.style.cssText='color:#8894a0;height:50px'; t.appendChild(d); tbody.appendChild(t); }
    rows.forEach(r=>{
      const t=el('tr');
      COLS.forEach(c=>{ const d=el('td',c[2]||'');
        let v=r[c[3]];
        if(c[3]==='unit_weight_g'||c[3]==='density') v=(v==null?'':Number(v).toFixed(2));
        d.textContent=v==null?'':v; d.title=d.textContent; t.appendChild(d); });
      t.addEventListener('click',()=>{ tbody.querySelectorAll('tr.sel').forEach(x=>x.classList.remove('sel'));
        t.classList.add('sel'); fill(r); });
      tbody.appendChild(t);
    });
    cnt.textContent='총 '+rows.length.toLocaleString()+'건';
  }
  fnd.addEventListener('input',draw);

  /* 금형타입 · 소재 비중은 [기준정보 › 생산기준] 별도 화면에서 관리 */
  /* ---------- 로드 ---------- */
  function fillSelect(id,list,vk,nk,ph){
    const s=$('#'+id), keep=s.value; s.innerHTML='';
    s.appendChild(el('option',null,ph||'선택'));
    list.forEach(x=>{ const o=el('option',null,(x[nk]||x[vk])); o.value=x[vk]; s.appendChild(o); });
    if(keep) s.value=keep;
  }
  async function loadRefs(){
    try{
      const r=await Promise.all([KI.get(OBJ.moldType+'?select=*&order=sort_order.asc'),
                                KI.get(OBJ.material+'?select=*&order=sort_order.asc')]);
      TYPES=r[0]; MATS=r[1];
      fillSelect('f_type',TYPES,'mold_type_code','mold_type_name','선택');
      fillSelect('f_mat', MATS,'material_code','material_name','선택');
    }catch(e){ msg('❌ 기준정보 조회 실패: '+e.message); }
  }
  async function loadMolds(){
    try{ ROWS=await KI.get(OBJ.moldSpec+'?select=*&order=mold_no.asc'); draw(); }
    catch(e){ msg('❌ '+e.message); }
  }
  async function loadAll(){ await loadRefs(); await loadMolds(); }

  function exportCsv(){
    if(!ROWS.length) return alert('내보낼 데이터가 없습니다.');
    const head=COLS.map(c=>c[0]);
    const body=ROWS.map(r=>COLS.map(c=>'"'+String(r[c[3]]==null?'':r[c[3]]).replace(/"/g,'""')+'"').join(','));
    const a=el('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+head.join(',')+'\n'+body.join('\n')],{type:'text/csv'}));
    a.download='금형정보_'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  }

  await loadAll();
  msg('금형정보 '+ROWS.length+'건이 조회되었습니다.',true);
})();
</script>
<script src="ki_demo.js"></script>
<script src="ki_demo_data.js"></script>
<script>KIDemo.attach('mold-spec');</script>
</body>
</html>
