<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#22537f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>QR(리딩) — SCM Smart</title>
<style>
:root{--bg:#eef2f6;--ink:#16202b;--sub:#6b7a89;--line:#dbe3ea;--blue:#2668a8;--blue-d:#1b4b7d;--green:#1f8a4c;--red:#c0392b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.6 'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:100px}
.app{background:linear-gradient(135deg,#3579b8,#22537f);color:#fff;padding:13px 15px;display:flex;align-items:center;gap:9px;
     font-weight:800;font-size:16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.14)}
.app .me{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.16);
     border:1px solid rgba(255,255,255,.32);padding:6px 11px;border-radius:20px;cursor:pointer;white-space:nowrap}
.wrap{max-width:600px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(20,40,60,.09);margin-bottom:12px;overflow:hidden;
      animation:rise .3s ease both}
.card h3{font-size:12.5px;font-weight:800;color:var(--sub);padding:12px 15px 0}
.card .bd{padding:13px 15px 15px}

/* 스캔 히어로 */
.scan{position:relative;border-radius:18px;overflow:hidden;margin-bottom:12px;cursor:pointer;
      background:linear-gradient(135deg,#3579b8,#1b4b7d);color:#fff;padding:26px 20px 24px;text-align:center;
      box-shadow:0 8px 22px rgba(27,75,125,.3);animation:pop .34s cubic-bezier(.2,.9,.3,1.2) both}
.scan:active{transform:scale(.985)}
.scan .ring{width:96px;height:96px;margin:0 auto 12px;border-radius:26px;border:3px solid rgba(255,255,255,.55);
     display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;
     animation:beat 2.1s infinite}
.scan .ring::before,.scan .ring::after{content:'';position:absolute;width:20px;height:20px;border:3px solid #fff;border-radius:4px}
.scan .ring::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
.scan .ring::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
.scan h2{font-size:22px;font-weight:900;letter-spacing:-.5px}
.scan p{font-size:13px;opacity:.92;margin-top:4px}
.scan::after{content:'';position:absolute;left:-40px;bottom:-60px;width:170px;height:170px;
     background:rgba(255,255,255,.08);border-radius:50%}

.fld{margin-bottom:12px}
.fld>label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:5px}
input{width:100%;border:1.5px solid #cfd9e2;border-radius:11px;padding:12px 13px;font:inherit;font-size:15.5px;background:#fff}
input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(38,104,168,.13)}
.sub-bt{width:100%;height:46px;border:1.5px solid #cfd9e2;background:#fff;border-radius:11px;
     font:inherit;font-size:14.5px;font-weight:800;color:#41556a;cursor:pointer}
.note{font-size:12px;color:var(--sub);line-height:1.75;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}

/* 최근 LOT */
.rec{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid #f0f3f6;cursor:pointer}
.rec:last-child{border-bottom:0}
.rec:active{background:#f6f9fc}
.rec .ic{width:40px;height:40px;border-radius:11px;background:#eaf2fa;color:var(--blue);flex:none;
     display:flex;align-items:center;justify-content:center;font-size:19px}
.rec b{font-size:16.5px;font-weight:900;color:var(--blue-d);letter-spacing:-.3px}
.rec .dt{margin-left:auto;font-size:11.5px;color:#9aa7b3;font-weight:700;white-space:nowrap}
.rec .go{color:#c3ccd5;font-size:18px;font-weight:800}

/* 게이트 */
.gate h2{font-size:19px;font-weight:900;margin-bottom:5px;letter-spacing:-.4px}
.gate p{font-size:13px;color:var(--sub);margin-bottom:14px;line-height:1.65}
.vl{display:flex;flex-direction:column;gap:9px;margin-bottom:15px}
.vl button{height:58px;border:2px solid var(--line);border-radius:13px;background:#fff;font:inherit;font-size:16.5px;
     font-weight:800;color:var(--ink);cursor:pointer;text-align:left;padding:0 16px;transition:.15s}
.vl button.on{border-color:var(--blue);background:#eef4fa;color:var(--blue-d);box-shadow:0 3px 10px rgba(38,104,168,.16)}

/* 액션바 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
     background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:none}
.bar .go2{max-width:600px;margin:0 auto;width:100%;height:56px;border:0;border-radius:14px;color:#fff;
     font:inherit;font-size:17px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#27a35c,#187a43);
     box-shadow:0 5px 16px rgba(20,40,60,.2)}

/* 카메라 */
.cam{position:fixed;inset:0;background:#000;z-index:60;display:none}
.cam.on{display:block}
.cam video{width:100%;height:100%;object-fit:cover;background:#000}
.frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-56%);width:68vw;height:68vw;max-width:330px;max-height:330px;
     box-shadow:0 0 0 100vmax rgba(0,0,0,.55);border-radius:20px}
.frame i{position:absolute;width:34px;height:34px;border:4px solid #4fd18a}
.frame i:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
.frame i:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
.frame i:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0;border-radius:0 0 0 16px}
.frame i:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 16px 0}
.laser{position:absolute;left:8px;right:8px;height:3px;background:linear-gradient(90deg,transparent,#4fd18a,transparent);
     border-radius:2px;animation:sweep 2.2s ease-in-out infinite}
.camHint{position:absolute;bottom:112px;left:0;right:0;text-align:center;color:#fff;font-size:15px;font-weight:800;
     text-shadow:0 1px 6px #000;padding:0 24px;line-height:1.6}
.camX{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:190px;height:52px;border:0;
     background:#fff;color:var(--ink);font:inherit;font-weight:900;font-size:16px;border-radius:26px;cursor:pointer}
.toast{position:fixed;left:12px;right:12px;bottom:78px;z-index:70;border-radius:13px;padding:13px 15px;color:#fff;
     font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.24);display:none;line-height:1.5}
.toast.on{display:block;animation:slide .3s cubic-bezier(.2,.9,.3,1.2) both}
.toast.ok{background:linear-gradient(135deg,#27a35c,#187a43)}
.toast.err{background:linear-gradient(135deg,#d64a3c,#a93226)}
.empty{text-align:center;color:#9aa7b3;font-size:13.5px;padding:20px 10px;font-weight:700}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(255,255,255,.4)}70%{box-shadow:0 0 0 18px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes sweep{0%{top:6%}50%{top:92%}100%{top:6%}}
</style>
<script src="ki_config.js"></script>
</head>
<body>
<div class="app">📷 QR(리딩) <span class="me" id="meBtn" style="display:none"></span></div>
<div class="wrap" id="wrap"><div class="empty">불러오는 중...</div></div>
<div class="bar" id="bar"></div>

<div class="cam" id="cam">
  <video id="vid" playsinline muted></video>
  <div class="frame"><i></i><i></i><i></i><i></i><div class="laser"></div></div>
  <div class="camHint" id="camHint">공정이동표의 QR을 사각형 안에 맞춰 주세요</div>
  <button class="camX" id="camX">✕ 닫기</button>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
const C=KI_CFG;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>{const n=Number(v);return isNaN(n)?'0':n.toLocaleString();};
const wrap=$('#wrap'), bar=$('#bar');
const HOME='사내 (발주처)';
/* [사내 (발주처)] 는 협력사에게 보일 필요가 없어 기본으로 숨긴다.
   사내 담당자가 이 화면을 쓸 때는 주소 뒤에 ?home=1 을 붙여 연다.
   (이미 사내로 저장해 둔 폰에서는 다시 고를 수 있도록 계속 보여준다) */
const HOMEOK = /[?&]home=1\b/.test(location.search) ||
               (localStorage.getItem('ki_qr_vendor')||'')===HOME;
let MYVEN='', WORKER='', VENS=[], REC=[];
try{
  MYVEN=localStorage.getItem('ki_qr_vendor')||'';
  WORKER=localStorage.getItem('ki_qr_worker')||'';
  REC=JSON.parse(localStorage.getItem('ki_qr_recent')||'[]');
}catch(e){ REC=[]; }

async function rpc(fn,args){
  const r=await fetch(C.SUPABASE_URL+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'Content-Type':'application/json',apikey:C.SUPABASE_KEY,
             Authorization:'Bearer '+C.SUPABASE_KEY},
    body:JSON.stringify(args||{})});
  const t=await r.text();
  let j=null; try{ j=JSON.parse(t); }catch(e){}
  if(!r.ok) throw new Error((j&&(j.message||j.hint))||t.slice(0,150)||('오류 '+r.status));
  return j;
}
let toastT=null;
function toast(msg,ok){
  const el=$('#toast'); el.className='toast on '+(ok?'ok':'err'); el.textContent=msg;
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(()=>el.className='toast',3600);
}
const saveRec=(tok,part)=>{
  REC=[{t:tok,p:part,d:new Date().toISOString().slice(5,16).replace('T',' ')}]
      .concat(REC.filter(x=>x.t!==tok)).slice(0,8);
  try{ localStorage.setItem('ki_qr_recent',JSON.stringify(REC)); }catch(e){}
};
function tokenOf(text){
  const s=String(text||'').trim();
  if(!s) return '';
  const m=s.match(/[?&]t=([^&\s]+)/);
  if(m) return decodeURIComponent(m[1]);
  if(/^https?:/i.test(s)) return '';
  return s;
}

/* ── 업체 선택 ── */
function gate(){
  $('#meBtn').style.display='none';
  wrap.innerHTML='<div class="card"><div class="bd gate">'+
    '<h2>🏭 우리 업체는?</h2>'+
    '<p>보통은 고를 필요가 없습니다 — <b>QR을 찍으면 자동으로 인식</b>됩니다.<br>'+
    '이동표를 잃어버렸거나 업체를 바꿀 때만 여기서 지정하세요.</p>'+
    '<div class="vl" id="vl">'+
      VENS.map(v=>'<button data-v="'+esc(v)+'"'+(v===MYVEN?' class="on"':'')+'>🏢 '+esc(v)+'</button>').join('')+
      (HOMEOK?'<button data-v="'+esc(HOME)+'"'+(MYVEN===HOME?' class="on"':'')+'>🏠 '+esc(HOME)+'</button>':'')+
    '</div>'+
    '<div class="fld"><label>담당자 성함</label><input id="gWk" value="'+esc(WORKER)+'" placeholder="기록에 남습니다"></div>'+
  '</div></div>';
  let pick=MYVEN;
  wrap.querySelectorAll('#vl button').forEach(b=>b.addEventListener('click',()=>{
    pick=b.dataset.v; wrap.querySelectorAll('#vl button').forEach(x=>x.classList.toggle('on',x===b));
  }));
  bar.style.display='block';
  bar.innerHTML='<button class="go2" id="gGo">✅ 저장하고 시작</button>'+
    (MYVEN?'<button class="go2" id="gBack" style="background:#eef1f4;color:#41556a;margin-top:6px">↩ 취소</button>':'');
  const bk=$('#gBack'); if(bk) bk.addEventListener('click',()=>home());
  $('#gGo').addEventListener('click',()=>{
    const wk=$('#gWk').value.trim();
    if(!pick) return toast('업체를 선택하세요.');
    if(!wk) return toast('담당자 성함을 입력하세요.');
    MYVEN=pick; WORKER=wk;
    try{ localStorage.setItem('ki_qr_vendor',MYVEN); localStorage.setItem('ki_qr_worker',WORKER); }catch(e){}
    home();
  });
}

/* ── 홈 ── */
function home(){
  bar.style.display='none';
  $('#meBtn').style.display='';
  $('#meBtn').innerHTML = MYVEN ? ('🏢 '+esc(MYVEN)+' ▾') : '🏢 업체 설정 ▾';
  wrap.innerHTML=
  '<div class="scan" id="btScan">'+
    '<div class="ring">📷</div><h2>QR 스캔</h2>'+
    '<p>공정이동표의 QR을 찍어 입고 · 출고를 등록하세요</p>'+
  '</div>'+
  (MYVEN?'':'<div class="card"><div class="bd" style="padding:12px 14px;color:#4a5968;font-size:13px">'+
    '<b>처음이신가요?</b><br>업체를 고를 필요 없이 <b>공정이동표의 QR만 찍으면</b> 됩니다. '+
    '우리 업체는 이동표를 읽는 순간 자동으로 인식되어 이 휴대폰에 저장됩니다.'+
    '</div></div>')+
  (REC.length?'<div class="card"><h3>🕘 최근 스캔한 LOT</h3><div class="bd" style="padding-top:4px">'+
    REC.map(x=>'<div class="rec" data-t="'+esc(x.t)+'"><div class="ic">📦</div>'+
      '<b>'+esc(x.p||'(LOT)')+'</b><span class="dt">'+esc(x.d||'')+'</span><span class="go">›</span></div>').join('')+
    '</div></div>':'')+
  '<div id="holdBox"></div>'+
  '<div class="card"><h3>⌨ 직접 입력</h3><div class="bd">'+
    '<div class="fld"><input id="manual" placeholder="이동표 번호 · QR 주소 붙여넣기"></div>'+
    '<button class="sub-bt" id="btGo">▶ 이동표 열기</button>'+
    '<div class="note">· 카메라가 열리지 않으면 휴대폰 기본 카메라로 QR을 찍어도 됩니다.<br>'+
      '· 이 화면을 <b>홈 화면에 추가</b>해 두면 앱처럼 바로 쓸 수 있습니다.</div>'+
  '</div></div>';
  $('#btScan').addEventListener('click',scan);
  $('#btGo').addEventListener('click',()=>{
    const tok=tokenOf($('#manual').value);
    if(!tok) return toast('이동표 번호 또는 QR 주소를 입력하세요.');
    openTok(tok);
  });
  wrap.querySelectorAll('.rec').forEach(r=>r.addEventListener('click',()=>openTok(r.dataset.t)));
  loadHold();
}

/* ── 우리 업체 보유 LOT ─────────────────────────────────────
   분할 반송을 하면 종이 이동표는 물건과 함께 본사로 간다.
   협력사에 남은 잔량은 QR 없이도 여기서 골라 바로 반송 등록할 수 있어야 한다. */
async function loadHold(){
  const box=$('#holdBox'); if(!box) return;
  if(!MYVEN||MYVEN===HOME){ box.innerHTML=''; return; }
  const proof=(REC[0]||{}).t;
  if(!proof){
    box.innerHTML='<div class="card"><div class="bd" style="padding:12px 14px;color:#6b7a89;font-size:12.5px">'+
      '이동표를 <b>한 번만</b> 스캔해 두면, 이후에는 이 화면에서 <b>우리 보유 LOT</b>을 '+
      '목록으로 열 수 있습니다 (이동표가 본사로 넘어간 잔량도 등록 가능).</div></div>';
    return;
  }
  box.innerHTML='<div class="card"><h3>📦 우리 보유 LOT</h3>'+
    '<div class="bd" style="padding:12px 15px;color:#9aa7b3;font-size:12.5px">불러오는 중...</div></div>';
  let rows=[];
  try{ const r=await rpc('ki_scan_hold',{p_token:proof,p_vendor:MYVEN}); rows=(r&&r.rows)||[]; }
  catch(e){ box.innerHTML=''; return; }
  if(!rows.length){ box.innerHTML=''; return; }
  box.innerHTML='<div class="card"><h3>📦 우리 보유 LOT — 이동표 없이 바로 열기</h3>'+
    '<div class="bd" style="padding-top:4px">'+
    rows.map(x=>{
      const st = Number(x.held)>0 ? {i:'🚚',t:'보유 '+fmt(x.held),c:'#1d568c'}
               : Number(x.transit)>0 ? {i:'📦',t:'운송중 '+fmt(x.transit),c:'#a4600f'}
               : {i:'⏳',t:'입고대기',c:'#6b7a89'};
      return '<div class="rec" data-t="'+esc(x.token)+'"><div class="ic">'+st.i+'</div>'+
        '<b>'+esc(x.part)+'</b>'+
        '<span style="font-size:12px;color:#6b7a89;font-weight:700;margin-left:6px">'+esc(x.mp||'')+'</span>'+
        '<span class="dt" style="color:'+st.c+'">'+st.t+'</span><span class="go">›</span></div>';
    }).join('')+
    '<div class="note" style="margin-top:8px">· 분할 반송으로 이동표가 본사로 넘어간 잔량도 여기서 열어 등록합니다.</div>'+
    '</div></div>';
  box.querySelectorAll('.rec').forEach(r=>r.addEventListener('click',()=>openTok(r.dataset.t,'out')));
}

async function openTok(tok,tab){
  toast('확인 중...',1);
  try{
    const info=await rpc('ki_scan_info',{p_token:tok});
    saveRec(tok,info&&info.part);
    location.href='lot_qr.html?t='+encodeURIComponent(tok)+(tab?'&tab='+tab:'');
  }catch(e){ toast('❌ '+e.message); }
}

/* ── 카메라 ── */
let stream=null, timer=null, jsQRlib=null;
async function scan(){
  const cam=$('#cam'), vid=$('#vid');
  cam.classList.add('on');
  $('#camHint').textContent='카메라를 켜는 중...';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    vid.srcObject=stream; await vid.play();
    $('#camHint').textContent='공정이동표의 QR을 사각형 안에 맞춰 주세요';
  }catch(e){
    stopScan();
    return toast('❌ 카메라를 사용할 수 없습니다. 기본 카메라로 찍거나 직접 입력해 주세요.');
  }
  if('BarcodeDetector' in window){
    const det=new window.BarcodeDetector({formats:['qr_code']});
    timer=setInterval(async()=>{
      try{ const r=await det.detect(vid); if(r&&r.length) hit(r[0].rawValue); }catch(e){}
    },330);
    return;
  }
  if(!jsQRlib){
    $('#camHint').textContent='스캐너 준비 중...';
    try{ await new Promise((ok,ng)=>{ const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload=ok; s.onerror=ng;
      document.head.appendChild(s); }); jsQRlib=window.jsQR; }
    catch(e){ stopScan(); return toast('❌ 스캐너를 불러오지 못했습니다. 기본 카메라로 찍어 주세요.'); }
    $('#camHint').textContent='공정이동표의 QR을 사각형 안에 맞춰 주세요';
  }
  const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  timer=setInterval(()=>{
    if(!vid.videoWidth) return;
    const w=Math.min(vid.videoWidth,640), h=Math.round(vid.videoHeight*(w/vid.videoWidth));
    cv.width=w; cv.height=h; cx.drawImage(vid,0,0,w,h);
    const d=cx.getImageData(0,0,w,h);
    const r=jsQRlib(d.data,w,h,{inversionAttempts:'dontInvert'});
    if(r&&r.data) hit(r.data);
  },300);
}
function hit(text){
  const tok=tokenOf(text);
  if(!tok) return;
  stopScan();
  if(navigator.vibrate) try{ navigator.vibrate(70); }catch(e){}
  openTok(tok);
}
function stopScan(){
  if(timer){ clearInterval(timer); timer=null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  $('#vid').srcObject=null;
  $('#cam').classList.remove('on');
}
$('#camX').addEventListener('click',stopScan);
document.getElementById('meBtn').addEventListener('click',()=>gate());

/* 팝업 창으로 열린 경우 닫기 버튼 표시 */
if(/^kiPop_/.test(window.name||'')){
  const b=document.createElement('span');
  b.className='me'; b.style.marginLeft='6px'; b.textContent='✕ 닫기';
  b.addEventListener('click',()=>window.close());
  document.querySelector('.app').appendChild(b);
}
