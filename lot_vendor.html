<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2e6497" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>협력사 QR 스캔 — GI MES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 'Malgun Gothic','맑은 고딕',sans-serif;background:#eef1f4;color:#1d2833;padding-bottom:30px}
.top{background:linear-gradient(#3d7ab5,#2e6497);color:#fff;padding:12px 13px;font-weight:800;font-size:16px;
     display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
.top .me{margin-left:auto;font-weight:700;font-size:11.5px;background:rgba(255,255,255,.18);
     border:1px solid rgba(255,255,255,.35);color:#fff;padding:4px 9px;border-radius:14px;cursor:pointer;line-height:1.3}
.wrap{max-width:560px;margin:0 auto;padding:10px}
.card{background:#fff;border:1px solid #c6d0da;margin-bottom:10px}
.card h3{font-size:13px;background:#f0f4f8;border-bottom:1px solid #d9e1e8;padding:8px 11px;color:#2e4a63}
.card .bd{padding:11px}
.row{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;margin-bottom:9px}
.row label{font-size:12px;font-weight:700;color:#526171}
input{width:100%;border:1px solid #aeb9c4;padding:10px;font:inherit;font-size:15px;background:#fff}
.bt{width:100%;height:52px;border:0;font-size:16px;font-weight:800;color:#fff;cursor:pointer;margin-top:6px}
.bt.main{height:76px;font-size:20px;background:#2e6497;display:flex;align-items:center;justify-content:center;gap:10px}
.bt.in{background:#2f7d4d}.bt.gray{background:#fff;color:#41556a;border:1px solid #9fadba;height:44px;font-size:14px}
.bt[disabled]{opacity:.55}
.msg{padding:9px 2px;font-weight:700;font-size:13px}
.msg.ok{color:#15803d}.msg.err{color:#b23030}
.vlist{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.vlist button{height:54px;border:1px solid #aeb9c4;background:#fff;font:inherit;font-size:16px;font-weight:700;
   color:#1d2833;cursor:pointer;text-align:left;padding:0 14px}
.vlist button.on{border:2px solid #2e6497;background:#eef4fb;color:#1d568c}
.gate h2{font-size:16px;color:#2e4a63;margin-bottom:4px}
.gate p{font-size:12.5px;color:#7b8794;margin-bottom:10px;line-height:1.6}
.cam{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
.cam.on{display:flex}
.cam video{flex:1;width:100%;object-fit:cover;background:#000}
.cam .box{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);width:64vw;height:64vw;max-width:320px;max-height:320px;
   border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.cam .hint{position:absolute;bottom:96px;left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:700;
   text-shadow:0 1px 4px #000;padding:0 20px;line-height:1.6}
.cam .close{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:180px;height:48px;
   border:0;background:#fff;color:#1d2833;font-weight:800;font-size:15px;border-radius:24px;cursor:pointer}
.rec{display:flex;align-items:center;gap:9px;border-bottom:1px solid #eef1f4;padding:9px 2px;cursor:pointer}
.rec:last-child{border-bottom:0}
.rec b{font-size:15px;color:#22537f}
.rec small{color:#8894a0;font-size:11.5px;margin-left:auto;white-space:nowrap}
.note{font-size:11.5px;color:#7b8794;line-height:1.7;margin-top:8px;border-top:1px dashed #d9e1e8;padding-top:8px}
</style>
<script src="ki_config.js"></script>
</head>
<body>
<div class="top">📷 협력사 QR 스캔 <span class="me" id="meBtn" style="display:none"></span></div>
<div class="wrap" id="wrap">불러오는 중...</div>

<div class="cam" id="cam">
  <video id="vid" playsinline muted></video>
  <div class="box"></div>
  <div class="hint" id="camHint">공정이동표의 QR을 사각형 안에 맞춰 주세요</div>
  <button class="close" id="camX">✕ 닫기</button>
</div>

<script>
(function(){
const C=KI_CFG;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wrap=$('#wrap');
const HOME='사내 (발주처)';
let MYVEN='', WORKER='', VENS=[], REC=[];
try{
  MYVEN=localStorage.getItem('ki_qr_vendor')||'';
  WORKER=localStorage.getItem('ki_qr_worker')||'';
  REC=JSON.parse(localStorage.getItem('ki_qr_recent')||'[]');
}catch(e){ REC=[]; }

async function rpc(fn,args){
  const r=await fetch(C.SUPABASE_URL+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'Content-Type':'application/json',apikey:C.SUPABASE_KEY,
             Authorization:'Bearer '+C.SUPABASE_KEY},
    body:JSON.stringify(args||{})});
  const t=await r.text();
  let j=null; try{ j=JSON.parse(t); }catch(e){}
  if(!r.ok) throw new Error((j&&(j.message||j.hint))||t.slice(0,150)||('오류 '+r.status));
  return j;
}
const saveRec=(tok,part)=>{
  REC=[{t:tok,p:part,d:new Date().toISOString().slice(0,16).replace('T',' ')}]
      .concat(REC.filter(x=>x.t!==tok)).slice(0,8);
  try{ localStorage.setItem('ki_qr_recent',JSON.stringify(REC)); }catch(e){}
};
const go=tok=>{ location.href='lot_qr.html?t='+encodeURIComponent(tok); };
/* QR 내용에서 토큰 추출 — 전체 URL이든 토큰 문자열이든 허용 */
function tokenOf(text){
  const s=String(text||'').trim();
  if(!s) return '';
  const m=s.match(/[?&]t=([^&\s]+)/);
  if(m) return decodeURIComponent(m[1]);
  if(/^https?:/i.test(s)) return '';
  return s;
}

/* ── 업체 선택 ── */
function gate(){
  $('#meBtn').style.display='none';
  wrap.innerHTML='<div class="card gate"><h3>🏭 우리 업체 선택</h3><div class="bd">'+
    '<h2>이 기기를 사용하는 곳은 어디입니까?</h2>'+
    '<p>한 번만 선택하면 이 기기에 저장됩니다. 다음부터는 바로 스캔 화면이 열립니다.</p>'+
    '<div class="vlist" id="vl">'+
      VENS.map(v=>'<button data-v="'+esc(v)+'"'+(v===MYVEN?' class="on"':'')+'>🏢 '+esc(v)+'</button>').join('')+
      '<button data-v="'+esc(HOME)+'"'+(MYVEN===HOME?' class="on"':'')+'>🏠 '+esc(HOME)+'</button>'+
    '</div>'+
    '<div class="row"><label>담당자</label><input id="gWk" value="'+esc(WORKER)+'" placeholder="성함 (기록에 남습니다)"></div>'+
    '<button class="bt in" id="gGo">✅ 저장하고 시작</button>'+
    '<div class="msg" id="msg"></div>'+
  '</div></div>';
  let pick=MYVEN;
  wrap.querySelectorAll('#vl button').forEach(b=>b.addEventListener('click',()=>{
    pick=b.dataset.v; wrap.querySelectorAll('#vl button').forEach(x=>x.classList.toggle('on',x===b));
  }));
  $('#gGo').addEventListener('click',()=>{
    const wk=$('#gWk').value.trim();
    if(!pick){ $('#msg').className='msg err'; $('#msg').textContent='업체를 선택하세요.'; return; }
    if(!wk){ $('#msg').className='msg err'; $('#msg').textContent='담당자 성함을 입력하세요.'; return; }
    MYVEN=pick; WORKER=wk;
    try{ localStorage.setItem('ki_qr_vendor',MYVEN); localStorage.setItem('ki_qr_worker',WORKER); }catch(e){}
    home();
  });
}

/* ── 홈 (스캔 화면) ── */
function home(){
  $('#meBtn').style.display='';
  $('#meBtn').innerHTML='🏢 '+esc(MYVEN)+(WORKER?' · '+esc(WORKER):'')+' ▾';
  wrap.innerHTML=
  '<div class="card"><div class="bd">'+
    '<button class="bt main" id="btScan">📷 QR 스캔</button>'+
    '<div class="msg" id="msg"></div>'+
    '<div class="row" style="margin-top:6px"><label>직접 입력</label>'+
      '<input id="manual" placeholder="이동표 번호 · QR 주소 붙여넣기"></div>'+
    '<button class="bt gray" id="btGo">▶ 이동표 열기</button>'+
    '<div class="note">· 카메라가 열리지 않으면 휴대폰 기본 카메라로 QR을 찍어도 됩니다.<br>'+
      '· 이 화면을 <b>홈 화면에 추가</b>해 두면 앱처럼 바로 쓸 수 있습니다.</div>'+
  '</div></div>'+
  (REC.length?'<div class="card"><h3>🕘 최근 스캔한 LOT</h3><div class="bd">'+
    REC.map(x=>'<div class="rec" data-t="'+esc(x.t)+'">📦 <b>'+esc(x.p||'(LOT)')+'</b><small>'+esc(x.d||'')+'</small></div>').join('')+
    '</div></div>':'');

  $('#btScan').addEventListener('click',scan);
  $('#btGo').addEventListener('click',()=>{
    const tok=tokenOf($('#manual').value);
    if(!tok) return msg('이동표 번호 또는 QR 주소를 입력하세요.');
    open(tok);
  });
  wrap.querySelectorAll('.rec').forEach(r=>r.addEventListener('click',()=>open(r.dataset.t)));
}
const msg=(t,ok)=>{ const m=$('#msg'); if(!m)return; m.className='msg '+(ok?'ok':'err'); m.textContent=t; };

/* 토큰 유효성 확인 후 이동 */
async function open(tok){
  msg('확인 중...',1);
  try{
    const info=await rpc('ki_scan_info',{p_token:tok});
    saveRec(tok,info&&info.part);
    go(tok);
  }catch(e){ msg('❌ '+e.message); }
}

/* ── 카메라 스캔 ── */
let stream=null, timer=null, jsQRlib=null;
async function scan(){
  const cam=$('#cam'), vid=$('#vid');
  cam.classList.add('on');
  $('#camHint').textContent='카메라를 켜는 중...';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    vid.srcObject=stream; await vid.play();
    $('#camHint').textContent='공정이동표의 QR을 사각형 안에 맞춰 주세요';
  }catch(e){
    stopScan();
    return msg('❌ 카메라를 사용할 수 없습니다. 기본 카메라로 QR을 찍거나 직접 입력해 주세요.');
  }

  if('BarcodeDetector' in window){
    const det=new window.BarcodeDetector({formats:['qr_code']});
    timer=setInterval(async()=>{
      try{ const r=await det.detect(vid); if(r&&r.length) hit(r[0].rawValue); }catch(e){}
    },350);
    return;
  }
  /* BarcodeDetector 미지원 — jsQR 사용 */
  if(!jsQRlib){
    $('#camHint').textContent='스캐너 준비 중...';
    try{ await new Promise((ok,ng)=>{ const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload=ok; s.onerror=ng;
      document.head.appendChild(s); }); jsQRlib=window.jsQR; }
    catch(e){ stopScan(); return msg('❌ 스캐너를 불러오지 못했습니다. 기본 카메라로 QR을 찍어 주세요.'); }
    $('#camHint').textContent='공정이동표의 QR을 사각형 안에 맞춰 주세요';
  }
  const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  timer=setInterval(()=>{
    if(!vid.videoWidth) return;
    const w=Math.min(vid.videoWidth,640), h=Math.round(vid.videoHeight*(w/vid.videoWidth));
    cv.width=w; cv.height=h; cx.drawImage(vid,0,0,w,h);
    const d=cx.getImageData(0,0,w,h);
    const r=jsQRlib(d.data,w,h,{inversionAttempts:'dontInvert'});
    if(r&&r.data) hit(r.data);
  },300);
}
function hit(text){
  const tok=tokenOf(text);
  if(!tok) return;
  stopScan();
  if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
  open(tok);
}
function stopScan(){
  if(timer){ clearInterval(timer); timer=null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  $('#vid').srcObject=null;
  $('#cam').classList.remove('on');
}
$('#camX').addEventListener('click',stopScan);
document.getElementById('meBtn').addEventListener('click',()=>gate());

(async function init(){
  try{ VENS=await rpc('ki_vendor_list',{}); }catch(e){ VENS=[]; }
  if(!MYVEN) gate(); else home();
})();
})();
</script>
</body>
</html>
