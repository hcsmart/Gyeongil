<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KI MES</title>
<link rel="stylesheet" href="ki_style.css">
<style>
.ol-panel{margin:7px 7px 0;border:1px solid #8494a4;background:#fff}
.ol-h{height:27px;display:flex;align-items:center;gap:8px;padding:0 9px;
  background:linear-gradient(#f3f6f8,#e4eaef);border-bottom:1px solid #aab6c1;
  font-weight:800;color:#2f4559}
.ol-h .sub{font-weight:400;color:#7b8794;font-size:11px}
.ol-bd{padding:8px 9px}
.ol-f{display:grid;grid-template-columns:84px 1fr 84px 1fr 84px 1fr 84px 1fr;gap:5px 6px;align-items:center}
.ol-f label{color:#526171;font-weight:700;font-size:11px}
.ol-f input,.ol-f select{height:25px;border:1px solid #aeb9c4;padding:0 6px;font:inherit;width:100%}
.ol-f input[readonly]{background:#f2f5f8;color:#5d6b78}
.ol-step{display:flex;align-items:center;margin-bottom:7px}
.ol-step .st{flex:1;text-align:center;padding:5px 4px;border:1px solid #c6cfd8;background:#f4f6f8;
  color:#8b98a5;font-weight:700;font-size:11px}
.ol-step .st.on{background:#e9f2fc;border-color:#7ea9d2;color:#1d568c}
.ol-step .st.done{background:#2f7d4d;border-color:#2f7d4d;color:#fff}
.ol-step .st.ng{background:#fbe4e4;border-color:#d99;color:#b23030}
.ol-step .st small{display:block;font-weight:400;font-size:10px}
.ol-step .ar{width:18px;text-align:center;color:#9aa6b1;font-weight:800}
.ol-btn{display:flex;gap:5px;align-items:center;margin-top:7px;padding-top:7px;border-top:1px solid #e3e8ec}
.ol-list{margin:7px;flex:1;min-height:220px;display:flex;flex-direction:column;
  border:1px solid #8494a4;background:#fff}
.ol-list .grid-wrap{margin:0;border:0;flex:1}
.grid tr.clk{cursor:pointer}
.grid tr.clk:hover td{background:#eef5fc}
.grid tr.on td{background:#dbe9f7 !important}
</style>
<script src="ki_config.js"></script>
<script src="ki_core.js"></script>
</head>
<body>
<script>
(async function(){
  if(!await KI.guard('osp-lot'))return;
  const $=KI.$, el=KI.el, esc=KI.esc;
  const cur=KI.chrome('osp-lot');
  const CAN_S=KI.can('osp-lot','save'), CAN_E=KI.can('osp-lot','edit'), CAN_D=KI.can('osp-lot','delete');
  const TODAY=new Date().toISOString().slice(0,10);
  let ROWS=[], VEN=[], PROC=[], MOLDS=[], sel=null;

  const ui=KI.page(cur,[
    ['＋ 신규','primary',()=>clearSel()],
    ['새로고침','',()=>load()],
    ['엑셀(CSV)','',()=>csv()],
    ['인쇄','',()=>window.print()]
  ]);
  const nt=el('div','note');
  nt.innerHTML='외주처로 <b>실물을 내보내고 받는</b> 물류이동 화면입니다. '+
    '위에서 등록·수정하고 <b>[출고 처리] · [입고 처리]</b>로 진행합니다. 아래 목록의 행을 클릭하면 위로 불러옵니다.';
  ui.pg.appendChild(nt);

  const sum=el('div','gv-sum'); sum.style.margin='0 7px';
  sum.innerHTML=[['wait','출고대기'],['out','반출중 (미입고)'],['soon','납기 임박 (3일)'],
                 ['late','납기 경과'],['done','입고 완료 (당월)']]
    .map(x=>'<div class="b"><div class="v" id="s_'+x[0]+'">0</div><div class="k">'+x[1]+'</div></div>').join('');
  ui.pg.appendChild(sum);

  /* ── 상단 : 등록 · 수정 ── */
  const P=el('div','ol-panel');
  P.innerHTML='<div class="ol-h"><span id="ttl">신규 등록</span>'+
      '<span class="sub" id="sub">LOT번호와 외주처만 있으면 등록됩니다.</span>'+
      '<span style="margin-left:auto" class="sub" id="mapInfo"></span></div>'+
    '<div class="ol-bd">'+
      '<div class="ol-step" id="steps"></div>'+
      '<div class="ol-f">'+
        '<label>LOT번호 *</label><input type="text" id="fPart">'+
        '<label>제품번호</label><input type="text" id="fItem">'+
        '<label>금형제번</label><input type="text" id="fMold" list="dlMold" autocomplete="off" placeholder="입력 후 선택">'+
        '<label>매핑품번</label><input type="text" id="fMap" list="dlMap" autocomplete="off" placeholder="입력 후 선택">'+
        '<label>외주처 *</label><select id="fVen"></select>'+
        '<label>가공공정</label><select id="fMp"></select>'+
        '<label>부품명</label><input type="text" id="fPname">'+
        '<label>JOB</label><input type="text" id="fJob">'+
        '<label>발주일</label><input type="date" id="fOdate">'+
        '<label>출고(반출)일</label><input type="date" id="fSdate">'+
        '<label>납기일</label><input type="date" id="fEdate">'+
        '<label>입고일</label><input type="date" id="fIdate">'+
        '<label>단가</label><input type="text" id="fQuote" placeholder="숫자만">'+
        '<label></label><span></span><label></label><span></span><label></label><span></span>'+
      '</div>'+
      '<datalist id="dlMold"></datalist><datalist id="dlMap"></datalist>'+
      '<div class="ol-btn">'+
        '<span class="msg" id="oMsg" style="font-weight:700"></span>'+
        '<button class="btn" id="bDel" style="margin-left:auto;color:#b23030">삭제</button>'+
        '<button class="btn" id="bOut" style="border-color:#2e77bd;color:#1d568c">📤 출고 처리 (오늘)</button>'+
        '<button class="btn green" id="bIn">📦 입고 처리 (오늘)</button>'+
        '<button class="btn primary" id="bSave">💾 저장</button>'+
      '</div>'+
    '</div>';
  ui.pg.appendChild(P);

  /* ── 하단 : 목록 ── */
  const L=el('div','ol-list');
  const tb=el('div','ck-tb');
  tb.innerHTML='<span style="font-weight:700;color:#526171">검색</span>'+
    '<input type="text" id="q" placeholder="LOT · 매핑품번 · 금형제번 · 제품 · 외주처" '+
      'style="height:24px;border:1px solid #aeb9c4;padding:0 6px;width:250px">'+
    '<span style="font-weight:700;color:#526171;margin-left:8px">상태</span>'+
    '<select id="fs"><option value="">전체</option><option>출고대기</option><option>반출중</option>'+
      '<option>납기임박</option><option>납기경과</option><option>입고완료</option></select>'+
    '<span class="sp" id="cnt"></span>';
  const gw=el('div','grid-wrap');
  const tbl=el('table','grid');
  tbl.innerHTML='<thead><tr>'+
    '<th style="width:78px">상태</th><th style="width:110px">LOT번호</th>'+
    '<th style="width:92px">금형제번</th><th style="width:104px">매핑품번</th>'+
    '<th style="width:130px">제품번호</th><th style="width:120px">부품명</th>'+
    '<th style="width:74px">가공공정</th><th style="width:110px">외주처</th>'+
    '<th style="width:88px">발주일</th><th style="width:88px">출고일</th>'+
    '<th style="width:88px">납기</th><th style="width:88px">입고일</th>'+
    '<th style="width:64px">경과</th><th style="width:88px">단가</th></tr></thead><tbody></tbody>';
  gw.appendChild(tbl); L.appendChild(tb); L.appendChild(gw); ui.pg.appendChild(L);
  const tbody=tbl.querySelector('tbody');
  ['q','fs'].forEach(id=>$('#'+id).addEventListener('input',draw));

  const fmt=v=>(v==null||v==='')?'':Number(v).toLocaleString();
  const addD=(d,n)=>{const t=new Date(d);t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};

  function statusOf(r){
    if(r.idate) return '입고완료';
    if(!r.sdate) return '출고대기';
    if(r.edate && r.edate < TODAY) return '납기경과';
    if(r.edate && r.edate <= addD(TODAY,3)) return '납기임박';
    return '반출중';
  }
  function badge(st){
    const c={'입고완료':'#e2f0e6;color:#15803d','납기경과':'#fbe4e4;color:#b23030',
             '납기임박':'#fdeeda;color:#b05c12','반출중':'#e9f2fc;color:#1d568c',
             '출고대기':'#f1f3f5;color:#77828c'}[st];
    return '<span class="badge" style="background:'+(c||'#eee')+'">'+esc(st)+'</span>';
  }
  function drawSum(){
    const mon=TODAY.slice(0,7);
    $('#s_wait').textContent= ROWS.filter(r=>statusOf(r)==='출고대기').length;
    $('#s_out').textContent = ROWS.filter(r=>r.sdate&&!r.idate).length;
    $('#s_soon').textContent= ROWS.filter(r=>statusOf(r)==='납기임박').length;
    $('#s_late').textContent= ROWS.filter(r=>statusOf(r)==='납기경과').length;
    $('#s_done').textContent= ROWS.filter(r=>r.idate&&String(r.idate).slice(0,7)===mon).length;
  }
  function draw(){
    const q=$('#q').value.trim().toLowerCase(), f=$('#fs').value;
    const rank={'납기경과':0,'납기임박':1,'출고대기':2,'반출중':3,'입고완료':4};
    const rows=ROWS.filter(r=>(!q||[r.part,r.item,r.vendor,r.job,r.mold_no,r.map_part,r.partName]
        .some(v=>String(v||'').toLowerCase().includes(q))) && (!f||statusOf(r)===f))
      .sort((a,b)=>rank[statusOf(a)]-rank[statusOf(b)]
        || String(a.edate||'9999').localeCompare(String(b.edate||'9999')));
    tbody.innerHTML='';
    rows.forEach(r=>{
      const base=r.sdate||r.odate;
      const days=base?Math.round((new Date(r.idate||TODAY)-new Date(base))/864e5):null;
      const t=el('tr','clk'+(sel&&sel.no===r.no?' on':''));
      t.innerHTML='<td class="center">'+badge(statusOf(r))+'</td>'+
        '<td style="font-weight:800;color:#22537f">'+esc(r.part||'')+'</td>'+
        '<td class="center">'+esc(r.mold_no||'')+'</td><td>'+esc(r.map_part||'')+'</td>'+
        '<td>'+esc(r.item||'')+'</td><td>'+esc(r.partName||'')+'</td>'+
        '<td class="center">'+esc(r.mp||'')+'</td><td>'+esc(r.vendor||'')+'</td>'+
        '<td class="center">'+esc(r.odate||'-')+'</td>'+
        '<td class="center">'+esc(r.sdate||'-')+'</td>'+
        '<td class="center">'+esc(r.edate||'-')+'</td>'+
        '<td class="center">'+esc(r.idate||'-')+'</td>'+
        '<td class="num">'+(days!=null?days+'일':'')+'</td>'+
        '<td class="num">'+fmt(r.quote)+'</td>';
      t.addEventListener('click',()=>{ sel=r; draw(); pick(); });
      tbody.appendChild(t);
    });
    if(!rows.length) tbody.innerHTML='<tr><td colspan="14" class="center" style="height:52px;color:#8894a0">조건에 맞는 LOT이 없습니다.</td></tr>';
    $('#cnt').textContent=rows.length+'건';
  }

  function drawSteps(r){
    const box=$('#steps');
    if(!r){ box.innerHTML=''; return; }
    const st=statusOf(r), base=r.sdate||r.odate;
    const days=base?Math.round((new Date(r.idate||TODAY)-new Date(base))/864e5):null;
    box.innerHTML=
      '<div class="st '+(r.odate?'done':'')+'">발주<small>'+esc(r.odate||'없음')+'</small></div><div class="ar">▸</div>'+
      '<div class="st '+(r.sdate?'done':'on')+'">출고 · 반출<small>'+esc(r.sdate||'대기')+'</small></div><div class="ar">▸</div>'+
      '<div class="st '+(r.idate?'done':(!r.sdate?'':(st==='납기경과'?'ng':'on')))+'">가공중'+
        '<small>'+(days!=null?days+'일':'-')+(r.edate?' · 납기 '+esc(r.edate):'')+'</small></div><div class="ar">▸</div>'+
      '<div class="st '+(r.idate?'done':'')+'">입고<small>'+esc(r.idate||'대기')+'</small></div>';
  }

  function syncMold(from){
    const mo=$('#fMold').value.trim(), mp=$('#fMap').value.trim();
    let hit=null;
    if(from==='mold'&&mo) hit=MOLDS.find(m=>m.mold_no===mo);
    if(from==='map' &&mp) hit=MOLDS.find(m=>m.part_no===mp);
    if(hit){ if(from==='mold')$('#fMap').value=hit.part_no||''; else $('#fMold').value=hit.mold_no||''; }
    const c=hit||MOLDS.find(m=>m.mold_no===$('#fMold').value.trim());
    $('#mapInfo').innerHTML = c
      ? '🧩 '+esc(c.mold_no||'')+' · '+esc(c.part_no||'')+(c.asset_owner?' · '+esc(c.asset_owner):'')
      : (($('#fMold').value||$('#fMap').value)?'<span style="color:#b05c12">⚠ 금형정보에 없는 값</span>':'');
  }
  ['fMold','fMap'].forEach(id=>{
    $('#'+id).addEventListener('input',()=>syncMold(id==='fMold'?'mold':'map'));
    $('#'+id).addEventListener('change',()=>syncMold(id==='fMold'?'mold':'map'));
  });

  function clearSel(){
    sel=null; draw();
    $('#ttl').textContent='신규 등록';
    $('#sub').textContent='LOT번호와 외주처만 있으면 등록됩니다. 발주일은 비워도 됩니다.';
    ['fPart','fItem','fMold','fMap','fPname','fJob','fOdate','fIdate','fQuote']
      .forEach(id=>$('#'+id).value='');
    $('#fMp').value=''; $('#fVen').value='';
    $('#fSdate').value=TODAY; $('#fEdate').value=addD(TODAY,7);
    $('#mapInfo').innerHTML=''; drawSteps(null);
    $('#bDel').style.display='none'; $('#bIn').style.display='none'; $('#bOut').style.display='none';
    $('#bSave').style.display=CAN_S?'':'none';
    $('#oMsg').textContent='';
  }
  function pick(){
    $('#ttl').textContent='수정 — '+(sel.part||'');
    $('#sub').textContent=(sel.vendor||'')+' · '+statusOf(sel);
    $('#fPart').value=sel.part||''; $('#fItem').value=sel.item||'';
    $('#fMold').value=sel.mold_no||''; $('#fMap').value=sel.map_part||'';
    $('#fPname').value=sel.partName||''; $('#fJob').value=sel.job||'';
    $('#fMp').value=sel.mp||''; $('#fVen').value=sel.vendor||'';
    $('#fOdate').value=sel.odate||''; $('#fSdate').value=sel.sdate||'';
    $('#fEdate').value=sel.edate||''; $('#fIdate').value=sel.idate||'';
    $('#fQuote').value=sel.quote!=null?sel.quote:'';
    syncMold('mold'); drawSteps(sel);
    $('#bDel').style.display=CAN_D?'':'none';
    $('#bOut').style.display=(CAN_E&&!sel.sdate&&!sel.idate)?'':'none';
    $('#bIn').style.display=(CAN_E&&sel.sdate&&!sel.idate)?'':'none';
    $('#bSave').style.display=CAN_E?'':'none';
    $('#oMsg').textContent='';
  }

  function body(){
    const q=$('#fQuote').value.replace(/[^0-9.]/g,'');
    const sd=$('#fSdate').value||null, idt=$('#fIdate').value||null;
    return { part:$('#fPart').value.trim(), item:$('#fItem').value||null,
      mold_no:$('#fMold').value||null, map_part:$('#fMap').value||null,
      partName:$('#fPname').value||null, job:$('#fJob').value||null,
      mp:$('#fMp').value||null, vendor:$('#fVen').value||null,
      odate:$('#fOdate').value||null, sdate:sd, edate:$('#fEdate').value||null, idate:idt,
      quote:q===''?null:Number(q), st: idt?'완료':(sd?'진행':'발주') };
  }
  async function save(){
    const m=$('#oMsg'), b=body();
    if(!b.part){ m.className='msg err'; m.textContent='LOT번호를 입력하세요.'; return; }
    if(!b.vendor){ m.className='msg err'; m.textContent='외주처를 선택하세요.'; return; }
    if(b.idate && !b.sdate){ m.className='msg err'; m.textContent='출고일 없이 입고할 수 없습니다.'; return; }
    m.className='msg'; m.textContent='저장중...';
    try{
      let no=sel?sel.no:null;
      if(sel) await KI.upd(TBL.ospOrder,'no=eq.'+sel.no,b);
      else{ const r=await KI.ins(TBL.ospOrder,[b]); no=r&&r[0]?r[0].no:null; }
      m.className='msg ok'; m.textContent=sel?'✓ 수정되었습니다.':'✓ 등록되었습니다.';
      KI.msg('✓ '+b.part+' 저장');
      await load();
      sel=ROWS.find(x=>String(x.no)===String(no))||null;
      draw(); if(sel)pick();
    }catch(e){ m.className='msg err'; m.textContent='❌ '+e.message; }
  }
  async function step(field,label){
    if(!sel) return;
    if(!confirm(sel.part+' 을(를) 오늘('+TODAY+') '+label+' 처리할까요?'))return;
    const m=$('#oMsg');
    try{
      const b={}; b[field]=TODAY; b.st = field==='idate'?'완료':'진행';
      await KI.upd(TBL.ospOrder,'no=eq.'+sel.no,b);
      m.className='msg ok'; m.textContent='✓ '+label+' 처리되었습니다.';
      KI.msg('✓ '+sel.part+' '+label);
      const keep=sel.no; await load();
      sel=ROWS.find(r=>r.no===keep)||null; draw(); if(sel)pick();
    }catch(e){ m.className='msg err'; m.textContent='❌ '+e.message; }
  }
  async function delRow(){
    if(!sel) return;
    if(!confirm(sel.part+' 기록을 삭제할까요?\n삭제하면 되돌릴 수 없습니다.'))return;
    try{ await KI.del(TBL.ospOrder,'no=eq.'+sel.no); KI.msg('✓ 삭제되었습니다.');
      await load(); clearSel();
    }catch(e){ const m=$('#oMsg'); m.className='msg err'; m.textContent='❌ '+e.message; }
  }
  $('#bSave').addEventListener('click',save);
  $('#bOut').addEventListener('click',()=>step('sdate','출고(반출)'));
  $('#bIn').addEventListener('click',()=>step('idate','입고'));
  $('#bDel').addEventListener('click',delRow);

  function csv(){
    const head=['상태','LOT번호','금형제번','매핑품번','제품번호','부품명','가공공정','외주처',
                '발주일','출고일','납기일','입고일','단가','JOB'];
    const rows=ROWS.map(r=>[statusOf(r),r.part,r.mold_no,r.map_part,r.item,r.partName,r.mp,r.vendor,
      r.odate,r.sdate,r.edate,r.idate,r.quote,r.job]
      .map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','));
    const a=el('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+head.join(',')+'\n'+rows.join('\n')],{type:'text/csv'}));
    a.download='외주물류_'+TODAY+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  }

  async function load(){
    const [rows,ven,proc,molds]=await Promise.all([
      KI.get(OBJ.ospOrder+'?select=*&order=no.desc'),
      KI.get(OBJ.vendor+'?select=vendor_name&order=vendor_name.asc'),
      KI.get(OBJ.process+'?select=process_code,process_name&order=sort_order.asc'),
      KI.get(OBJ.moldSpec+'?select=mold_no,part_no,asset_owner&order=mold_no.asc')
    ]);
    ROWS=rows; VEN=ven; PROC=proc; MOLDS=molds;
    const mp=$('#fMp'), vn=$('#fVen'), mv=mp.value, vv=vn.value;
    mp.innerHTML='<option value="">선택</option>'+PROC.map(p=>'<option value="'+esc(p.process_code)+'">'+
      esc(p.process_code)+' · '+esc(p.process_name)+'</option>').join('');
    vn.innerHTML='<option value="">선택</option>'+VEN.map(v=>'<option>'+esc(v.vendor_name)+'</option>').join('');
    mp.value=mv; vn.value=vv;
    $('#dlMold').innerHTML=MOLDS.filter(m=>m.mold_no).map(m=>'<option value="'+esc(m.mold_no)+'">'+
      esc(m.part_no||'')+(m.asset_owner?' · '+esc(m.asset_owner):'')+'</option>').join('');
    $('#dlMap').innerHTML=MOLDS.filter(m=>m.part_no).map(m=>'<option value="'+esc(m.part_no)+'">'+
      esc(m.mold_no||'')+(m.asset_owner?' · '+esc(m.asset_owner):'')+'</option>').join('');
    if(sel) sel=ROWS.find(r=>r.no===sel.no)||null;
    drawSum(); draw();
    KI.msg('외주 LOT '+ROWS.length+'건 · 미입고 '+ROWS.filter(r=>!r.idate).length+'건');
  }
  try{ await load(); clearSel(); }
  catch(e){ tbody.innerHTML='<tr><td colspan="14" class="center" style="height:60px;color:#b0442f">❌ '+
    KI.esc(e.message)+'</td></tr>'; KI.msg('❌ '+e.message); }
})();
</script>
