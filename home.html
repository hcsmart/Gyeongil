<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>홈</title>
<link rel="stylesheet" href="ki_style.css" />
<style>
.hm{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:52vh;padding:40px 20px;text-align:center;color:#5b6b7b}
.hm .lg{font-size:40px;font-weight:900;letter-spacing:-1.6px;color:#22537f;line-height:1}
.hm .lg b{color:#3579b8}
.hm .lg i{font-style:normal;font-size:13px;font-weight:700;color:#8894a0;margin-left:6px;letter-spacing:0}
.hm .ds{margin-top:6px;font-size:16px;font-weight:800;line-height:1.8;color:#5b6b7b}
.hm .dv{width:52px;height:3px;background:#d7e2ec;border-radius:2px;margin:0 0 20px}
.hm .hint{font-size:12.5px;color:#9aa7b3}
.hm .hint b{color:#2668a8}
@media (max-width:820px){
  .hm{min-height:60vh;padding:34px 18px}
  .hm .lg{font-size:34px}
}
</style>
<script src="ki_config.js"></script>
<script src="ki_core.js"></script>
</head>
<body>
<script>
(async function(){
  if(!await KI.guard())return;
  const cur=KI.chrome('home');
  const ui=KI.page(cur,[]);
  const phone = KI.isPhone && KI.isPhone();

  const box=KI.el('div','hm');
  box.innerHTML=
    '<div class="dv"></div>'+
    '<div class="ds">작업할 메뉴를 선택하세요.</div>'+
    '<div class="hint" style="margin-top:14px">'+
      (phone ? '왼쪽 위 <b>☰</b> 버튼을 눌러 메뉴를 여세요.'
             : '상단의 <b>LOT관리 · 기준정보</b> 메뉴에서 화면을 선택하세요.')+
    '</div>';
  ui.pg.appendChild(box);
})();
</script>
</body>
</html>
