<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KI MES</title>
<link rel="stylesheet" href="ki_style.css">
<style>
.set{flex:1;min-height:0;overflow:auto;padding:12px;background:#eef2f6}
.box{max-width:620px;border:1px solid #a0aebc;background:#fff;margin-bottom:12px}
.box h3{margin:0;height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:#41556a;
  background:linear-gradient(#f4f7fa,#e5ebf1);border-bottom:1px solid #b3bfca}
.box h3 .tag{margin-left:auto;font-size:10px;font-weight:400;padding:1px 6px;border:1px solid #c3ccd6;background:#fff;color:#7b8794}
.bd{padding:12px}
.row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:8px;margin-bottom:8px}
.row label{color:#526171;font-weight:700}
.row input{height:28px;border:1px solid #aeb9c4;padding:0 8px;color:#42515f}
.foot{display:flex;gap:6px;align-items:center;padding-top:6px;border-top:1px solid #e3e8ed;margin-top:10px}
.msg{font-size:11px;font-weight:700}
.msg.ok{color:#15803d}.msg.err{color:#b91c1c}
.info{max-width:620px;margin:0 0 10px;padding:9px 11px;border:1px solid #bcd0e4;border-left:3px solid #2e77bd;
  background:#f2f7fc;color:#3d5063;line-height:1.8}
.info b{color:#1d568c}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 8px;color:#4d5a68}
.kv b{color:#22537f}
</style>
<script src="ki_config.js"></script>
<script src="ki_core.js"></script>
</head>
<body>
<script>
(async function(){
  if(!await KI.guard('settings'))return;
  const $=KI.$, C=KI.CFG, me=KI.me();
  const cur=KI.chrome('settings');
  const ui=KI.page(cur,[]);
  const w=KI.el('div','set');
  w.innerHTML=
    '<div class="info">비밀번호는 <b>Supabase Auth</b>에 안전하게 저장됩니다(해시). '+
      '최소 <b>'+C.MIN_PW+'자</b> 이상이어야 하며, 변경 후에는 모든 기기에서 새 비밀번호로 로그인합니다.</div>'+
    '<div class="box"><h3>👤 내 계정 정보</h3><div class="bd"><div class="kv">'+
      '<span>사번</span><b>'+KI.esc(me.emp_no||'-')+'</b>'+
      '<span>성명</span><b>'+KI.esc(me.emp_name||'-')+'</b>'+
      '<span>부서 / 직급</span><b>'+KI.esc((me.dept||'-')+' / '+(me.position||'-'))+'</b>'+
      '<span>권한</span><b>'+KI.esc(me.role||'-')+'</b>'+
      '<span>로그인 계정</span><b>'+KI.esc(me.login_email||'-')+'</b>'+
    '</div></div></div>'+
    '<div class="box"><h3>🔑 내 비밀번호 변경<span class="tag">본인</span></h3><div class="bd">'+
      '<div class="row"><label>현재 비밀번호</label><input type="password" id="cur" autocomplete="current-password"></div>'+
      '<div class="row"><label>새 비밀번호</label><input type="password" id="np" autocomplete="new-password" placeholder="'+C.MIN_PW+'자 이상"></div>'+
      '<div class="row"><label>새 비밀번호 확인</label><input type="password" id="np2" autocomplete="new-password"></div>'+
      '<div class="foot"><button class="btn primary" id="save">비밀번호 변경</button><span class="msg" id="msg"></span></div>'+
    '</div></div>'+
    (KI.isAdmin()
      ? '<div class="box"><h3>🛡 관리자 안내<span class="tag">관리자</span></h3><div class="bd" style="line-height:1.9;color:#4d5a68">'+
        '다른 사용자의 계정 생성 · 비밀번호 재설정 · 사용중지는 '+
        '<b><a href="user_info.html" style="color:#1d568c">시스템 › 사용자정보</a></b> 화면에서 처리합니다.<br>'+
        '화면별 조회/저장/수정/삭제 권한도 같은 화면의 권한 매트릭스에서 지정합니다.</div></div>'
      : '');
  ui.pg.appendChild(w);

  const say=(t,ok)=>{ const m=$('#msg'); m.className='msg '+(ok?'ok':'err'); m.textContent=t; KI.msg(t); };
  $('#save').addEventListener('click',async()=>{
    const cu=$('#cur').value, np=$('#np').value, np2=$('#np2').value;
    if(!cu) return say('현재 비밀번호를 입력하세요.');
    if(np.length<C.MIN_PW) return say('새 비밀번호는 '+C.MIN_PW+'자 이상이어야 합니다.');
    if(np!==np2) return say('새 비밀번호 확인값이 다릅니다.');
    if(np===cu) return say('현재 비밀번호와 동일합니다.');
    say('처리중...',true);
    try{
      /* 현재 비밀번호 재확인 */
      await KI.signIn(me.login_email||me.user_id, cu);
      await KI.changePassword(np);
      ['cur','np','np2'].forEach(i=>$('#'+i).value='');
      say('✓ 비밀번호가 변경되었습니다.',true);
    }catch(e){ say('❌ '+e.message); }
  });
})();
</script>
</body>
</html>
