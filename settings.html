<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KI MES</title>
<link rel="stylesheet" href="ki_style.css">
<style>
.set{flex:1;min-height:0;overflow:auto;padding:12px;background:#eef2f6}
.box{max-width:640px;border:1px solid #a0aebc;background:#fff;margin-bottom:12px}
.box h3{margin:0;height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:#41556a;
  background:linear-gradient(#f4f7fa,#e5ebf1);border-bottom:1px solid #b3bfca}
.box h3 .tag{margin-left:auto;font-size:10px;font-weight:400;padding:1px 6px;border:1px solid #c3ccd6;background:#fff;color:#7b8794}
.bd{padding:12px}
.row{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:8px;margin-bottom:8px}
.row label{color:#526171;font-weight:700}
.row input{height:28px;border:1px solid #aeb9c4;padding:0 8px;color:#42515f;letter-spacing:4px;font-size:14px}
.foot{display:flex;gap:6px;align-items:center;padding-top:6px;border-top:1px solid #e3e8ed;margin-top:10px}
.msg{font-size:11px;font-weight:700}
.msg.ok{color:#15803d}.msg.err{color:#b91c1c}
.note{max-width:640px;margin:0 0 10px;padding:8px 10px;border:1px solid #d8c48a;background:#fdf7e3;color:#7a6321;line-height:1.7}
.note b{color:#a4761a}
.warn{max-width:640px;margin:0 0 10px;padding:8px 10px;border:1px solid #e0a9a9;background:#fdecec;color:#8c2b2b;line-height:1.7}
</style>
<script src="ki_config.js"></script>
<script src="ki_core.js"></script>
</head>
<body>
<script>
(async function(){
  if(!KI.guard())return;
  const $=KI.$, C=KI.CFG, N=C.PIN_LEN, D=C.DEFAULT_PIN;
  const cur=KI.chrome('settings');
  const ui=KI.page(cur,[]);
  const row=(id,l,p)=>'<div class="row"><label>'+l+'</label><input type="password" id="'+id+'" maxlength="'+N+
    '" inputmode="numeric" autocomplete="new-password" placeholder="'+p+'"></div>';
  const w=KI.el('div','set');
  w.innerHTML=
    '<div class="note">비밀번호는 <b>'+N+'자리 숫자</b>이며 초기값은 <b>'+D+'</b> 입니다. '+
      'SHA-256 해시로 <b>'+OBJ.settings+'</b> 테이블에 저장되어 <b>모든 PC에 공통 적용</b>됩니다.</div>'+
    '<div id="warn"></div>'+
    '<div class="box"><h3>🔑 마스터 비밀번호<span class="tag">관리자</span></h3><div class="bd">'+
      row('mCur','현재 마스터 PIN','현재 비밀번호')+row('mNew','새 마스터 PIN','새 비밀번호')+row('mChk','새 PIN 확인','한번 더 입력')+
      '<div class="foot"><button class="btn primary" id="mSave">마스터 PIN 변경</button><span class="msg" id="mMsg"></span></div></div></div>'+
    '<div class="box"><h3>👤 일반 사용자 비밀번호<span class="tag">현장 공용</span></h3><div class="bd">'+
      row('uMst','마스터 PIN(권한확인)','마스터 비밀번호')+row('uNew','새 사용자 PIN','새 비밀번호')+row('uChk','새 PIN 확인','한번 더 입력')+
      '<div class="foot"><button class="btn primary" id="uSave">사용자 PIN 변경</button><span class="msg" id="uMsg"></span></div></div></div>'+
    '<div class="box"><h3>♻ 초기화</h3><div class="bd">'+
      row('rMst','마스터 PIN','마스터 비밀번호')+
      '<div class="foot"><button class="btn" id="rSave">초기 비밀번호('+D+')로 되돌리기</button><span class="msg" id="rMsg"></span></div></div></div>';
  ui.pg.appendChild(w);

  const ok=v=>new RegExp('^\\d{'+N+'}$').test(v||'');
  const say=(el,t,good)=>{ el.className='msg '+(good?'ok':'err'); el.textContent=t; };
  const who=()=>{ const s=KI.session(); return s?(s.role==='admin'?'관리자':'사용자'):'-'; };
  ['mCur','mNew','mChk','uMst','uNew','uChk','rMst'].forEach(id=>
    $('#'+id).addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,N)));

  async function warn(){
    const d=await KI.isDefaultPin(), a=[];
    if(d.master)a.push('마스터'); if(d.user)a.push('일반 사용자');
    $('#warn').innerHTML = a.length
      ? '<div class="warn">⚠ '+a.join(' / ')+' 비밀번호가 초기값('+D+') 상태입니다. 변경을 권장합니다.</div>' : '';
  }
  warn();

  $('#mSave').addEventListener('click',async()=>{
    const m=$('#mMsg'); say(m,'처리중...',true);
    try{
      const p=await KI.loadPins();
      if(await KI.sha256($('#mCur').value)!==p.pin_master) return say(m,'현재 마스터 PIN이 일치하지 않습니다');
      if(!ok($('#mNew').value)) return say(m,N+'자리 숫자로 입력하세요');
      if($('#mNew').value!==$('#mChk').value) return say(m,'새 PIN 확인값이 다릅니다');
      await KI.savePin('pin_master', await KI.sha256($('#mNew').value), who());
      ['mCur','mNew','mChk'].forEach(i=>$('#'+i).value='');
      say(m,'✓ 마스터 PIN이 변경되었습니다 (전 PC 공통)',true); warn();
    }catch(e){ say(m,'❌ '+e.message); }
  });
  $('#uSave').addEventListener('click',async()=>{
    const m=$('#uMsg'); say(m,'처리중...',true);
    try{
      const p=await KI.loadPins();
      if(await KI.sha256($('#uMst').value)!==p.pin_master) return say(m,'마스터 PIN이 일치하지 않습니다');
      if(!ok($('#uNew').value)) return say(m,N+'자리 숫자로 입력하세요');
      if($('#uNew').value!==$('#uChk').value) return say(m,'새 PIN 확인값이 다릅니다');
      if(await KI.sha256($('#uNew').value)===p.pin_master) return say(m,'마스터 PIN과 동일하게 설정할 수 없습니다');
      await KI.savePin('pin_user', await KI.sha256($('#uNew').value), who());
      ['uMst','uNew','uChk'].forEach(i=>$('#'+i).value='');
      say(m,'✓ 사용자 PIN이 변경되었습니다 (전 PC 공통)',true); warn();
    }catch(e){ say(m,'❌ '+e.message); }
  });
  $('#rSave').addEventListener('click',async()=>{
    const m=$('#rMsg');
    try{
      const p=await KI.loadPins();
      if(await KI.sha256($('#rMst').value)!==p.pin_master) return say(m,'마스터 PIN이 일치하지 않습니다');
      if(!confirm('마스터/사용자 PIN을 모두 '+D+' 로 초기화합니다.\n계속할까요?'))return;
      const h=await KI.sha256(D);
      await KI.savePin('pin_master',h,who()); await KI.savePin('pin_user',h,who());
      $('#rMst').value=''; say(m,'✓ 초기 비밀번호로 되돌렸습니다',true); warn();
    }catch(e){ say(m,'❌ '+e.message); }
  });
})();
</script>
</body>
</html>
