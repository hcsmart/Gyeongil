<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCM Smart</title>
<link rel="stylesheet" href="ki_style.css">
<style>
.gd{max-width:980px;padding:6px 12px 40px;line-height:1.75;font-size:13px;color:#2a3742}
.gd h2{font-size:17px;color:#1d3a57;border-bottom:2px solid #2e6497;padding:8px 2px;margin:14px 0 10px}
.gd h3{font-size:14px;color:#2e4a63;border-left:4px solid #2e77bd;padding-left:9px;margin:20px 0 7px}
.gd p{margin:5px 0}
.gd ol,.gd ul{margin:5px 0 5px 22px}
.gd li{margin:4px 0}
.gd b{color:#1d3a57}
.gd .path{display:inline-block;background:#eef3f8;border:1px solid #ccd9e4;color:#1d568c;
  font-weight:700;padding:0 7px;border-radius:2px;font-size:12px;white-space:nowrap}
.gd .tip{background:#fbf6e9;border:1px solid #e6d9ae;padding:8px 12px;margin:9px 0;color:#6b5416}
.gd .warn{background:#fdf1f1;border:1px solid #e4b9b9;padding:8px 12px;margin:9px 0;color:#8c2f2f}
.gd .flow{background:#f4f8fb;border:1px solid #d3e0ea;padding:10px 14px;margin:9px 0;
  font-weight:700;color:#22537f;line-height:2}
.gd .flow i{font-style:normal;color:#8b98a5;padding:0 4px}
.gd table{border-collapse:collapse;width:100%;margin:7px 0}
.gd th{background:#f0f4f8;border:1px solid #c6d3de;padding:5px 9px;font-size:12px;color:#41556a;text-align:left}
.gd td{border:1px solid #d6e0e8;padding:5px 9px;font-size:12px;vertical-align:top}
.gd .mn{font-weight:800;color:#22537f;white-space:nowrap}
</style>
<script src="ki_config.js"></script>
<script src="ki_core.js"></script>
</head>
<body>
<script>
(async function(){
  const sec=new URLSearchParams(location.search).get('sec')||'';
  if(!await KI.guard(null))return;          /* 로그인만 확인 — 안내는 전 사용자 열람 */
  /* ?sec= 로 들어오면 그 주제 메뉴를, 없으면 전체 안내를 현재 화면으로 표시 */
  const curId=(sec && FLAT['guide-'+sec]) ? 'guide-'+sec : 'guide';
  const cur=KI.chrome(curId);
  const el=KI.el, esc=KI.esc;
  const ui=KI.page(cur,[['인쇄','',()=>window.print()]]);
  const box=el('div','gd'); ui.pg.appendChild(box);
  const P=t=>'<span class="path">'+t+'</span>';

  const C={};

  /* ── 처음 시작하기 ── */
  C.start=
  '<h2>🚀 처음 시작하기 — 초기 설정 순서</h2>'+
  '<p>아래 순서로 기준정보를 채우면 이후 모든 화면이 자동으로 연결됩니다. '+
  '물류관리만 운영하는 경우 <b>1 · 2 · 3번</b>까지만 하면 됩니다.</p>'+
  '<h3>1. 사용자 · 권한</h3>'+
  '<ol><li>'+P('시스템 › 사용자정보')+' — 직원 등록 후 화면별 권한(조회 · 저장 · 수정 · 삭제)을 체크합니다.</li>'+
  '<li>관리자 계정은 모든 화면에 자동 접근되며, 일반 사용자는 부여된 화면만 보입니다.</li>'+
  '<li>협력사는 <b>계정 없이 QR 스캔만으로</b> 도착확인 · 출고가 가능합니다. '+
  '계정을 만들 경우 <b>소속을 협력사 정보의 업체명과 똑같이</b> 넣어야 그 업체 LOT이 자동으로 보입니다.</li></ol>'+
  '<h3>2. 외주 기준정보 <span style="font-size:12px;color:#8b98a5">(물류관리 필수)</span></h3>'+
  '<ol><li>'+P('기준정보 › 외주기준 › 협력사 정보')+' — 업체명 · 담당 공정코드 · 담당자 연락처. '+
  '여기 등록된 업체만 LOT 외주처 목록에 나타납니다.</li>'+
  '<li>'+P('표준 공정경로')+' — 공정 순서(예: MS → HQ → GS → WS). '+
  '이 순서가 <b>진척률의 분모</b>이자 반출 시 다음 공정 자동 제안의 근거입니다.</li></ol>'+
  '<h3>3. 금형 · 품번 매칭 <span style="font-size:12px;color:#8b98a5">(물류관리 필수)</span></h3>'+
  '<ol><li>'+P('기준정보 › 생산기준 › 금형정보')+' — 금형제번 · <b>매칭품번</b> · 자산처. '+
  '매칭품번은 LOT 등록 때 입력하는 품번과 <b>문자 하나까지 같아야</b> 금형제번 · 자산처가 자동으로 붙습니다.</li>'+
  '<li>이 화면이 <b>금형 식별의 기준</b>입니다. 저장하면 금형제번과 같은 코드로 '+
  '<b>금형대장</b>과 <b>금형별 연마/교체주기</b> 기본행이 자동으로 생깁니다. '+
  '금형제번을 바꾸면 대장 · 연마/교체주기 · 알람 · 점검/타발 이력의 코드가 함께 바뀌고, '+
  '삭제도 함께 정리됩니다(점검 · 세척 · 평가 · 타발 <b>이력이 있으면 삭제 차단</b>).</li>'+
  '<li>'+P('금형타입')+' · '+P('소재 비중정보')+' — 선택 목록 기준 (재질을 고르면 비중 · 소재중량이 자동계산)</li></ol>'+
  '<h3>4. 점검 기준정보 <span style="font-size:12px;color:#8b98a5">(금형관리 사용 시)</span></h3>'+
  '<ol><li>'+P('기준정보 › 점검기준 › 점검주기 기준')+' — 등급별 정기점검 주기 · 세척 한도</li>'+
  '<li>'+P('정기점검 항목')+' · '+P('일상점검 항목')+' · '+P('세척항목(순서)')+' · '+P('등급 평가항목')+'</li>'+
  '<li>'+P('연마/교체주기설정')+' — 공통 타발수 한도 · 기간, 금형별 예외는 '+P('금형별 연마/교체주기')+'</li></ol>'+
  '<h3>5. 알림</h3>'+
  '<ol><li>'+P('시스템 › 알림 설정(ntfy)')+' — 안돈 표시 · ntfy 서버/토픽. 휴대폰에 ntfy 앱 설치 후 토픽 구독</li></ol>'+
  '<div class="tip">💡 각 등록 화면 상단의 <b>[🎬 등록예제 안내]</b>를 누르면 입력란을 한 칸씩 채우면서 '+
  '무엇을 왜 적는지 말풍선으로 설명합니다. 값만 채우고 저장은 하지 않으므로 교육 · 시연에 그대로 쓸 수 있습니다.</div>'+
  '<div class="tip">💡 상단 메뉴의 <b>금형관리</b>가 회색이면 현재 비활성 상태입니다. '+
  '물류관리 파일럿 기간에는 물류관리 · 기준정보만 사용합니다.</div>';

  /* ── 금형 점검 업무 ── */
  C.mold=
  '<h2>🔧 금형 점검 업무 — 일상 · 정기 · 세척</h2>'+
  '<div class="flow">점검주기 기준 <i>→</i> 도래현황 · 연간계획 <i>→</i> 점검 등록 <i>→</i> 실적 조회 · SQ 실시율</div>'+
  '<h3>매일 하는 일</h3>'+
  '<ul><li>'+P('점검등록 › 일상점검 등록')+' — 생산 전 상형 8 / 하형 8 항목 체크. 불량 항목은 조치 내용 기록</li>'+
  '<li>'+P('금형평가 › 일별 타발수 등록')+' — 금형별 당일 생산 타발수 입력 (누적 · 월별 자동 반영)</li></ul>'+
  '<h3>주기 점검 (정기 · 세척)</h3>'+
  '<ol><li>'+P('점검계획 › 점검 도래현황')+' — 지연 · 임박 금형 확인. 행을 클릭하면 해당 금형이 선택된 채로 등록 화면으로 이동</li>'+
  '<li>'+P('점검등록 › 정기점검 등록')+' — 항목별 측정값 입력, 판정 자동 산출, 다음 점검 예정일 자동 계산</li>'+
  '<li>'+P('점검등록 › 세척등록')+' — 세척항목(순서) 체크. 타발수 한도(양산 100만 / A·S 50만) 또는 1년 경과 시 도래</li></ol>'+
  '<h3>연간 계획 · 실시율</h3>'+
  '<ul><li>'+P('점검계획 › 점검 예측 · 계획표')+' — 등급별 자동 배정(A 1회/년 · B 2회 · C 4회), 월 칸 클릭으로 조정</li>'+
  '<li>실시 여부는 점검 실적으로 자동 판정 — <b>실시율은 SQ 심사 지표</b>입니다</li>'+
  '<li>'+P('점검등록 › 등록실적 조회')+' — 일상/정기/세척 통합 이력, 항목별 측정값</li></ul>'+
  '<div class="tip">💡 점검주기는 등급에 따릅니다. 등급이 바뀌면(등급평가) 주기와 연간 계획이 함께 갱신됩니다.</div>';

  /* ── 연마 · 교체 ── */
  C.tool=
  '<h2>⚙ 연마 · 교체 관리</h2>'+
  '<div class="flow">주기 기준 설정 <i>→</i> 일별 타발수 입력 <i>→</i> 도래 · 예상일 감시 <i>→</i> 안돈 · ntfy 알림 <i>→</i> 실시 등록</div>'+
  '<h3>기준 설정</h3>'+
  '<ul><li>'+P('기준정보 › 생산기준 › 연마/교체주기설정')+' — 공통 기준 (타발수 한도 · 기간 · 임박%)。'+
  '대상 ALL은 전체, 금형종류 지정 시 그 종류가 우선</li>'+
  '<li>'+P('금형별 연마/교체주기')+' — 특정 금형만 다르게. <b>공통기준 사용</b> 해제 시 개별값 적용</li></ul>'+
  '<h3>판정 방식</h3>'+
  '<ul><li><b>소진율</b> = (누적 타발수 − 최근 실시 타발수) ÷ 한도. 100% 이상 <b>도래</b>, 임박% 이상 <b>임박</b></li>'+
  '<li>기간 기준: 최근 실시일 + 주기(일) 경과 시 도래</li>'+
  '<li><b>예상 도래일</b>: 최근 30일 일평균 타발수로 잔여 소진일을 예측 — 7일 이내면 임박(타발수 예측)</li></ul>'+
  '<h3>운영</h3>'+
  '<ol><li>'+P('금형관리 › 점검계획 › 연마·교체 도래현황')+' — 도래 · 임박 발생 시 하단 <b>안돈 배너</b> + <b>ntfy 푸시</b></li>'+
  '<li>연마 · 교체 완료 후 [실시등록] — 실시일과 그 시점 누적 타발수를 입력하면 기준점이 갱신되고 알람이 해제됩니다</li>'+
  '<li>'+P('연마·교체 알람이력')+' — 발생 → 조치중 → 해제 관리</li></ol>'+
  '<div class="warn">⚠ 실시등록을 빠뜨리면 소진율이 계속 누적되어 항상 도래로 표시됩니다. '+
  '기준점이 없는 금형은 도래현황의 [기준 초기화]로 일괄 설정하세요.</div>';

  /* ── LOT 외주 진행 ── */
  C.lot=
  '<h2>📦 LOT 외주 진행 (공정이동표 QR)</h2>'+
  '<div class="flow">사내 반출 등록 <i>→</i> 이동표(QR) 발행 <i>→</i> 협력사 도착확인 <i>→</i> 작업 후 '+
  '<b>경일FB 사내입고</b> <i>→</i> 사내 검사 <i>→</i> 다음 공정 반출 <i>→</i> … <i>→</i> 사내입고(종결)</div>'+
  '<div class="tip">💡 <b>외주 공정이 끝난 제품은 반드시 경일FB로 돌아옵니다.</b> '+
  '검사 후 다음 공정으로 다시 반출하는 구조이며, 외주처 간 직송은 지원하지 않습니다.</div>'+

  '<h3>1. 사내 — 반출 등록</h3>'+
  '<ol><li>'+P('물류관리 › 물류등록')+' — 목록에서 <b>LOT 행을 클릭</b>하면 그 LOT 팝업이 열리고, '+
  '처음 반출하는 LOT은 상단 <b>[신규등록]</b>으로 시작합니다.</li>'+
  '<li>팝업 본문은 <b>요약</b>만 보여줍니다 — 기본정보 · 공정 흐름도 · 이동중(입고 대기) 목록.</li>'+
  '<li>나머지는 팝업 <b>위쪽 단추</b>로 필요할 때만 꺼내 봅니다.</li>'+
  '<li>JOB(자동채번) · 품번 · 표준공정 · 가공공정 · 외주처 · LOT/수량을 넣고 <b>[📤 반출 등록]</b>으로 저장합니다.</li>'+
  '<li>저장 후 <b>[🖨 이동표(QR)]</b>를 인쇄해 <b>제품과 함께</b> 보냅니다 (LOT당 1장).</li>'+
  '<li>목록 상단 <b>[새로고침]</b>, 팝업 위쪽 <b>[🔄 새로고침]</b> — 협력사가 방금 스캔한 내용을 즉시 반영합니다.</li></ol>'+
  '<table><thead><tr><th style="width:150px">팝업 위쪽 단추</th><th>하는 일</th></tr></thead><tbody>'+
  '<tr><td class="mn">📤 반출등록</td><td>다음 공정 반출 <b>입력폼</b>을 엽니다. 저장 · 수정취소도 이 창 안에서</td></tr>'+
  '<tr><td class="mn">📝 현장기록</td><td>이 LOT의 <b>물류 흐름 · 특기사항</b> 전체. 숫자 배지는 기록 건수</td></tr>'+
  '<tr><td class="mn">❔ 범례</td><td>흐름도 <b>색 · 아이콘</b>의 뜻</td></tr>'+
  '<tr><td class="mn">🔄 새로고침</td><td>협력사가 방금 QR로 처리한 내용을 다시 읽기</td></tr>'+
  '<tr><td class="mn">🖨 이동표(QR)</td><td>공정이동표 발행 · 인쇄</td></tr>'+
  '<tr><td class="mn">🏭 사내입고</td><td>모든 공정이 끝난 LOT 종결 (또는 분납 추가)</td></tr>'+
  '</tbody></table>'+
  '<div class="tip">💡 화면 아래에는 평소 아무것도 없고, <b>저장 결과 · 오류 메시지가 있을 때만</b> 한 줄이 나타납니다.</div>'+

  '<h3>2. 협력사 — QR 리딩 (로그인 불필요)</h3>'+
  '<div class="tip">💡 <b>협력사 첫 사용</b> — 업체를 미리 고를 필요가 없습니다. '+
  P('협력사 QR 스캔(모바일)')+'을 열고 <b>공정이동표의 QR만 찍으면</b> 됩니다. '+
  '이동표가 보유 업체를 알려주므로 우리 업체가 자동으로 인식되어 이 휴대폰에 저장되고, '+
  '기록에 남길 <b>담당자 성함만 한 번</b> 입력합니다. 다음부터는 찍기만 하면 됩니다.<br>'+
  '한 LOT을 두 업체가 나눠 가진 <b>분할</b> 상황에서만 그 두 곳 중 어디인지 물어봅니다. '+
  '업체를 바꾸려면 상단의 업체명을 누르세요.</div>'+
  '<ol><li><b>도착확인</b> — 수령 시 스캔 → 확인 업체 · 입고수량 입력. 부족수량은 자동 계산됩니다. '+
  '확인창에서 최종 확인하며, <b>한 번 등록하면 버튼이 잠겨</b> 중복 등록되지 않습니다.</li>'+
  '<li><b>출고</b> — 작업 완료 후 스캔 → 보내는 곳은 <b>경일FB 사내입고로 고정</b>. '+
  '입고수량을 넣고 등록하면 반출건이 마감되고 제품은 사내 보유가 됩니다.</li>'+

  '<li>수량 · 부족 · 체류일 같은 <b>숫자 열은 크기 순</b>, 나머지는 가나다 순입니다. '+
  'LOT 번호처럼 숫자가 섞인 값도 자릿수를 인식합니다 (Lot-99 < Lot-1222).</li>'+
  '<li>빈 값은 방향과 상관없이 <b>항상 뒤로</b> 갑니다. 값이 같으면 원래 등록순을 유지합니다.</li>'+
  '<li>정렬은 화면에서만 바뀌며 저장된 데이터는 그대로입니다. <b>엑셀다운로드도 보이는 순서 그대로</b> 받습니다.</li></ul>'+
  '<h3>검색형 선택칸</h3>'+
  '<ul><li>품번 · 표준공정 · 가공공정 · 외주처처럼 항목이 많은 칸은 <b>입력하면 목록이 좁혀집니다.</b> '+
  '목록을 끝까지 내려 찾을 필요가 없습니다.</li>'+
  '<li>품번은 <b>일부만</b> 쳐도 됩니다 — "220"만 입력해도 MD-220-BR이 걸립니다. 대소문자는 구분하지 않습니다.</li>'+
  '<li><b>↑ ↓</b>로 이동하고 <b>Enter</b>로 선택합니다. <b>Esc</b>는 닫기입니다.</li>'+
  '<li>목록에 없는 값은 <b>받지 않습니다.</b> 잘못 입력한 뒤 다른 곳을 클릭하면 원래 값으로 되돌아갑니다. '+
  '오타로 등록되지 않은 품번이 저장되는 것을 막기 위한 것입니다.</li></ul>'+
  '<h3>버튼 색으로 구분하기</h3>'+
  '<ul><li><b>파랑</b> 조회 · 저장 &nbsp;/&nbsp; <b>분홍</b> 등록 · 신규등록 &nbsp;/&nbsp; <b>빨강</b> 삭제 &nbsp;/&nbsp; '+
  '<b>주황</b> 사내입고 &nbsp;/&nbsp; 회색은 그 외 보조 기능입니다.</li>'+
  '<li>화면 폭이 좁으면 뒤쪽 버튼이 <b>[⋯]</b> 메뉴로 접힙니다. 색은 메뉴 안에서도 그대로 유지됩니다.</li></ul>'+
  '<h3>기준코드 수정 (개명)</h3>'+
  '<ul><li>기준정보의 <b>코드 칸</b>(공정코드 · 업체코드 · 호기번호 · 장소코드 · 표준공정번호 · 금형제번 등)은 '+
  '[수정]에서 <b>직접 고칠 수 있습니다.</b></li>'+
  '<li>코드를 바꾸면 <b>그 코드를 쓰던 자료도 함께 바뀝니다.</b> 예를 들어 공정코드를 고치면 '+
  '표준 공정경로 · 반출건 · 현장기록 · 협력사 담당공정이 한꺼번에 갱신됩니다. '+
  '바꾸기 전에 확인창으로 대상 코드를 한 번 더 보여줍니다.</li>'+
  '<li>이미 쓰이는 코드로는 바꿀 수 없습니다 — <b>중복 검사</b> 후 거부됩니다.</li></ul>'+
  '<div class="warn">⚠ 이미 인쇄해 나간 <b>공정이동표(QR)</b>와 출력물은 옛 코드 그대로입니다. '+
  '운영 중 코드 변경은 <b>오타 정정 수준</b>으로만 쓰세요.</div>'+
  '<h3>조회 · 초기화 · 엑셀</h3>'+
  '<ul><li><b>[조회]</b>를 누르면 버튼이 회색으로 바뀌며 <b>조회중...</b>이 표시되고, 그동안 다시 눌러도 중복 조회되지 않습니다.</li>'+
  '<li><b>[초기화]</b>는 검색조건과 정렬을 모두 처음 상태로 되돌립니다. 조건이 꼬였을 때 다시 좁히는 편이 빠릅니다.</li>'+
  '<li><b>[엑셀다운로드]</b>는 <b>현재 조건 · 정렬 그대로</b> CSV로 받습니다. 결과가 없으면 파일을 만들지 않습니다.</li></ul>'+
  '<h3>등록예제 안내</h3>'+
  '<ul><li>등록 화면 상단의 <b>[🎬 등록예제 안내]</b>는 입력란을 한 칸씩 채우며 무엇을 왜 적는지 설명합니다. '+
  '<b>저장은 하지 않으므로</b> 교육 · 시연에 그대로 쓸 수 있습니다.</li>'+
  '<li>조회 화면(LOT 추적)에서는 <b>검색조건을 좁혀가는 순서</b>를 보여줍니다.</li>'+
  '<li>하단 조작바에서 <b>이전 · 다음 · 일시정지 · 속도 · 한번에</b>를 쓸 수 있고, <b>ESC</b>로 언제든 중지합니다.</li>'+
  '<li>안내가 채운 값은 예시일 뿐입니다. <b>실제 값으로 고친 뒤</b> 저장하세요.</li></ul>'+
  '<h3>모바일</h3>'+
  '<ul><li>협력사 QR 스캔은 휴대폰 카메라로 동작하며 <b>로그인이 필요 없습니다.</b></li>'+
  '<li>좁은 화면에서는 표가 <b>가로로 스크롤</b>됩니다. 제목행은 위에 고정되어 열 이름을 계속 볼 수 있습니다.</li></ul>';

  /* ── 전체 메뉴 설명 (config 에서 자동 생성) ── */
  C.menu=(function(){
    let h='<h2>🗂 전체 메뉴 설명</h2><p>메뉴 구성은 시스템 설정에서 자동으로 생성됩니다.</p>';
    const NAV=(typeof MENU_V!=='undefined'&&MENU_V.length)?MENU_V:MENU;
    NAV.filter(m=>m.key!=='guide').forEach(m1=>{
      h+='<h3>'+esc(m1.name)+'</h3>';
      m1.second.forEach(m2=>{
        h+='<table><thead><tr><th style="width:190px">'+esc(m1.name)+' › '+esc(m2.name)+
           '</th><th>용도</th></tr></thead><tbody>';
        m2.groups.forEach(g=>g.items.forEach(it=>{
          h+='<tr><td class="mn">'+esc(it.n)+'</td><td>'+esc(it.d||'')+'</td></tr>';
        }));
        h+='</tbody></table>';
      });
    });
    return h;
  })();

  /* 통합 표시 : ?sec= 지정 시 해당 섹션만, 없으면 전체(숨김 모듈 제외) */
  if(sec && C[sec]){
    const NAMES={start:'처음 시작하기',mold:'금형 점검',tool:'연마 · 교체',lot:'LOT 외주 진행',
                 track:'LOT 추적 사용법',shot:'타발수 · 등급',common:'화면 공통 조작',menu:'전체 메뉴'};
    const hideMold2=(typeof HIDE!=='undefined'&&HIDE.mod&&HIDE.mod.indexOf('mold')>=0)
                 || (typeof DIM_MOD!=='undefined'&&DIM_MOD.indexOf('mold')>=0);
    const keys=(hideMold2?['start','lot','track','common','menu']
                         :['start','mold','tool','lot','track','shot','common','menu'])
               .filter(k=>C[k]);
    box.innerHTML=C[sec]+
      '<div class="tip" style="margin-top:22px">📖 다른 주제 — '+
      keys.filter(k=>k!==sec).map(k=>'<a href="guide.html?sec='+k+'" '+
        'style="color:#1d568c;font-weight:700;margin-right:10px">'+esc(NAMES[k]||k)+'</a>').join('')+
      '<a href="guide.html" style="color:#41556a;font-weight:700">전체 보기</a></div>';
  }
  else{
    const hideMold = (typeof HIDE!=='undefined' && HIDE.mod && HIDE.mod.indexOf('mold')>=0)
                  || (typeof DIM_MOD!=='undefined' && DIM_MOD.indexOf('mold')>=0);
    const order = hideMold ? ['start','lot','track','common','menu']
                           : ['start','mold','tool','lot','track','shot','common','menu'];
    box.innerHTML = order.map(k=>C[k]||'').join('<hr style="margin:26px 0;border:0;border-top:2px solid #d5dde4">');
  }
  KI.msg(cur.path);
})();
</script>
</body>
</html>
