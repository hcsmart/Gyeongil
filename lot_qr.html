<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>공정이동표 입출고 — GI MES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 'Malgun Gothic','맑은 고딕',sans-serif;background:#eef1f4;color:#1d2833;padding-bottom:34px}
.top{background:linear-gradient(#3d7ab5,#2e6497);color:#fff;padding:11px 13px;font-weight:800;font-size:16px;
     display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
.top .me{margin-left:auto;font-weight:700;font-size:11.5px;background:rgba(255,255,255,.18);
     border:1px solid rgba(255,255,255,.35);color:#fff;padding:4px 9px;border-radius:14px;cursor:pointer;line-height:1.3}
.wrap{max-width:560px;margin:0 auto;padding:10px}
.card{background:#fff;border:1px solid #c6d0da;margin-bottom:10px}
.card h3{font-size:13px;background:#f0f4f8;border-bottom:1px solid #d9e1e8;padding:8px 11px;color:#2e4a63}
.card .bd{padding:10px 11px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 8px;font-size:13px}
.kv b{color:#526171;font-weight:700}
.chain{margin-top:8px;line-height:2.1;font-size:12px}
.chain span{padding:2px 8px;border-radius:2px;background:#eef1f4;color:#7b8794;white-space:nowrap}
.chain .done{background:#2f7d4d;color:#fff;font-weight:700}
.chain .mine{background:#e8862e;color:#fff;font-weight:800}
.chain .nx{background:#2e77bd;color:#fff;font-weight:700}
.row{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;margin-bottom:9px}
.row label{font-size:12px;font-weight:700;color:#526171}
input,select,textarea{width:100%;border:1px solid #aeb9c4;padding:9px;font:inherit;font-size:15px;background:#fff}
textarea{min-height:56px;font-size:14px}
.bt{width:100%;height:48px;border:0;font-size:16px;font-weight:800;color:#fff;cursor:pointer;margin-top:6px}
.bt.in{background:#2f7d4d}.bt.out{background:#2e77bd}.bt.home{background:#e8862e}.bt.memo{background:#526171}
.bt[disabled]{opacity:.55}
.tab{display:flex;border-bottom:2px solid #2e6497;background:#fff;flex-wrap:wrap}
.tab button{flex:1;min-width:82px;height:44px;border:0;background:#f0f4f8;font-weight:700;color:#526171;cursor:pointer;font-size:13.5px}
.tab button.on{background:#2e6497;color:#fff}
.pane{display:none}.pane.on{display:block}
.short{color:#b23030;font-weight:800;font-size:12px}
.part{color:#1d568c;font-weight:800;font-size:12px}
.msg{padding:9px 12px;font-weight:700;font-size:13px}
.msg.ok{color:#15803d}.msg.err{color:#b23030}
.hist td{border-bottom:1px solid #eef1f4;padding:5px 4px;font-size:12px;vertical-align:top}
.badge{display:inline-block;padding:1px 7px;border-radius:2px;font-size:11px;font-weight:700}
.b-in{background:#e2f0e6;color:#15803d}.b-out{background:#e9f2fc;color:#1d568c}.b-etc{background:#f1f3f5;color:#526171}
.err-box{max-width:480px;margin:40px auto;background:#fff;border:1px solid #e0a5a5;padding:22px;text-align:center;color:#b23030;font-weight:700}
.todo{padding:9px 11px;font-size:13px;font-weight:700;border-bottom:1px solid #d9e1e8;line-height:1.55}
.todo.a{background:#f2f8f3;color:#15803d}
.todo.b{background:#eef4fb;color:#1d568c}
.todo.c{background:#fdf5ec;color:#a4600f}
.vlist{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.vlist button{height:52px;border:1px solid #aeb9c4;background:#fff;font:inherit;font-size:16px;font-weight:700;
   color:#1d2833;cursor:pointer;text-align:left;padding:0 14px}
.vlist button.on{border:2px solid #2e6497;background:#eef4fb;color:#1d568c}
.gate h2{font-size:16px;color:#2e4a63;margin-bottom:4px}
.gate p{font-size:12.5px;color:#7b8794;margin-bottom:10px;line-height:1.6}
</style>
<script src="ki_config.js"></script>
</head>
<body>
<div class="top">📋 공정이동표 <span class="me" id="meBtn" style="display:none"></span></div>
<div class="wrap" id="wrap">불러오는 중...</div>
<script>
(function(){
const C=KI_CFG;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>Number(v)||0;
const TODAY=new Date().toISOString().slice(0,10);
const TOKEN=new URLSearchParams(location.search).get('t')||'';
const wrap=$('#wrap');
const HOME='사내 (발주처)';
let D=null, WORKER='', MYVEN='';
try{ WORKER=localStorage.getItem('ki_qr_worker')||''; MYVEN=localStorage.getItem('ki_qr_vendor')||''; }catch(e){}
const isHome=()=>MYVEN===HOME;

/* 토큰 RPC (로그인 불필요 — publishable key 사용) */
async function rpc(fn,args){
  const r=await fetch(C.SUPABASE_URL+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'Content-Type':'application/json',apikey:C.SUPABASE_KEY,
             Authorization:'Bearer '+C.SUPABASE_KEY},
    body:JSON.stringify(Object.assign({p_token:TOKEN},args||{}))});
  const t=await r.text();
  let j=null; try{ j=JSON.parse(t); }catch(e){}
  if(!r.ok) throw new Error((j&&(j.message||j.hint))||t.slice(0,150)||('오류 '+r.status));
  return j;
}

if(!TOKEN){ wrap.innerHTML='<div class="err-box">공정이동표의 QR을 스캔해 주세요.<br><small>(유효한 이동표 링크가 아닙니다)</small></div>'; return; }

const movedOf = no => (D.moves||[]).filter(m=>m.io==='출고'&&String(m.osp_no||'')===String(no))
                       .reduce((a,b)=>a+num(b.out_qty),0);
const arrQtyOf = no => { const a=(D.moves||[]).filter(m=>(m.io==='도착'||m.io==='입고')&&
                           String(m.osp_no||'')===String(no)&&m.in_qty!=null)[0];
                         return a?num(a.in_qty):null; };
const remainOf = o => { const a=arrQtyOf(o.no);
                        return Math.max((a==null?num(o.qty):a)-movedOf(o.no),0); };
const arrivedOf = o => (D.moves||[]).find(m=>(m.io==='도착'||m.io==='입고')&&String(m.osp_no||'')===String(o.no))||null;
const pName = c => { const p=(D.procs||[]).find(x=>x.c===c); return p?p.n:''; };
const label = c => esc(c)+(pName(c)?' · '+esc(pName(c)):'');

/* ── 우리 업체 선택 (최초 1회 — 이후 이 기기에 저장) ── */
function gate(){
  const list=(D&&D.vendors?D.vendors:[]).slice();
  $('#meBtn').style.display='none';
  wrap.innerHTML='<div class="card gate"><h3>🏭 우리 업체 선택</h3><div class="bd">'+
    '<h2>이 기기를 사용하는 곳은 어디입니까?</h2>'+
    '<p>한 번만 선택하면 이 기기에 저장됩니다. 다음부터는 QR을 찍는 즉시 우리 업체 기준으로 열립니다.</p>'+
    '<div class="vlist" id="vl">'+
      list.map(v=>'<button data-v="'+esc(v)+'"'+(v===MYVEN?' class="on"':'')+'>🏢 '+esc(v)+'</button>').join('')+
      '<button data-v="'+esc(HOME)+'"'+(MYVEN===HOME?' class="on"':'')+'>🏠 '+esc(HOME)+'</button>'+
    '</div>'+
    '<div class="row"><label>담당자</label><input id="gWk" value="'+esc(WORKER)+'" placeholder="성함 (기록에 남습니다)"></div>'+
    '<button class="bt in" id="gGo">✅ 시작하기</button>'+
    '<div class="msg" id="msg"></div>'+
  '</div></div>';
  let pick=MYVEN;
  wrap.querySelectorAll('#vl button').forEach(b=>b.addEventListener('click',()=>{
    pick=b.dataset.v;
    wrap.querySelectorAll('#vl button').forEach(x=>x.classList.toggle('on',x===b));
  }));
  $('#gGo').addEventListener('click',()=>{
    const wk=$('#gWk').value.trim();
    if(!pick){ $('#msg').className='msg err'; $('#msg').textContent='업체를 선택하세요.'; return; }
    if(!wk){ $('#msg').className='msg err'; $('#msg').textContent='담당자 성함을 입력하세요.'; return; }
    MYVEN=pick; WORKER=wk;
    try{ localStorage.setItem('ki_qr_vendor',MYVEN); localStorage.setItem('ki_qr_worker',WORKER); }catch(e){}
    draw();
  });
}

async function load(){
  wrap.innerHTML='불러오는 중...';
  try{ D=await rpc('ki_scan_info'); }
  catch(e){ wrap.innerHTML='<div class="err-box">'+esc(e.message)+
    '<br><br><small style="font-weight:400;color:#526171">폐기되었거나 만료된 이동표입니다.<br>발주처 담당자에게 재발행을 요청하세요.</small></div>'; return; }
  if(!MYVEN) gate(); else draw();
}

function draw(){
  const osp=(D.osp||[]), lot=D.lot||{}, rt=D.route||null;
  const open=osp.filter(o=>o.sdate&&!o.idate);
  const STEPS=rt&&Array.isArray(rt.steps)?rt.steps:[];
  const MVSEEN=new Set((D.moves||[]).filter(m=>m.mp&&(m.io==='도착'||m.io==='입고')).map(m=>m.mp));
  (Array.isArray(lot.steps)?lot.steps:[]).forEach(s=>{ if(s.mp) MVSEEN.add(s.mp); });
  const rest=STEPS.filter(x=>!MVSEEN.has(x)&&!open.some(o=>o.mp===x));
  const doneAll=STEPS.length&&!rest.length&&!open.length;
  const last=osp[osp.length-1]||{};
  const VEN=D.vendors||[], MV=(D.moves||[]).slice(0,10);

  /* 우리 업체 기준 할 일 판단 */
  const mine   = open.filter(o=>o.vendor===MYVEN);
  const toArr  = mine.filter(o=>!arrivedOf(o));                 /* 오는 중 → 입고 */
  const toOut  = mine.filter(o=>arrivedOf(o)&&remainOf(o)>0);   /* 보유 중 → 출고 */
  const myMp   = (mine[0]||{}).mp||'';
  const others = open.filter(o=>o.vendor!==MYVEN);

  $('#meBtn').style.display='';
  $('#meBtn').innerHTML='🏢 '+esc(MYVEN)+(WORKER?' · '+esc(WORKER):'')+' ▾';

  const todo = isHome()
    ? (doneAll?'<div class="todo c">🏠 모든 공정 완료 — <b>[🏭 사내입고]</b>로 LOT을 종결하세요.</div>'
              :'<div class="todo b">🏠 발주처 모드 — 진행 상황 확인 및 기록이 가능합니다.</div>')
    : (toArr.length?'<div class="todo a">📥 우리 업체로 <b>'+num(remainOf(toArr[0])).toLocaleString()+
                    '개</b>가 오고 있습니다. 물건이 도착하면 <b>[입고]</b>를 등록하세요.</div>'
      :(toOut.length?'<div class="todo b">📤 우리 업체 보유 <b>'+num(remainOf(toOut[0])).toLocaleString()+
                     '개</b>. 작업 완료 후 <b>[출고]</b>로 다음 공정에 보내세요.</div>'
      :(others.length?'<div class="todo c">⏳ 이 LOT은 현재 <b>'+esc(others[0].vendor||'')+
                      '</b>에 있습니다. 우리 업체 차례가 아닙니다.</div>'
                    :'<div class="todo c">현재 우리 업체가 처리할 건이 없습니다.</div>')));

  const defTab = isHome()? (doneAll?'home':'memo') : (toArr.length?'in':(toOut.length?'out':'memo'));

  wrap.innerHTML=
  '<div class="card"><h3>📦 LOT 정보</h3><div class="bd">'+
    '<div class="kv"><b>LOT</b><span style="font-weight:800;font-size:16px;color:#22537f">'+esc(D.part)+'</span>'+
    '<b>품번</b><span>'+esc(last.map_part||'-')+(last.mold_no?' <small style="color:#7b8794">('+esc(last.mold_no)+')</small>':'')+'</span>'+
    '<b>JOB</b><span>'+esc(lot.job||last.job||'-')+'</span>'+
    '<b>표준공정</b><span>'+(rt?esc(rt.standard_process_name):'(미매칭)')+'</span>'+
    '<b>총수량</b><span>'+(osp[0]&&osp[0].qty!=null?num(osp[0].qty).toLocaleString():'-')+'</span>'+
    '<b>사내입고</b><span>'+(D.receipt?'✅ '+esc(D.receipt.in_date)+' · '+num(D.receipt.qty).toLocaleString():'미입고')+'</span></div>'+
    (STEPS.length?'<div class="chain">'+STEPS.map(x=>{
      const d=MVSEEN.has(x), w=open.some(o=>o.mp===x), me=(x===myMp&&!isHome());
      return '<span class="'+(me?'mine':d?'done':w||x===rest[0]?'nx':'')+'">'+esc(x)+(pName(x)?' '+esc(pName(x)):'')+
             (me?' ◀우리':d?' ✓':w?' (진행중)':'')+'</span>';
    }).join(' → ')+'</div>':'')+
  '</div></div>'+

  '<div class="card">'+todo+'<div class="tab">'+
    '<button data-t="in"'+(defTab==='in'?' class="on"':'')+'>📥 입고</button>'+
    '<button data-t="out"'+(defTab==='out'?' class="on"':'')+'>📤 출고</button>'+
    (isHome()&&doneAll&&!D.receipt?'<button data-t="home"'+(defTab==='home'?' class="on"':'')+'>🏭 사내입고</button>':'')+
    '<button data-t="memo"'+(defTab==='memo'?' class="on"':'')+'>📝 특기사항</button></div>'+

    /* 입고 — 우리 업체 도착 */
    '<div class="pane'+(defTab==='in'?' on':'')+'" data-p="in"><div class="bd">'+
    (function(){
      const cand = isHome()? open : (toArr.length?toArr:mine);
      if(!cand.length) return '<div style="color:#8894a0;padding:8px 0">우리 업체로 입고될 건이 없습니다.'+
        (others.length?'<br><small>현재 보유 : '+esc(others[0].vendor||'')+'</small>':'')+'</div>';
      return '<div class="row"><label>대상 LOT</label><select id="inNo">'+
        cand.map(o=>{const rem=remainOf(o);
          return '<option value="'+o.no+'">'+esc(D.part)+' · '+label(o.mp||'')+
            ' ('+esc(o.sdate||'')+' 출고 '+num(o.qty).toLocaleString()+
            (rem<num(o.qty)?' · 잔량 '+rem.toLocaleString():'')+')'+
            (arrivedOf(o)?' — 입고완료':'')+'</option>';}).join('')+'</select></div>'+
      '<div class="row"><label>보내온 곳</label><input id="inFrom" readonly style="background:#f5f7f9"></div>'+
      '<div class="row"><label>입고일</label><input type="date" id="inDate" value="'+TODAY+'"></div>'+
      '<div class="row"><label>입고수량</label><input type="number" id="inQty" inputmode="numeric"></div>'+
      '<div id="inShort" class="short" style="margin:-4px 0 8px 96px"></div>'+
      '<div class="row" id="inRsnRow" style="display:none"><label>부족사유</label><input id="inRsn" placeholder="불량 · 파손 등 (선택)"></div>'+
      '<div class="row"><label>특기사항</label><textarea id="inRmk"></textarea></div>'+
      (isHome()?'<div class="row"><label>처리</label><label style="font-weight:400;font-size:13px">'+
        '<input type="checkbox" id="inClose" checked style="width:auto;margin-right:6px">사내 복귀 입고 (반출건 마감)</label></div>':'')+
      '<button class="bt in" id="btIn">📥 입고 등록</button>';
    })()+
    '</div></div>'+

    /* 출고 — 다음 공정으로 */
    '<div class="pane'+(defTab==='out'?' on':'')+'" data-p="out"><div class="bd">'+
    (function(){
      const src = isHome()? open : (toOut.length?toOut:mine);
      return '<div class="row"><label>출고 LOT</label><select id="outFrom">'+
        src.map(o=>'<option value="'+o.no+'">'+esc(D.part)+' · '+label(o.mp||'')+
          ' 보유분 (잔량 '+remainOf(o).toLocaleString()+')</option>').join('')+
        '<option value="">'+esc(D.part)+' · 신규 출고 (대상 없음)</option></select></div>'+
      '<div class="row"><label>다음 공정</label><select id="outMp">'+
        (STEPS.length
          ? STEPS.map(x=>'<option value="'+esc(x)+'"'+(x===rest[0]?' selected':'')+'>'+esc(x)+
              (pName(x)?' · '+esc(pName(x)):'')+(MVSEEN.has(x)?' ✓완료':'')+'</option>').join('')
          : (D.procs||[]).map(p=>'<option value="'+esc(p.c)+'">'+esc(p.c)+' · '+esc(p.n)+'</option>').join(''))+
      '</select></div>'+
      '<div class="row"><label>받는 업체</label><select id="outVen"><option value="">선택</option>'+
        VEN.map(v=>'<option'+(v===MYVEN?' disabled':'')+'>'+esc(v)+'</option>').join('')+'</select></div>'+
      '<div class="row"><label>출고일</label><input type="date" id="outDate" value="'+TODAY+'"></div>'+
      '<div class="row"><label>출고수량</label><input type="number" id="outQty" inputmode="numeric"></div>'+
      '<div id="outInfo" style="margin:-4px 0 8px 96px;font-size:12px"></div>'+
      '<div class="row"><label>특기사항</label><textarea id="outRmk" placeholder="부분출고 사유 · 불량 등 (선택)"></textarea></div>'+
      '<button class="bt out" id="btOut">📤 출고 등록</button>';
    })()+
    '</div></div>'+

    /* 사내입고 (발주처 전용) */
    (isHome()&&doneAll&&!D.receipt?'<div class="pane'+(defTab==='home'?' on':'')+'" data-p="home"><div class="bd">'+
      '<div class="row"><label>입고일</label><input type="date" id="hDate" value="'+TODAY+'"></div>'+
      '<div class="row"><label>입고수량</label><input type="number" id="hQty" inputmode="numeric" value="'+
        ((osp[0]||{}).qty!=null?num(osp[0].qty):'')+'"></div>'+
      '<div id="hShort" class="short" style="margin:-4px 0 8px 96px"></div>'+
      '<div class="row" id="hRsnRow" style="display:none"><label>부족사유</label><input id="hRsn" placeholder="선택"></div>'+
      '<div class="row"><label>특기사항</label><textarea id="hRmk"></textarea></div>'+
      '<button class="bt home" id="btHome">🏭 사내입고 (LOT 종결)</button>'+
      '<div style="font-size:11px;color:#b06a12;margin-top:6px">※ 종결 시 이 이동표 QR은 더 이상 사용할 수 없습니다.</div>'+
    '</div></div>':'')+

    /* 특기사항 */
    '<div class="pane'+(defTab==='memo'?' on':'')+'" data-p="memo"><div class="bd">'+
      '<div class="row"><label>특기사항</label><textarea id="mRmk" placeholder="불량 발생 · 지연 사유 등 자유 기록"></textarea></div>'+
      '<button class="bt memo" id="btMemo">📝 기록 저장</button>'+
    '</div></div>'+
    '<div class="msg" id="msg"></div>'+
  '</div>'+

  '<div class="card"><h3>🕘 최근 기록</h3><div class="bd">'+
    (MV.length?'<table class="hist" style="width:100%;border-collapse:collapse">'+
      MV.map(v=>'<tr><td style="width:76px">'+esc(v.move_date||'')+'</td>'+
        '<td style="width:62px"><span class="badge '+(v.io==='출고'?'b-out':(v.io==='기록'?'b-etc':'b-in'))+'">'+esc(v.io)+'</span></td>'+
        '<td>'+esc(v.mp||'')+(v.vendor?' · '+esc(v.vendor):'')+
        (num(v.short_qty)>0?' <span class="short">부족 '+num(v.short_qty).toLocaleString()+'</span>':'')+
        (v.worker?' <small style="color:#8894a0">/'+esc(v.worker)+'</small>':'')+
        (v.remark?'<br><small style="color:#526171">'+esc(v.remark)+'</small>':'')+'</td></tr>').join('')+'</table>'
    :'<span style="color:#8894a0">기록이 없습니다.</span>')+
  '</div></div>';

  /* 탭 */
  wrap.querySelectorAll('.tab button').forEach(b=>b.addEventListener('click',()=>{
    wrap.querySelectorAll('.tab button').forEach(x=>x.classList.toggle('on',x===b));
    wrap.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.dataset.p===b.dataset.t));
  }));

  const msg=(t,ok)=>{ const m=$('#msg'); m.className='msg '+(ok?'ok':'err'); m.textContent=t; };
  const busy=(b,on,txt)=>{ b.disabled=on; if(on){ b.dataset.o=b.textContent; b.textContent=txt||'처리 중...'; }
                           else b.textContent=b.dataset.o||b.textContent; };

  /* 보내온 곳 = 직전 보유처 추적 */
  function fromOf(o){
    const idx=osp.findIndex(x=>String(x.no)===String(o.no));
    const p=idx>0?osp[idx-1]:null;
    return p? (p.vendor||'')+(p.mp?' ('+p.mp+')':'') : '사내';
  }

  /* 입고 */
  if($('#btIn')){
    const pool = isHome()? open : (toArr.length?toArr:mine);
    const cur=()=>pool.find(o=>String(o.no)===$('#inNo').value)||pool[0];
    const sync=()=>{ const o=cur(), base=remainOf(o), q=num($('#inQty').value);
      const sh=Math.max(base-q,0);
      $('#inShort').textContent=sh>0?'⚠ 부족 '+sh.toLocaleString()+' (사유는 선택 입력)':'';
      $('#inRsnRow').style.display=sh>0?'':'none'; };
    const syncFrom=()=>{ $('#inFrom').value=fromOf(cur()); };
    $('#inNo').addEventListener('change',()=>{ $('#inQty').value=remainOf(cur())||''; syncFrom(); sync(); });
    $('#inQty').addEventListener('input',sync);
    $('#inQty').value=remainOf(cur())||''; syncFrom(); sync();
    $('#btIn').addEventListener('click',async()=>{
      const b=$('#btIn'); const o=cur(); busy(b,true);
      try{
        const close = isHome() ? !!($('#inClose')&&$('#inClose').checked) : false;
        const r=await rpc('ki_scan_arrive',{p_no:Number(o.no),
          p_vendor: isHome()?(o.vendor||''):MYVEN,
          p_date:$('#inDate').value||TODAY, p_qty:num($('#inQty').value),
          p_reason:($('#inRsn')&&$('#inRsn').value)||'', p_remark:$('#inRmk').value,
          p_close:close, p_worker:WORKER});
        msg(r.closed?'✓ 사내 복귀 입고 — 반출건이 마감되었습니다.'
                    :'✓ 입고 등록 완료 — 작업 후 [📤 출고]로 다음 공정에 보내세요.'+
                     (r.short?' (부족 '+num(r.short).toLocaleString()+')':''),1);
        setTimeout(load,700);
      }catch(e){ msg('❌ '+e.message); busy(b,false); }
    });
  }

  /* 출고 */
  if($('#btOut')){
    const pool = isHome()? open : (toOut.length?toOut:mine);
    const srcOf=()=>pool.find(o=>String(o.no)===$('#outFrom').value)||null;
    const sync=()=>{
      const src=srcOf();
      if(src){
        const rem=remainOf(src), q=num($('#outQty').value), left=Math.max(rem-q,0);
        $('#outInfo').innerHTML = q>rem
          ? '<span class="short">⚠ 잔량('+rem.toLocaleString()+')보다 많습니다</span>'
          : (left>0?'<span class="part">부분출고 — 잔량 '+left.toLocaleString()+' 보유 유지</span>'
                   :'<span style="color:#15803d;font-weight:700">전량 이관 — 이 건이 마감됩니다</span>');
      }else{
        const base=num(last.qty), sh=base?Math.max(base-num($('#outQty').value),0):0;
        $('#outInfo').innerHTML = sh>0?'<span class="short">직전 수량 대비 부족 '+sh.toLocaleString()+' (특기사항에 사유 기록 권장)</span>':'';
      }
    };
    $('#outFrom').addEventListener('change',()=>{ const s=srcOf();
      $('#outQty').value=s?(remainOf(s)||''):(num(last.qty)||''); sync(); });
    $('#outQty').addEventListener('input',sync);
    const s0=srcOf(); $('#outQty').value=s0?(remainOf(s0)||''):(num(last.qty)||''); sync();
    $('#btOut').addEventListener('click',async()=>{
      const b=$('#btOut'); const src=srcOf();
      if(!$('#outVen').value) return msg('받는 업체를 선택하세요.');
      busy(b,true);
      try{
        const r=await rpc('ki_scan_out',{p_from:src?Number(src.no):null, p_mp:$('#outMp').value,
          p_vendor:$('#outVen').value, p_date:$('#outDate').value||TODAY,
          p_qty:num($('#outQty').value), p_remark:$('#outRmk').value, p_worker:WORKER});
        msg(r.left>0?'✓ 부분출고 등록 — 잔량 '+num(r.left).toLocaleString()+' 보유. 이동표는 제품과 함께 보내세요.'
                    :'✓ 출고 등록 완료 — 이동표를 제품과 함께 다음 업체로 보내세요.',1);
        setTimeout(load,700);
      }catch(e){ msg('❌ '+e.message); busy(b,false); }
    });
  }

  /* 사내입고 */
  if($('#btHome')){
    const base=num((osp[0]||{}).qty);   /* 최초 반출수량 기준 */
    const sync=()=>{ const q=num($('#hQty').value), sh=base?Math.max(base-q,0):0;
      $('#hShort').textContent=sh>0?'⚠ 부족 '+sh.toLocaleString()+' (사유는 선택 입력)':'';
      $('#hRsnRow').style.display=sh>0?'':'none'; };
    $('#hQty').addEventListener('input',sync); sync();
    $('#btHome').addEventListener('click',async()=>{
      const b=$('#btHome');
      if(!confirm('사내입고로 LOT을 종결합니다.\n이 이동표 QR은 이후 사용할 수 없습니다. 계속할까요?'))return;
      busy(b,true);
      try{
        await rpc('ki_scan_home',{p_date:$('#hDate').value||TODAY, p_qty:num($('#hQty').value),
          p_reason:($('#hRsn')&&$('#hRsn').value)||'', p_remark:$('#hRmk').value, p_worker:WORKER});
        wrap.innerHTML='<div class="err-box" style="border-color:#8fbf9f;color:#15803d">'+
          '✅ 사내입고 완료 — LOT이 종결되었습니다.<br><small style="font-weight:400;color:#526171">이 이동표는 사용 종료되었습니다.</small></div>';
      }catch(e){ msg('❌ '+e.message); busy(b,false); }
    });
  }

  /* 특기사항 */
  $('#btMemo').addEventListener('click',async()=>{
    const b=$('#btMemo'); busy(b,true);
    try{
      await rpc('ki_scan_memo',{p_remark:$('#mRmk').value, p_worker:WORKER});
      msg('✓ 특기사항이 기록되었습니다.',1);
      setTimeout(load,700);
    }catch(e){ msg('❌ '+e.message); busy(b,false); }
  });
}

/* 업체 변경 */
document.getElementById('meBtn').addEventListener('click',()=>gate());

load();
})();
</script>
</body>
</html>
