<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#22537f" />
<title>공정이동표 입출고</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%2322537f'/%3E%3Ctext x='90' y='92' font-size='104' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%94%B3%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%2322537f'/%3E%3Ctext x='90' y='92' font-size='104' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%94%B3%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef2f6; --ink:#16202b; --sub:#6b7a89; --line:#dbe3ea;
  --blue:#2668a8; --blue-d:#1b4b7d; --green:#1f8a4c; --orange:#e07b1c; --red:#c0392b; --gray:#7b8794;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.6 'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;background:var(--bg);color:var(--ink);
     padding-bottom:104px}
.app{background:linear-gradient(135deg,#3579b8,#22537f);color:#fff;padding:13px 15px;
     display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;position:sticky;top:0;z-index:20;
     box-shadow:0 2px 10px rgba(0,0,0,.14)}
.app .me{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.16);
     border:1px solid rgba(255,255,255,.32);padding:6px 11px;border-radius:20px;cursor:pointer;white-space:nowrap}
.wrap{max-width:600px;margin:0 auto;padding:12px}

/* 상태 히어로 */
.hero{border-radius:16px;padding:16px 17px;color:#fff;margin-bottom:12px;position:relative;overflow:hidden;
      animation:pop .32s cubic-bezier(.2,.9,.3,1.2) both}
.hero.in{background:linear-gradient(135deg,#27a35c,#187a43)}
.hero.out{background:linear-gradient(135deg,#3579b8,#1f5286)}
.hero.wait{background:linear-gradient(135deg,#8c98a4,#6b7a89)}
.hero.home{background:linear-gradient(135deg,#f0902e,#cf6c11)}
.hero .ic{font-size:30px;line-height:1}
.hero .tt{font-size:18px;font-weight:900;margin:6px 0 2px;letter-spacing:-.3px}
.hero .ds{font-size:13px;opacity:.94;line-height:1.55}
.hero .qty{position:absolute;right:16px;top:14px;text-align:right}
.hero .qty b{display:block;font-size:38px;font-weight:900;line-height:1;letter-spacing:-1.5px}
.hero .qty span{font-size:11.5px;opacity:.9}
.hero::after{content:'';position:absolute;right:-38px;bottom:-46px;width:140px;height:140px;
     background:rgba(255,255,255,.09);border-radius:50%}

/* 카드 */
/* 방금 등록 취소 카드 */
.card.undo{border:1px solid #e0c98a;background:#fdf8ee;padding:12px 14px}
.undo-t{font-size:13px;color:#8a6a20;font-weight:700;margin-bottom:8px}
.undo-b{width:100%;height:44px;border-radius:10px;border:1px solid #d9a441;background:#fff;
  color:#8a5a12;font-size:15px;font-weight:800}
.undo-b:disabled{opacity:.6}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(20,40,60,.09);margin-bottom:12px;overflow:hidden;
      animation:rise .3s ease both}
.card h3{font-size:12.5px;font-weight:800;color:var(--sub);padding:12px 15px 0;letter-spacing:.3px}
.card .bd{padding:13px 15px 15px}

/* LOT 헤더 */
.lot{display:flex;align-items:flex-end;gap:10px;padding:13px 15px 0}
.lot .no{font-size:26px;font-weight:900;color:var(--blue-d);letter-spacing:-.8px;line-height:1.1}
.lot .pt{font-size:13px;color:var(--sub);font-weight:700;padding-bottom:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px;padding:10px 15px 14px}
.chip{background:#f1f5f9;border-radius:8px;padding:5px 10px;font-size:12px;color:#41556a;font-weight:700}
.chip b{color:var(--ink);font-weight:800}

/* 공정 진행 */
.steps{display:flex;gap:0;padding:4px 15px 16px;overflow-x:auto}
.stp{flex:1;min-width:74px;text-align:center;position:relative}
.stp:not(:last-child)::after{content:'';position:absolute;top:17px;left:calc(50% + 19px);right:calc(-50% + 19px);
     height:3px;background:var(--line);border-radius:2px}
.stp.done:not(:last-child)::after{background:#8dd6ab}
.stp i{display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;
     font-style:normal;font-size:13px;font-weight:900;background:#fff;border:2.5px solid var(--line);color:var(--gray);
     position:relative;z-index:1}
.stp.done i{background:var(--green);border-color:var(--green);color:#fff}
.stp.now i{background:var(--orange);border-color:var(--orange);color:#fff;
     box-shadow:0 0 0 0 rgba(224,123,28,.55);animation:beat 1.5s infinite}
.stp.next i{border-color:var(--blue);color:var(--blue)}
.stp em{display:block;font-style:normal;font-size:11px;font-weight:800;margin-top:5px;color:var(--sub)}
.stp.done em{color:var(--green)}.stp.now em{color:var(--orange)}.stp.next em{color:var(--blue)}
.stp small{display:block;font-size:10px;color:#9aa7b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 이동 구분 : 외주 = 파랑 · 사내 = 주황 */
.stp.k-in i{border-style:dashed}
.stp .kk{display:block;font-size:9.5px;font-weight:900;margin-top:2px;letter-spacing:.3px}
.stp.k-in  .kk{color:#c96f1a}
.stp.k-out .kk{color:#2668a8}
.kb{display:inline-block;padding:1px 6px;border-radius:6px;font-size:10.5px;font-weight:900;
    border:1px solid #bcd0e4;background:#eef5fc;color:#1d568c}
.kb.in{border-color:#f0cfa6;background:#fdf1e3;color:#a75f11}
.kbig{display:flex;align-items:center;gap:8px;border-radius:11px;padding:10px 12px;margin-bottom:12px;
    font-size:13px;font-weight:800;border:1.5px solid #bcd0e4;background:#eef5fc;color:#1d568c}
.kbig.in{border-color:#f0cfa6;background:#fdf1e3;color:#a75f11}
.kbig .ic{font-size:17px}
.hist .tag.t-in2{background:#fdf1e3;color:#a75f11}

/* 탭 */
.tab{display:flex;gap:6px;padding:0 12px 2px;overflow-x:auto}
.tab button{flex:1;min-width:78px;height:42px;border:0;border-radius:11px;background:#e4eaf0;color:#5b6b7b;
     font:inherit;font-weight:800;font-size:13.5px;cursor:pointer;transition:.18s}
.tab button.on{background:var(--blue);color:#fff;box-shadow:0 3px 9px rgba(38,104,168,.32)}
.pane{display:none;animation:rise .26s ease both}.pane.on{display:block}

/* 폼 */
.fld{margin-bottom:13px}
.fld>label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:5px}
select,input,textarea{width:100%;border:1.5px solid #cfd9e2;border-radius:11px;padding:12px 13px;
     font:inherit;font-size:15.5px;background:#fff;color:var(--ink)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236b7a89' stroke-width='2' fill='none'/></svg>");
     background-repeat:no-repeat;background-position:right 14px center}
textarea{min-height:60px;font-size:14.5px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(38,104,168,.13)}
.ro{background:#f2f5f8;color:#5b6b7b;font-weight:700}

/* 수량 스테퍼 */
.qbox{display:flex;align-items:center;gap:9px}
.qbox button{width:52px;height:56px;border:1.5px solid #cfd9e2;border-radius:12px;background:#fff;
     font-size:24px;font-weight:800;color:var(--blue);cursor:pointer}
.qbox button:active{background:#eef4fa}
.qbox input{flex:1;height:56px;text-align:center;font-size:28px;font-weight:900;letter-spacing:-.5px;padding:0}
.qtip{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.qtip button{border:1.5px solid #cfd9e2;background:#fff;border-radius:20px;padding:6px 13px;
     font:inherit;font-size:12.5px;font-weight:800;color:#41556a;cursor:pointer}
.qtip button.hot{border-color:var(--blue);color:var(--blue);background:#eef4fa}
.warn{margin-top:9px;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:800;display:none}
.warn.on{display:block;animation:rise .2s ease both}
.warn.r{background:#fdeceb;color:var(--red)}
.warn.b{background:#eaf2fa;color:var(--blue-d)}
.warn.g{background:#e8f6ee;color:var(--green)}

/* 액션바 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
     background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.bar .go{max-width:600px;margin:0 auto;width:100%;height:56px;border:0;border-radius:14px;color:#fff;
     font:inherit;font-size:17px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
     box-shadow:0 5px 16px rgba(20,40,60,.2)}
.go.in{background:linear-gradient(135deg,#27a35c,#187a43)}
.go.out{background:linear-gradient(135deg,#3579b8,#1f5286)}
.go.home{background:linear-gradient(135deg,#f0902e,#cf6c11)}
.go.memo{background:linear-gradient(135deg,#75828f,#5b6b7b)}
.go[disabled]{opacity:.5}

/* 이력 */
.hist{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0f3f6}
.hist:last-child{border-bottom:0}
.hist .dt{font-size:11.5px;color:#9aa7b3;width:46px;flex:none;font-weight:700;padding-top:2px}
.hist .bd2{flex:1;font-size:13px}
.hist .bd2 b{font-weight:800}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;margin-right:5px}
.t-in{background:#e8f6ee;color:var(--green)}.t-out{background:#eaf2fa;color:var(--blue)}
.t-etc{background:#f1f3f5;color:var(--gray)}
.mini{font-size:11.5px;color:var(--sub);display:block;margin-top:2px}
.neg{color:var(--red);font-weight:800}

/* 게이트 */
.gate h2{font-size:19px;font-weight:900;margin-bottom:5px;letter-spacing:-.4px}
.gate p{font-size:13px;color:var(--sub);margin-bottom:14px;line-height:1.65}
.vl{display:flex;flex-direction:column;gap:9px;margin-bottom:15px}
.vl button{height:58px;border:2px solid #dbe3ea;border-radius:13px;background:#fff;font:inherit;font-size:16.5px;
     font-weight:800;color:var(--ink);cursor:pointer;text-align:left;padding:0 16px;transition:.15s}
.vl button.on{border-color:var(--blue);background:#eef4fa;color:var(--blue-d);
     box-shadow:0 3px 10px rgba(38,104,168,.16)}

.toast{position:fixed;left:12px;right:12px;bottom:78px;z-index:40;border-radius:13px;padding:13px 15px;
     color:#fff;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.24);display:none;line-height:1.5}
.toast.on{display:block;animation:slide .3s cubic-bezier(.2,.9,.3,1.2) both}
.toast.ok{background:linear-gradient(135deg,#27a35c,#187a43)}
.toast.err{background:linear-gradient(135deg,#d64a3c,#a93226)}
.empty{text-align:center;color:#9aa7b3;font-size:13.5px;padding:22px 10px;font-weight:700}
.errbox{max-width:480px;margin:44px auto;background:#fff;border-radius:16px;padding:26px 22px;text-align:center;
     color:var(--red);font-weight:800;box-shadow:0 2px 10px rgba(20,40,60,.1)}
.done-box{max-width:480px;margin:44px auto;background:#fff;border-radius:16px;padding:30px 22px;text-align:center;
     box-shadow:0 2px 10px rgba(20,40,60,.1);animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
.done-box .ic{font-size:52px}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(224,123,28,.5)}70%{box-shadow:0 0 0 11px rgba(224,123,28,0)}100%{box-shadow:0 0 0 0 rgba(224,123,28,0)}}
</style>
<script src="ki_config.js"></script>
</head>
<body>
<div class="app">📋 공정이동표 <span class="me" id="meBtn" style="display:none"></span></div>
<div class="wrap" id="wrap"><div class="empty">불러오는 중...</div></div>
<div class="bar" id="bar" style="display:none"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
const C=KI_CFG;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>Number(v)||0;
const fmt=v=>num(v).toLocaleString();
const TODAY=new Date().toISOString().slice(0,10);
const QS=new URLSearchParams(location.search);
const TOKEN=QS.get('t')||'';
/* 목록에서 '반송'으로 바로 들어온 경우 해당 탭을 연다 */
const WANTTAB=(QS.get('tab')||'').trim();
const wrap=$('#wrap'), bar=$('#bar');
const HOME='사내 (발주처)';
const BACKTO='경일FB (본사)';   /* 모든 외주 반출의 복귀처 — 협력사 간 직접이동 금지 */
let D=null, WORKER='', MYVEN='', TAB=(['in','out','memo','home'].indexOf(WANTTAB)>=0?WANTTAB:'');
try{ WORKER=localStorage.getItem('ki_qr_worker')||''; MYVEN=localStorage.getItem('ki_qr_vendor')||''; }catch(e){}
const isHome=()=>MYVEN===HOME;

async function rpc(fn,args){
  const r=await fetch(C.SUPABASE_URL+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'Content-Type':'application/json',apikey:C.SUPABASE_KEY,
             Authorization:'Bearer '+C.SUPABASE_KEY},
    body:JSON.stringify(Object.assign({p_token:TOKEN},args||{}))});
  const t=await r.text();
  let j=null; try{ j=JSON.parse(t); }catch(e){}
  if(!r.ok) throw new Error((j&&(j.message||j.hint))||t.slice(0,150)||('오류 '+r.status));
  return j;
}
let toastT=null;
function toast(msg,ok){
  const el=$('#toast'); el.className='toast on '+(ok?'ok':'err'); el.textContent=msg;
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(()=>el.className='toast',3600);
  if(ok&&navigator.vibrate) try{ navigator.vibrate(50); }catch(e){}
}
if(!TOKEN){ wrap.innerHTML='<div class="errbox">공정이동표의 QR을 스캔해 주세요.<br><br>'+
  '<span style="font-weight:400;color:#6b7a89;font-size:13px">유효한 이동표 링크가 아닙니다.</span></div>'; return; }

/* 취소(void)된 기록은 없었던 것으로 본다 — 기록 자체는 남기되 계산에서만 뺀다 */
const LIVE = () => (D.moves||[]).filter(m=>!m.void);
const movedOf = no => LIVE().filter(m=>m.io==='출고'&&String(m.osp_no||'')===String(no))
                       .reduce((a,b)=>a+num(b.out_qty),0);
const arrQtyOf = no => { const a=LIVE().filter(m=>(m.io==='도착'||m.io==='입고')&&
                           String(m.osp_no||'')===String(no)&&m.in_qty!=null)[0];
                         return a?num(a.in_qty):null; };
const remainOf = o => { const a=arrQtyOf(o.no);
                        return Math.max((a==null?num(o.qty):a)-movedOf(o.no),0); };
const arrivedOf = o => LIVE().find(m=>(m.io==='도착'||m.io==='입고')&&String(m.osp_no||'')===String(o.no))||null;
/* ── 본사 반송 수량 계산 ───────────────────────────────────────
   분할 회수(600 → 400)를 하면 본사 복귀입고가 쌓이는데,
   remainOf 는 "가장 최근 도착·입고 수량"을 쓰므로 본사 입고가 잡히는 순간
   협력사 보유수량이 같이 줄어 버린다. 협력사 보유분은 '도착수량' 기준으로 따로 센다. */
const backOf = no => LIVE().filter(m=>m.io==='반송'&&String(m.osp_no||'')===String(no))
                      .reduce((a,b)=>a+num(b.out_qty),0);          /* 반송 등록 누계 */
const rcvOf  = no => LIVE().filter(m=>m.io==='입고'&&String(m.osp_no||'')===String(no))
                      .reduce((a,b)=>a+num(b.in_qty),0);           /* 본사 복귀입고 누계 */
const arrOf  = o => { const a=LIVE().filter(m=>m.io==='도착'&&
                        String(m.osp_no||'')===String(o.no)&&m.in_qty!=null)[0];
                      return a?num(a.in_qty):num(o.qty); };        /* 협력사가 받은 수량 */
/* 협력사가 지금 들고 있는 수량 (반송 가능분) */
const pendingOf  = o => Math.max(arrOf(o)-backOf(o.no)-movedOf(o.no),0);
/* 반송 등록은 됐는데 본사가 아직 못 받은 수량 (운송 중) */
const transitOf  = o => Math.max(backOf(o.no)-rcvOf(o.no),0);
/* 본사가 회수해 보유 중인 수량 — 복귀입고 누계 − 다음 공정 반출 누계.
   분할 회수(600+400) 뒤에는 '최근 입고 1건'만 보는 remainOf 로는 400 밖에 안 보인다. */
const stockOf    = o => Math.max(rcvOf(o.no)-movedOf(o.no),0);
/* 그 공정에서 실제로 가공되어 돌아온 수량 (미처리 반납분 제외) */
const doneQtyOf = mp => LIVE().filter(m=>m.mp===mp&&m.io==='입고')
      .reduce((a,b)=>a+Math.max(num(b.in_qty)-num(b.undone_qty),0),0);
/* 아직 회수되지 않은 수량 — 협력사 보유 + 운송 중 (마감 안 된 반출건만) */
const openQtyOf = mp => (D.osp||[]).filter(o=>o.mp===mp&&o.sdate&&!o.idate)
      .reduce((a,o)=>a+pendingOf(o)+transitOf(o),0);
/* 미처리 반납 잔량 — 그 공정을 다시 거쳐야 하는 수량 */
const undoneOf = mp => {
  const back=LIVE().filter(m=>m.io==='입고'&&m.mp===mp)
    .reduce((a,b)=>a+num(b.undone_qty),0);
  const re=(D.osp||[]).filter(o=>o.mp===mp&&o.rework&&o.rework_kind==='미처리')
    .reduce((a,b)=>a+num(b.qty),0);
  return Math.max(back-re,0);
};
/* 방금 등록한 기록인가 — 마지막 이동기록만 취소할 수 있다 */
const lastMoveId = () => { const v=Number(D&&D.last_move)||0; if(v) return v;
  const m=LIVE()[0]; return m?Number(m.move_id)||0:0; };
const undoable = () => { const m=LIVE()[0];
  return (m && !D.receipt && (m.io==='도착'||m.io==='입고'||m.io==='반송')
          && Number(m.move_id)===lastMoveId()) ? m : null; };
const pName = c => { const p=(D.procs||[]).find(x=>x.c===c); return p?p.n:''; };
/* 이동 구분 : 표준공정경로 inhouse 우선 → 실제 이동건 → 외주 */
const kindOfMp = mp => {
  if(!mp) return '외주';
  const rt=D&&D.route;
  if(rt&&Array.isArray(rt.steps)&&rt.steps.indexOf(mp)>=0)
    return (Array.isArray(rt.inhouse)&&rt.inhouse.indexOf(mp)>=0)?'사내':'외주';
  const o=(D&&D.osp?D.osp:[]).filter(x=>x.mp===mp).sort((a,b)=>(Number(b.no)||0)-(Number(a.no)||0))[0];
  return (o&&o.move_kind==='사내')?'사내':'외주';
};
const kindOfRow = o => (o&&o.move_kind==='사내')?'사내':'외주';
const kb = k => '<span class="kb'+(k==='사내'?' in':'')+'">'+(k==='사내'?'🏭 사내':'🚚 외주')+'</span>';

/* ── 이 이동표를 지금 들고 있는 곳 (자동 판정용) ──
   미입고 반출건의 업체가 곧 현재 보유처다. 한 곳뿐이면 고를 필요가 없다. */
function holders(){
  const open=((D&&D.osp)||[]).filter(o=>o.sdate&&!o.idate);
  const seen=[]; open.forEach(o=>{ const v=o.vendor||''; if(v&&seen.indexOf(v)<0) seen.push(v); });
  return seen;
}

/* ── 업체 선택 ──
   opts.only : 후보만 보여준다 (분할로 두 곳이 나눠 가진 경우)
   opts.workerOnly : 업체는 이미 자동 판정됐고 담당자 성함만 받는다 */
function gate(opts){
  opts=opts||{};
  const cand=opts.only||null;
  const list=cand||((D&&D.vendors?D.vendors:[]).slice());
  /* 사내 작업장(부서)도 선택 대상 — 사내 이동 구간을 현장에서 직접 찍을 수 있게 한다 */
  const sites=cand?[]:((D&&D.sites?D.sites:[]).filter(v=>v&&list.indexOf(v)<0));
  /* 반송분이 본사로 오는 중이면 찍는 사람이 본사일 수 있다 — 후보에 넣는다 */
  const showHome=opts.home || (!cand && (/[?&]home=1\b/.test(location.search) || MYVEN===HOME));
  $('#meBtn').style.display='none'; bar.style.display='none';
  wrap.innerHTML='<div class="card"><div class="bd gate">'+
    (opts.workerOnly
      ? '<h2>👤 담당자 성함</h2>'+
        '<p>이 이동표는 <b>'+esc(MYVEN)+'</b> 보유분입니다.<br>'+
        '기록에 남길 성함만 한 번 입력하면 끝입니다.</p>'
      : cand
      ? '<h2>🏭 어느 쪽에서 찍으셨나요?</h2>'+
        (opts.home
          ? '<p>이 이동표는 <b>경일FB로 반송 중</b>입니다.<br>'+
            '본사에서 받으셨다면 <b>경일FB(본사)</b>를, 협력사에서 찍으셨다면 업체를 골라 주세요.</p>'
          : '<p>이 LOT은 물량이 나뉘어 <b>'+cand.length+'곳</b>에 있습니다.<br>지금 계신 곳을 골라 주세요.</p>')
      : '<h2>🏭 우리 작업장 · 업체는?</h2>'+
        '<p>보통은 고를 필요가 없습니다 — <b>QR을 찍으면 자동으로 인식</b>됩니다.<br>'+
        '업체를 바꿀 때만 여기서 지정하세요.</p>')+
    (opts.workerOnly ? '' :
    '<div class="vl" id="vl">'+
      list.map(v=>'<button data-v="'+esc(v)+'"'+(v===MYVEN?' class="on"':'')+'>🚚 '+esc(v)+'</button>').join('')+
      sites.map(v=>'<button data-v="'+esc(v)+'"'+(v===MYVEN?' class="on"':'')+'>🏭 '+esc(v)+' <small>(사내)</small></button>').join('')+
      (showHome?'<button data-v="'+esc(HOME)+'"'+(MYVEN===HOME?' class="on"':'')+'>🏠 '+esc(HOME)+
        (opts.home?' <small>(반송분 수령)</small>':'')+'</button>':'')+
    '</div>'+
    (cand?'<div class="note" style="margin-top:8px"><a href="#" id="gAll" '+
      'style="color:#1d568c;font-weight:700">여기에 없습니다 — 전체 목록에서 고르기</a></div>':''))+
    '<div class="fld"><label>담당자 성함</label><input id="gWk" value="'+esc(WORKER)+'" placeholder="기록에 남습니다"></div>'+
  '</div></div>';
  let pick=opts.workerOnly?MYVEN:(cand&&cand.length===1?cand[0]:MYVEN);
  wrap.querySelectorAll('#vl button').forEach(b=>b.addEventListener('click',()=>{
    pick=b.dataset.v; wrap.querySelectorAll('#vl button').forEach(x=>x.classList.toggle('on',x===b));
  }));
  const all=$('#gAll');
  if(all) all.addEventListener('click',ev=>{ ev.preventDefault(); gate({}); });
  bar.style.display=''; bar.innerHTML='<button class="go in" id="gGo">✅ 저장하고 시작</button>';
  $('#gGo').addEventListener('click',()=>{
    const wk=$('#gWk').value.trim();
    if(!pick) return toast('작업장 · 업체를 선택하세요.');
    if(!wk) return toast('담당자 성함을 입력하세요.');
    MYVEN=pick; WORKER=wk;
    try{ localStorage.setItem('ki_qr_vendor',MYVEN); localStorage.setItem('ki_qr_worker',WORKER); }catch(e){}
    TAB=''; draw();
  });
}

/* 분할 반송을 하면 종이 이동표는 물건과 함께 본사로 간다.
   협력사에 남은 잔량을 나중에 등록하려면 같은 토큰을 다시 열 수 있어야 하므로
   이 폰의 '최근 스캔한 LOT'(lot_vendor.html 과 같은 저장소)에 기록해 둔다. */
function saveRec(part){
  try{
    let rec=JSON.parse(localStorage.getItem('ki_qr_recent')||'[]');
    rec=[{t:TOKEN,p:part,d:new Date().toISOString().slice(5,16).replace('T',' ')}]
        .concat(rec.filter(x=>x&&x.t!==TOKEN)).slice(0,8);
    localStorage.setItem('ki_qr_recent',JSON.stringify(rec));
  }catch(e){}
}

async function load(){
  try{ D=await rpc('ki_scan_info'); }
  catch(e){ bar.style.display='none';
    wrap.innerHTML='<div class="errbox">'+esc(e.message)+'<br><br>'+
    '<span style="font-weight:400;color:#6b7a89;font-size:13px">폐기되었거나 만료된 이동표입니다.<br>발주처 담당자에게 재발행을 요청하세요.</span></div>'; return; }
  saveRec(D.part);
  if(MYVEN){ draw(); return; }
  /* ── 업체 자동 판정 ──
     이동표가 보유처를 알려주므로 협력사는 목록에서 고를 필요가 없다.
       보유처 1곳 → 그 업체로 확정 (담당자 성함만 1회)
       보유처 2곳 이상(분할) → 그 후보만 보여주고 선택
       보유처 없음(사내 보유 · 미반출) → 전체 목록 */
  const hs=holders();
  /* 반송 등록됐는데 본사 복귀입고가 아직인 건이 있으면, 찍는 사람이 본사일 수 있다.
     이때는 자동 판정하지 않고 [협력사 / 경일FB] 를 고르게 한다. */
  const tr=((D&&D.osp)||[]).filter(o=>o.sdate&&!o.idate).some(o=>transitOf(o)>0);
  if(hs.length===1 && !tr){
    MYVEN=hs[0];
    try{ localStorage.setItem('ki_qr_vendor',MYVEN); }catch(e){}
    if(WORKER){ toast('🏢 '+MYVEN+' 으로 확인했습니다.',1); draw(); }
    else gate({workerOnly:true});
    return;
  }
  if(hs.length>=1){ gate({only:hs, home:tr}); return; }
  gate({});
}

function draw(){
  const osp=(D.osp||[]), lot=D.lot||{}, rt=D.route||null;
  const open=osp.filter(o=>o.sdate&&!o.idate);
  const STEPS=rt&&Array.isArray(rt.steps)?rt.steps:[];
  /* 완료로 볼 공정 : ① 그 공정에서 실제로 가공된 수량이 있고
                      ② 아직 회수 안 된 물량(협력사 보유 · 운송 중)이 없어야 한다.
     분할 회수 중(600 회수 · 400 잔여)에는 완료로 잡지 않고 진행중으로 둔다.
     미처리 반납(가공 안 하고 그대로 복귀)은 복귀했을 뿐 공정을 거치지 않았다. */
  const SEEN=new Set(LIVE().filter(m=>m.mp&&m.io==='입고'&&
    (num(m.in_qty)-num(m.undone_qty))>0).map(m=>m.mp)
    .filter(mp=>openQtyOf(mp)<=0));
  const ARR =new Set(LIVE().filter(m=>m.mp&&(m.io==='도착'||m.io==='입고')).map(m=>m.mp));
  (Array.isArray(lot.steps)?lot.steps:[]).forEach(s=>{
    if(s.mp && openQtyOf(s.mp)<=0) SEEN.add(s.mp); });
  const rest=STEPS.filter(x=>(!SEEN.has(x)||undoneOf(x)>0)&&!open.some(o=>o.mp===x));
  const doneAll=STEPS.length&&!rest.length&&!open.length;
  const last=osp[osp.length-1]||{}, first=osp[0]||{};
  const VEN=D.vendors||[], MV=(D.moves||[]).slice(0,8);

  const mine   = open.filter(o=>o.vendor===MYVEN);
  const toArr  = mine.filter(o=>!arrivedOf(o));
  const toOut  = mine.filter(o=>arrivedOf(o)&&remainOf(o)>0);
  const others = open.filter(o=>o.vendor!==MYVEN);
  const toBack = isHome()? [] : toOut.filter(o=>pendingOf(o)>0);   /* 아직 본사로 안 보낸 보유분 */
  const myMp   = (mine[0]||{}).mp||'';
  const vendorAt = o => (o&&o.vendor)||'';

  $('#meBtn').style.display='';
  $('#meBtn').innerHTML='🏢 '+esc(MYVEN)+' ▾';

  /* 히어로 */
  let hero;
  if(isHome()){
    hero = doneAll
      ? {c:'home',ic:'🏭',t:'사내입고 대기',d:'모든 공정이 끝났습니다. 최종 입고수량을 등록해 LOT을 종결하세요.',q:num(first.qty),u:'반출수량'}
      : {c:'wait',ic:'🏠',t:'발주처 모드',d:'진행 상황을 확인하고 필요 시 기록할 수 있습니다.',q:null};
  }else if(toArr.length){
    hero = {c:'in',ic:'📥',t:'입고할 물량이 있습니다',
            d:'우리 업체로 오고 있습니다. 도착하면 수량을 확인해 등록하세요.',q:remainOf(toArr[0]),u:'입고예정'};
  }else if(toBack.length){
    hero = {c:'out',ic:'🚚',t:'본사로 반송할 물량이 있습니다',
            d:'가공이 끝나면 <b>경일FB 본사</b>로 반송 등록하세요. 다음 공정은 본사에서 지정합니다.',
            q:pendingOf(toBack[0]),u:'보유수량'};
  }else if(!isHome()&&toOut.length){
    hero = {c:'wait',ic:'📦',t:'반송 등록 완료',
            d:'본사 입고 확인을 기다리는 중입니다. 이동표를 제품과 함께 보내 주세요.',
            q:backOf(toOut[0].no),u:'반송수량'};
  }else if(isHome()&&toOut.length){
    hero = {c:'out',ic:'📤',t:'출고할 물량이 있습니다',
            d:'다음 공정(사내 작업장 또는 협력사)으로 출고 등록하세요.',q:remainOf(toOut[0]),u:'보유수량'};
  }else if(others.length){
    hero = {c:'wait',ic:'⏳',t:'우리 차례가 아닙니다',
            d:'이 LOT은 현재 '+esc(vendorAt(others[0]))+'에 있습니다.',q:null};
  }else{
    hero = {c:'wait',ic:'✅',t:'처리할 건이 없습니다',d:'이 LOT에 대한 우리 업체 작업이 없습니다.',q:null};
  }
  if(D.receipt) hero={c:'home',ic:'🏁',t:'LOT 종결',d:'사내입고가 완료된 LOT입니다.',q:num(D.receipt.qty),u:'입고수량'};

  if(!TAB) TAB = isHome()?(doneAll?'home':'memo'):(toArr.length?'in':(toOut.length?'out':'memo'));
  const tabs=[['in','📥 입고'],['out',isHome()?'📤 출고':'🚚 본사반송']]
    .concat(isHome()&&doneAll&&!D.receipt?[['home','🏭 사내입고']]:[])
    .concat([['memo','📝 특기']]);
  if(!tabs.some(t=>t[0]===TAB)) TAB='memo';

  wrap.innerHTML=
  '<div class="hero '+hero.c+'">'+
    (hero.q!=null?'<div class="qty"><b>'+fmt(hero.q)+'</b><span>'+esc(hero.u||'')+'</span></div>':'')+
    '<div class="ic">'+hero.ic+'</div><div class="tt">'+hero.t+'</div><div class="ds">'+hero.d+'</div>'+
  '</div>'+

  '<div class="card">'+
    '<div class="lot"><span class="no">'+esc(D.part)+'</span>'+
      '<span class="pt">'+esc(last.map_part||'품번 미지정')+'</span></div>'+
    '<div class="meta">'+
      '<span class="chip">JOB <b>'+esc(lot.job||last.job||'-')+'</b></span>'+
      (last.mold_no?'<span class="chip">금형 <b>'+esc(last.mold_no)+'</b></span>':'')+
      '<span class="chip">총수량 <b>'+(first.qty!=null?fmt(first.qty):'-')+'</b></span>'+
      '<span class="chip">'+(rt?esc(rt.standard_process_name):'표준공정 미매칭')+'</span>'+
    '</div>'+
    (STEPS.length?'<div class="steps">'+STEPS.map((x,i)=>{
      const o=open.find(y=>y.mp===x)||osp.slice().reverse().find(y=>y.mp===x)||{};
      const uq=undoneOf(x);
      const d=SEEN.has(x)&&!uq, now=(!isHome()&&x===myMp)||(isHome()&&open.some(y=>y.mp===x));
      const nx=(!d&&!now&&x===rest[0]);
      const k=kindOfMp(x);
      const dq=doneQtyOf(x), pq=openQtyOf(x);
      const half=(!d&&!uq&&dq>0&&pq>0);            /* 부분회수 — 일부만 돌아옴 */
      return '<div class="stp '+(now?'now':d?'done':nx?'next':'')+' '+(k==='사내'?'k-in':'k-out')+'"'+
        (uq?' title="미처리 반납 '+fmt(uq)+'개 — 이 공정을 다시 거쳐야 합니다"'
           :half?' title="부분회수 — 회수 '+fmt(dq)+'개 · 미회수 '+fmt(pq)+'개"':'')+'>'+
        '<i>'+(uq?'↩':d?'✓':half?'◐':(i+1))+'</i><em>'+esc(x)+'</em>'+
        '<span class="kk">'+(k==='사내'?'사내':'외주')+'</span>'+
        '<small>'+esc(uq?'미처리 '+fmt(uq)
                    :half?'미회수 '+fmt(pq)
                    :(o.vendor||pName(x)||''))+'</small></div>';
    }).join('')+'</div>':'')+
  '</div>'+

  '<div class="tab">'+tabs.map(t=>'<button data-t="'+t[0]+'"'+(TAB===t[0]?' class="on"':'')+'>'+t[1]+'</button>').join('')+'</div>'+

  '<div class="card"><div class="bd">'+
    /* 입고 */
    '<div class="pane'+(TAB==='in'?' on':'')+'" data-p="in">'+
    (function(){
      const cand = isHome()? open : (toArr.length?toArr:mine);
      if(!cand.length) return '<div class="empty">우리 쪽으로 입고될 건이 없습니다.'+
        (others.length?'<br>현재 보유 : '+esc(vendorAt(others[0])):'')+'</div>';
      return '<div class="fld"><label>대상 LOT · 공정</label><select id="inNo">'+
        cand.map(o=>{const rem=remainOf(o);
          return '<option value="'+o.no+'">'+esc(D.part)+' · '+esc(o.mp||'')+
            (pName(o.mp)?' '+esc(pName(o.mp)):'')+' — '+fmt(rem)+'개'+
            (arrivedOf(o)?' (입고완료)':'')+'</option>';}).join('')+'</select></div>'+
      '<div class="fld"><label>보내온 곳</label><input id="inFrom" class="ro" readonly></div>'+
      '<div class="fld"><label>입고수량</label>'+
        '<div class="qbox"><button data-q="-1">−</button>'+
        '<input type="number" id="inQty" inputmode="numeric"><button data-q="1">+</button></div>'+
        '<div class="qtip" id="inTip"></div>'+
        '<div class="warn r" id="inShort"></div></div>'+
      '<div class="fld" id="inRsnRow" style="display:none"><label>부족 사유</label>'+
        '<input id="inRsn" placeholder="불량 · 파손 등 (선택)"></div>'+
      '<div class="fld"><label>입고일</label><input type="date" id="inDate" value="'+TODAY+'"></div>'+
      '<div class="fld"><label>특기사항</label><textarea id="inRmk" placeholder="선택 입력"></textarea></div>'+
      (isHome()?'<div class="fld"><label style="display:flex;align-items:center;gap:8px;font-size:14px;color:#16202b">'+
        '<input type="checkbox" id="inClose" checked style="width:22px;height:22px">'+
        '<b>전량</b> 사내 복귀 입고 (반출건 마감)</label>'+
        '<div class="warn r" id="inCloseNote" style="display:none"></div></div>'+
      /* 가공을 안 하고 그대로 돌아온 물량을 일반 입고로 잡으면
         그 공정이 완료로 표시되고 다음 공정으로 넘어가 버린다. */
      '<div class="fld" id="inKindRow"><label>처리 유형</label>'+
        '<select id="inKind">'+
          '<option value="가공완료">가공완료 — 정상</option>'+
          '<option value="미처리">미처리 반납 — 가공하지 않고 그대로 복귀</option>'+
          '<option value="부분가공">일부만 가공</option></select>'+
        '<div class="qtip" id="inKindTip"></div></div>'+
      '<div class="fld" id="inUndRow" style="display:none"><label>미처리 수량</label>'+
        '<input type="number" id="inUnd" inputmode="numeric" placeholder="가공되지 않은 수량">'+
        '<div class="warn r" id="inUndW"></div></div>':'');
    })()+'</div>'+

    /* 출고 */
    '<div class="pane'+(TAB==='out'?' on':'')+'" data-p="out">'+
    (function(){
      /* 본사는 '복귀입고 마감된 직전 건'에서 다음 공정으로 내보낸다 —
         신규 출고로 잡으면 수량 연결(잔량 검증)이 끊긴다. */
      const closedSrc = osp.filter(o=>o.idate && stockOf(o)>0 && !open.some(x=>x.no===o.no));
      const src = isHome()? open.concat(closedSrc) : (toOut.length?toOut:mine);
      /* ── 협력사 화면 ──
         외주 반출은 예외 없이 가공 후 경일FB로 반입한다.
         협력사가 다음 공정 · 다음 업체를 고르는 일은 없다 (협력사 간 직접이동 금지). */
      if(!isHome()){
        if(!src.length) return '<div class="empty">반송할 보유 물량이 없습니다.</div>';
        return '<div class="fld"><label>반송 LOT · 보유분</label><select id="outFrom">'+
          src.map(o=>{const pd=pendingOf(o), bk=backOf(o.no);
            return '<option value="'+o.no+'">'+esc(D.part)+' · '+esc(o.mp||'')+
              (pName(o.mp)?' '+esc(pName(o.mp)):'')+' — 보유 '+fmt(pd)+'개'+
              (bk?' (반송등록 '+fmt(bk)+'개)':'')+'</option>';}).join('')+
          '</select></div>'+
        '<div class="kbig in"><span class="ic">🏭</span>'+
          '<span><b>본사 반송</b> — 가공 완료분을 '+esc(BACKTO)+'로 돌려보냅니다</span></div>'+
        '<div class="fld"><label>반송수량</label>'+
          '<div class="qbox"><button data-q="-1">−</button>'+
          '<input type="number" id="outQty" inputmode="numeric"><button data-q="1">+</button></div>'+
          '<div class="qtip" id="outTip"></div>'+
          '<div class="warn" id="outInfo"></div></div>'+

  /* 수량 스테퍼 공통 */
  function stepper(paneSel,inputSel){
    wrap.querySelectorAll(paneSel+' .qbox button').forEach(b=>b.addEventListener('click',()=>{
      const el=$(inputSel); el.value=Math.max(num(el.value)+Number(b.dataset.q),0);
      el.dispatchEvent(new Event('input'));
    }));
  }
  function chips(boxSel,inputSel,base){
    const box=$(boxSel); if(!box) return;
    box.innerHTML='<button class="hot" data-v="'+base+'">전량 '+fmt(base)+'</button>'+
      [1,2,5].filter(n=>base-n>0).map(n=>'<button data-v="'+(base-n)+'">−'+n+'</button>').join('');
    box.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      const el=$(inputSel); el.value=b.dataset.v; el.dispatchEvent(new Event('input'));
    }));
  }
  function fromOf(o){
    const i=osp.findIndex(x=>String(x.no)===String(o.no));
    const p=i>0?osp[i-1]:null;
    return p?(p.vendor||'')+(p.mp?' ('+p.mp+')':''):'사내';
  }

  /* 입고 */
  let inPool=null, inCur=null;
  if($('#inQty')){
    inPool = isHome()? open : (toArr.length?toArr:mine);
    inCur=()=>inPool.find(o=>String(o.no)===$('#inNo').value)||inPool[0];
    const inBase=o=>{ const tr=transitOf(o); return (isHome()&&tr>0)?tr:remainOf(o); };
    const sync=()=>{ const o=inCur(), base=inBase(o), q=num($('#inQty').value), sh=Math.max(base-q,0);
      const w=$('#inShort');
      w.className='warn r'+(sh>0?' on':''); w.textContent=sh>0?'⚠ 부족 '+fmt(sh)+'개 — 사유는 선택 입력':'';
      $('#inRsnRow').style.display=sh>0?'':'none';
      /* [전량 사내 복귀] 마감은 협력사 보유분 0 · 운송 중 0 일 때만 — 분할 회수 중에는 잠근다 */
      const cb=$('#inClose'), note=$('#inCloseNote');
      if(cb){
        const held=pendingOf(o), rest=Math.max(transitOf(o)-q,0);
        const partial = q>0 && (held>0 || rest>0);
        if(partial){ cb.checked=false; cb.disabled=true; }
        else cb.disabled=false;
        if(note){
          note.style.display=partial?'':'none';
          note.className='warn r'+(partial?' on':'');
          note.innerHTML=partial
            ? '⚠ 분할 회수 중 — 마감할 수 없습니다. '+
              (held>0?'협력사 보유 '+fmt(held)+'개':'')+(held>0&&rest>0?' · ':'')+
              (rest>0?'운송 중 '+fmt(rest)+'개':'')+' 가 남아 있습니다.'
            : '';
        }
      } };
    const reset=()=>{ const o=inCur(), base=inBase(o);
      /* 본사 화면 : 협력사가 반송 등록한 '운송 중' 수량이 기본값 (분할 회수 대응) */
      $('#inQty').value=base||''; $('#inFrom').value=fromOf(o);
      chips('#inTip','#inQty',base); sync(); };
    $('#inNo').addEventListener('change',reset);
    $('#inQty').addEventListener('input',sync);
    stepper('[data-p="in"]','#inQty'); reset();

  /* 출고 */
  let outPool=null, outSrc=null, OUTKIND=()=>'외주', OUTDEST=()=>'';
  if($('#outQty')){
    outPool = isHome()
      ? open.concat(osp.filter(o=>o.idate && stockOf(o)>0 && !open.some(x=>x.no===o.no)))
      : (toOut.length?toOut:mine);
    outSrc=()=>outPool.find(o=>String(o.no)===$('#outFrom').value)||null;
    const BACKMODE=!isHome();                       /* 협력사 = 본사 반송 전용 */
    const baseOf=s=>BACKMODE?pendingOf(s):(s&&s.idate?stockOf(s):remainOf(s));
    const sync=()=>{
      const s=outSrc(), w=$('#outInfo');
      if(s){ const rem=baseOf(s), q=num($('#outQty').value), left=Math.max(rem-q,0);
        if(q>rem){ w.className='warn r on'; w.textContent='⚠ 보유수량('+fmt(rem)+'개)보다 많습니다'; }
        else if(left>0){ w.className='warn b on';

              '이동표(종이)는 물건과 함께 본사로 보내고, 남은 분은 이 휴대폰의 '+
              '<b>[최근 스캔한 LOT]</b>에서 이 이동표를 다시 열어 등록하세요.'
            : '부분출고 — 잔량 '+fmt(left)+'개는 계속 보유합니다'; }
        else { w.className='warn g on';
          w.textContent=BACKMODE?'전량 반송 — 본사 입고 확인 후 마감됩니다':'전량 이관 — 이 건이 마감됩니다'; }
      }else{
        const base=num(last.qty), sh=base?Math.max(base-num($('#outQty').value),0):0;
        w.className='warn r'+(sh>0?' on':''); w.textContent=sh>0?'직전 수량 대비 부족 '+fmt(sh)+'개':'';
      }
    };
    const reset=()=>{ const s=outSrc(), base=s?baseOf(s):num(last.qty);
      $('#outQty').value=base||''; chips('#outTip','#outQty',base); sync(); };
    /* 다음 공정의 이동 구분에 따라 받는 곳 입력을 전환 (본사 화면 전용) */
    const kindSync=()=>{

      : k==='부분가공' ? '가공된 만큼만 다음 공정으로 넘어갑니다.'

  /* ── 방금 등록한 기록 취소 ──────────────────────────────
     (a) 오등록 — 물건은 안 움직였는데 잘못 눌렀다 → 취소
     (b) 미처리 반납 — 물건은 실제로 왔다 → 취소가 아니라 처리유형을 고쳐야 한다
     그래서 <b>마지막 이동기록</b>일 때만 열어두고, 기록은 지우지 않고 표시만 바꾼다. */
  (function(){
    const m=undoable(); if(!m) return;
    const box=$('#undoBox'); if(!box) return;
    box.style.display='';
    box.innerHTML='<div class="undo-t">방금 등록 : '+esc(m.io)+' '+esc(m.move_date||'')+
      ' · '+fmt(m.in_qty)+'개'+(m.mp?' · '+esc(m.mp):'')+'</div>'+
      '<button class="undo-b" id="undoAct">↩ 이 등록 취소</button>';
    $('#undoAct').addEventListener('click',async()=>{
      const b=$('#undoAct');
      const why=prompt('잘못 등록한 경우에만 취소하세요.\n\n'+
        '· 물건이 실제로 돌아왔다면 취소가 아니라 [처리 유형]을 미처리 반납으로 등록하세요.\n'+
        '· 물건은 그대로 있는데 잘못 눌렀을 때만 취소합니다.\n\n취소 사유를 입력하세요.','오등록');
      if(!why) return;
      b.disabled=true; b.textContent='⏳ 처리 중...';
      try{
        await rpc('ki_scan_void',{p_move_id:Number(m.move_id), p_reason:why, p_worker:WORKER});
        toast('↩ 취소되었습니다 — 직전 상태로 되돌아갔습니다.',1);

      w.className='warn r'+(sh>0?' on':''); w.textContent=sh>0?'⚠ 최초 반출 '+fmt(base)+'개 대비 부족 '+fmt(sh)+'개':'';

  /* 하단 액션바 */
  function action(){
    const busy=b=>{ b.disabled=true; b.innerHTML='⏳ 처리 중...'; };
    if(TAB==='in'){
      if(!$('#inQty')){ bar.style.display='none'; return; }
      bar.style.display='';
      bar.innerHTML='<button class="go in" id="act">📥 입고 등록</button>';
      $('#act').addEventListener('click',async()=>{
        const b=$('#act'), o=inCur();
        const tr=isHome()?transitOf(o):0;                 /* 협력사가 반송 등록한 운송 중 수량 */
        const base0=tr>0?tr:remainOf(o), q0=num($('#inQty').value);
        const close=isHome()?!!($('#inClose')&&$('#inClose').checked):false;
        if(close && pendingOf(o)>0)
          return toast('❌ 협력사 보유분 '+fmt(pendingOf(o))+'개가 남아 마감할 수 없습니다.');
        if(close && tr<=0 && base0>0 && q0<base0)
          return toast('❌ 부분 회수는 반출건을 마감할 수 없습니다. 잔량 '+fmt(base0)+'개 중 '+fmt(q0)+'개 입고입니다.');
        busy(b);
        try{
          const kd=((close||tr>0)&&$('#inKind'))?$('#inKind').value:'가공완료';
          let und=0;
          if(kd==='미처리') und=q0;
          else if(kd==='부분가공'){
            und=num($('#inUnd').value);
            if(und<=0||und>=q0){ b.disabled=false; b.innerHTML='📥 입고 등록';

          }
          /* 협력사 반송분 수령은 전용 RPC — 항상 io='입고' 로 쌓아 분할 회수를 정확히 센다 */
          const r = tr>0
            ? await rpc('ki_scan_recv',{p_no:Number(o.no),
                p_date:$('#inDate').value||TODAY, p_qty:q0,
                p_reason:($('#inRsn')&&$('#inRsn').value)||'', p_remark:$('#inRmk').value,
                p_worker:WORKER, p_close:close, p_kind:kd, p_undone:und})
            : await rpc('ki_scan_arrive',{p_no:Number(o.no),
                p_vendor:isHome()?(o.vendor||''):MYVEN,
                p_date:$('#inDate').value||TODAY, p_qty:q0,
                p_reason:($('#inRsn')&&$('#inRsn').value)||'', p_remark:$('#inRmk').value,
                p_close:close, p_worker:WORKER, p_kind:kd, p_undone:und});
          toast(!r.closed
                ? (tr>0?'✓ 부분 회수 등록 — 잔여 '+fmt(r.rest||0)+'개는 아직 회수 전입니다.'
                       :'✓ 입고 등록 완료'+(r.short?' (부족 '+fmt(r.short)+'개)':'')+' — 작업 후 출고하세요.')
                : und?'↩ 미처리 반납 '+fmt(und)+'개로 등록 — 이 공정은 완료되지 않았습니다.'
                     :'✓ 사내 복귀 입고 완료 — 반출건이 마감되었습니다.'
                       +(r.short?' (분실 '+fmt(r.short)+'개)':''),1);
          TAB=''; setTimeout(load,800);
        }catch(e){ toast('❌ '+e.message); b.disabled=false; b.innerHTML='📥 입고 등록'; }
      });
    }else if(TAB==='out'){
      if(!$('#outQty')){ bar.style.display='none'; return; }
      const BACKMODE=!isHome();
      const LB=BACKMODE?'🚚 본사 반송 등록':'📤 출고 등록';
      bar.style.display='';
      bar.innerHTML='<button class="go out" id="act">'+LB+'</button>';
      $('#act').addEventListener('click',async()=>{
        const b=$('#act'), s=outSrc(), kd=OUTKIND(), dest=OUTDEST();
        /* ── 협력사 : 본사 반송 ── */
        if(BACKMODE){
          if(!s) return toast('반송할 보유 건을 선택하세요.');
          const q=num($('#outQty').value);
          if(q<=0) return toast('반송수량을 입력하세요.');
          if(q>pendingOf(s)) return toast('보유수량('+fmt(pendingOf(s))+'개)보다 많습니다.');
          busy(b);
          try{
            const r=await rpc('ki_scan_back',{p_no:Number(s.no), p_vendor:MYVEN,
              p_date:$('#outDate').value||TODAY, p_qty:q,
              p_reason:'', p_remark:$('#outRmk').value, p_worker:WORKER});
            toast(r.left>0
              ?'✓ 부분반송 등록 — 잔량 '+fmt(r.left)+'개 보유. 이동표는 제품과 함께 본사로 보내고, '+
               '남은 분은 [최근 스캔한 LOT]에서 다시 열어 등록하세요.'
              :'✓ 본사 반송 등록 완료 — 이동표를 제품과 함께 '+BACKTO+'로 보내세요.',1);
            TAB=''; setTimeout(load,800);
          }catch(e){ toast('❌ '+e.message); b.disabled=false; b.innerHTML=LB; }
          return;
        }
        if(!dest) return toast(kd==='사내'?'사내 이동처(작업장·부서)를 입력하세요.':'받는 업체를 선택하세요.');
        if(num($('#outQty').value)<=0) return toast('출고수량을 입력하세요.');
        busy(b);
        try{
          /* 복귀입고가 끝난 건에서 이어 보낼 때는 회수 '누계' 기준으로 검증해야 한다
             (ki_scan_out 의 잔량은 최근 입고 1건만 보므로 분할 회수 후 값이 틀어진다) */
          const r = (s && s.idate)
            ? await rpc('ki_scan_ship',{p_from:Number(s.no), p_mp:$('#outMp').value,
                p_vendor:dest, p_kind:kd, p_date:$('#outDate').value||TODAY,
                p_qty:num($('#outQty').value), p_remark:$('#outRmk').value, p_worker:WORKER})
            : await rpc('ki_scan_out',{p_from:s?Number(s.no):null, p_mp:$('#outMp').value,
                p_vendor:dest, p_kind:kd, p_date:$('#outDate').value||TODAY,
                p_qty:num($('#outQty').value), p_remark:$('#outRmk').value, p_worker:WORKER});
          const tail = kd==='사내' ? '이동표를 제품과 함께 사내 다음 공정으로 넘기세요.'
                                   : '이동표를 제품과 함께 다음 업체로 보내세요.';
          toast(r.left>0?'✓ 부분출고 완료 — 잔량 '+fmt(r.left)+'개 보유. '+tail
                        :'✓ '+(kd==='사내'?'사내이동':'출고')+' 완료 — '+tail,1);
          TAB=''; setTimeout(load,800);
        }catch(e){ toast('❌ '+e.message); b.disabled=false; b.innerHTML=LB; }
      });
    }else if(TAB==='home'){
      bar.style.display='';
      bar.innerHTML='<button class="go home" id="act">🏭 사내입고 (LOT 종결)</button>';
      $('#act').addEventListener('click',async()=>{
        const b=$('#act');
        if(!confirm('사내입고로 LOT을 종결합니다.\n이 이동표 QR은 이후 사용할 수 없습니다. 계속할까요?'))return;
        busy(b);
        try{
          await rpc('ki_scan_home',{p_date:$('#hDate').value||TODAY, p_qty:num($('#hQty').value),
            p_reason:($('#hRsn')&&$('#hRsn').value)||'', p_remark:$('#hRmk').value, p_worker:WORKER});
          bar.style.display='none';
          wrap.innerHTML='<div class="done-box"><div class="ic">🏁</div>'+
            '<div style="font-size:19px;font-weight:900;color:#1f8a4c;margin:8px 0 6px">사내입고 완료</div>'+
            '<div style="color:#6b7a89;font-size:13.5px">LOT이 종결되었습니다.<br>이 이동표는 사용이 종료되었습니다.</div></div>';
        }catch(e){ toast('❌ '+e.message); b.disabled=false; b.innerHTML='🏭 사내입고 (LOT 종결)'; }
      });
    }else{
      bar.style.display='';
      bar.innerHTML='<button class="go memo" id="act">📝 특기사항 저장</button>';
      $('#act').addEventListener('click',async()=>{
        const b=$('#act');
        if(!$('#mRmk').value.trim()) return toast('특기사항을 입력하세요.');
        busy(b);
        try{
          await rpc('ki_scan_memo',{p_remark:$('#mRmk').value, p_worker:WORKER});
          toast('✓ 특기사항이 기록되었습니다.',1);
          TAB='memo'; setTimeout(load,800);
        }catch(e){ toast('❌ '+e.message); b.disabled=false; b.innerHTML='📝 특기사항 저장'; }
      });
    }
  }
  action();
}

document.getElementById('meBtn').addEventListener('click',()=>gate({}));
load();
})();
</script>
</body>
</html>
