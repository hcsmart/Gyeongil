<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GI MES</title>
<link rel="stylesheet" href="ki_style.css">
<style>
.lr-list{margin:7px;flex:1;min-height:300px;display:flex;flex-direction:column;
  border:1px solid #8494a4;background:#fff}
.lr-list .grid-wrap{margin:0;border:0;flex:1}
.grid tr.clk{cursor:pointer}
.grid tr.clk:hover td{background:#eef5fc}
.lr-bar{height:9px;background:#eef1f4;border:1px solid #dbe1e7;position:relative;min-width:52px}
.lr-bar i{position:absolute;left:0;top:0;bottom:0;background:#5b9bd5}
.lr-bar i.full{background:#2f7d4d}
.lr-bar i.wip{background:#bcd7f0}
.lr-chain .wip{background:#bcd7f0;color:#1d568c;padding:1px 7px;border-radius:2px;font-weight:700}
.lr-go{height:21px;padding:0 6px;border:1px solid #2e77bd;background:#2e77bd;color:#fff;
  border-radius:2px;font-size:11px;font-weight:700;cursor:pointer}
.lr-go:hover{background:#1d568c}
.lr-dim{position:fixed;inset:0;background:rgba(30,40,50,.42);z-index:60;display:none}
.lr-dim.on{display:block}
.lr-mo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:960px;max-width:96vw;
  max-height:92vh;overflow:auto;background:#fff;border:1px solid #6d7d8c;box-shadow:0 8px 28px rgba(0,0,0,.28);z-index:61}
.lr-mh{height:32px;display:flex;align-items:center;gap:8px;padding:0 11px;
  background:linear-gradient(#3d7ab5,#2e6497);color:#fff;font-weight:800}
.lr-mh .x{margin-left:auto;width:24px;height:24px;border:0;background:transparent;color:#fff;
  font-size:16px;cursor:pointer}
.lr-mb{padding:10px 12px}
.lr-info{display:grid;grid-template-columns:88px 1fr 88px 1fr;gap:4px 6px;
  background:#f4f7fa;border:1px solid #dde4ea;padding:8px 10px;margin-bottom:9px}
.lr-info b{color:#526171;font-weight:700;font-size:11px}
.lr-info span{color:#2b3844;font-weight:700}
.lr-chain{margin-bottom:9px;padding:9px 10px;border:1px solid #dde4ea;background:#fbfcfd;
  font-size:11px;color:#4d5a68;overflow-x:auto}
/* 공정 흐름 다이어그램 */
.fx{display:flex;align-items:stretch;gap:0;min-width:max-content}
.fx-node{min-width:96px;padding:6px 10px;border:1px solid #c4cfd9;border-radius:4px;background:#fff;
  display:flex;flex-direction:column;justify-content:center;gap:1px;text-align:center}
.fx-node .t{font-weight:800;font-size:12px;color:#33465a;line-height:1.3}
.fx-node .n{font-size:10px;color:#7b8794;line-height:1.2}
.fx-node .s{font-size:10px;font-weight:700;margin-top:2px;line-height:1.3}
.fx-node.st-home{background:#33465a;border-color:#26374a}
.fx-node.st-home .t{color:#fff}.fx-node.st-home .n,.fx-node.st-home .s{color:#b9c7d6}
.fx-node.st-done{background:#eef7f0;border-color:#2f7d4d}
.fx-node.st-done .t{color:#1d5a35}.fx-node.st-done .s{color:#2f7d4d}
.fx-node.st-in{background:#fdf1e4;border-color:#e8862e;box-shadow:0 0 0 1px #e8862e;color:#8a5a12}
.fx-node.st-in .n,.fx-node.st-in .s{color:#a06a20}
.fx-node.st-wip{background:#e9f2fc;border-color:#2e77bd;box-shadow:0 0 0 1px #2e77bd;
  animation:fxPulse 1.6s ease-in-out infinite}
.fx-node.st-wip .t{color:#1d568c}.fx-node.st-wip .s{color:#1d568c}
.fx-node.st-next{background:#fff;border-style:dashed;border-color:#2e77bd}
.fx-node.st-next .t{color:#1d568c}.fx-node.st-next .s{color:#5a83ab}
.fx-node.st-rest{background:#f2f4f6;border-color:#d5dce2}
.fx-node.st-rest .t{color:#96a2ad}.fx-node.st-rest .s{color:#a8b3bd}
/* 현재 위치 : 짙은 색 강조 */
.fx-node.st-done.st-cur{background:#2f7d4d;border-color:#1d5a35;box-shadow:0 1px 4px rgba(31,90,53,.4)}
.fx-node.st-done.st-cur .t{color:#fff}.fx-node.st-done.st-cur .n{color:#cfe8d8}
.fx-node.st-done.st-cur .s{color:#eafff1}
.fx-node.st-wip.st-cur{background:#2e77bd;border-color:#1d568c;box-shadow:0 1px 4px rgba(29,86,140,.4)}
.fx-node.st-wip.st-cur .t{color:#fff}.fx-node.st-wip.st-cur .n{color:#cfe1f3}
.fx-node.st-wip.st-cur .s{color:#eaf4ff}
.fx-node.st-home:not(.st-cur){background:#eef1f4;border-color:#c4cfd9}
.fx-node.st-home:not(.st-cur) .t{color:#526171}
.fx-node.st-home:not(.st-cur) .n,.fx-node.st-home:not(.st-cur) .s{color:#8b98a5}
.fx-node.st-home{max-width:168px}
.fx-lg{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:10.5px;color:#7b8794}
.fx-lg i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:4px;vertical-align:-1px;border:1px solid #c4cfd9}
.fx-lg .g1{background:#33465a;border-color:#26374a}
.fx-lg .g2{background:#eef7f0;border-color:#2f7d4d}
.fx-lg .g3{background:#2e77bd;border-color:#1d568c}
.fx-lg .g4{background:#fff;border-style:dashed;border-color:#2e77bd}
.fx-lg .g5{background:#e8862e;border-color:#c96f1a}
.fx-arrow{align-self:center;padding:0 6px;color:#b6c2cd;font-weight:800;font-size:14px;white-space:nowrap}
.fx-arrow.a-done{color:#2f7d4d}
.fx-arrow.a-wip{color:#2e77bd;animation:fxPulse 1.6s ease-in-out infinite}
@keyframes fxPulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){.fx-node.st-wip,.fx-arrow.a-wip{animation:none}}
.lr-f{display:grid;grid-template-columns:92px 1fr 92px 1fr;gap:6px;align-items:center}
.lr-f label{color:#526171;font-weight:700;font-size:11px}
.lr-f input,.lr-f select{height:26px;border:1px solid #aeb9c4;padding:0 6px;font:inherit;width:100%}
.lr-mf{display:flex;gap:6px;align-items:center;padding:9px 12px;border-top:1px solid #e0e6eb;background:#fafbfc}
.lr-open{margin:9px 0 0;border:1px solid #dde4ea}
.lr-open h5{margin:0;padding:5px 9px;background:#eef2f6;border-bottom:1px solid #dde4ea;
  font-size:11px;color:#41556a}
.lr-open .grid{table-layout:auto}
.lr-open .grid td,.lr-open .grid th{white-space:normal;overflow:visible;text-overflow:clip;
  word-break:break-all;font-size:11px;padding:3px 5px}
.lr-open .grid td.nw{white-space:nowrap}
/* 접기·펼치기 (기본 접힘) */
.lr-fold>h5{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.lr-fold>h5 .arw{transition:transform .18s;font-size:10px;color:#7b8b9c}
.lr-fold>h5 .cnt{margin-left:auto;font-size:10px;color:#7b8b9c;font-weight:400}
.lr-fold>h5:hover{background:#e4ebf2}
.lr-fold .fold-bd{display:none}
.lr-fold.open .fold-bd{display:block}
.lr-fold.open>h5 .arw{transform:rotate(90deg)}

/* ── 목록 미니 공정체인 ── */
td.mini-chain{white-space:nowrap;overflow-x:auto;max-width:340px;padding:3px 5px !important}
td.mini-chain::-webkit-scrollbar{height:5px}
td.mini-chain::-webkit-scrollbar-thumb{background:#cbd5df;border-radius:3px}
.cn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:34px;padding:2px 6px;border:1px solid #d7dee5;border-radius:4px;background:#f7f9fb;
  font-size:10.5px;font-weight:800;color:#7b8794;line-height:1.25;vertical-align:middle}
.cn em{font-style:normal;font-size:9px;font-weight:700;color:#8894a0;max-width:66px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn.ok{background:#eaf6ee;border-color:#a8d6ba;color:#1f7a45}
.cn.ok em{color:#3f8f60}
.cn.cur{background:#2f7d4d;border-color:#2f7d4d;color:#fff}
.cn.cur em{color:#d6ecdd}
.cn.wip{background:#2e77bd;border-color:#2e77bd;color:#fff}
.cn.wip em{color:#dbe9f8}
/* 사내 작업장 이동 = 오렌지 */
.cn.inw{background:#e8862e;border-color:#c96f1a;color:#fff}
.cn.inw em{color:#fde9d3}
.cv.in{color:#e8862e}
.cn.home{background:#eef1f4;border-color:#cfd7de;color:#5b6b7b}
.cn.home.ok{background:#eaf6ee;border-color:#a8d6ba;color:#1f7a45}
.cn.home.cur{background:#2f7d4d;border-color:#2f7d4d;color:#fff}
.cn.home.cur em{color:#d6ecdd}
/* 🚚 는 왼쪽을 향하므로 좌우 반전해 진행 방향(오른쪽)으로 통일한다.
   .truck 클래스를 쓰는 모든 위치가 같은 방향을 유지한다. */
.truck{display:inline-block;transform:scaleX(-1)}
.cv{display:inline-block;margin:0 1px;font-size:11px;opacity:.28;vertical-align:middle;
  filter:grayscale(1);transform:scaleX(-1)}
.cv.ok{opacity:.5;filter:grayscale(.4)}
.cv.go{opacity:1;filter:none;animation:truck 1.9s ease-in-out infinite}
@keyframes truck{
  0%,100%{opacity:.25;transform:scaleX(-1) translateX(2px)}
  50%    {opacity:1;  transform:scaleX(-1) translateX(-2px)}}

/* ===== 모바일 (폰) 대응 ===== */
@media (max-width:820px){
  .lr-mo{left:0;top:0;transform:none;width:100%;max-width:100%;max-height:100%;height:100%;
    border:0;display:flex;flex-direction:column}
  .lr-mh{height:46px;font-size:15px;flex:none;position:sticky;top:0;z-index:3}
  .lr-mh .x{width:34px;height:34px;font-size:20px}
  .lr-mb{padding:10px;flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
  /* 정보영역 : 2열(라벨+값) 세로 배치 */
  .lr-info{grid-template-columns:78px 1fr;gap:5px 8px;font-size:13px;padding:10px}
  .lr-info b{font-size:12px}
  /* 입력폼 : 1필드 1행 */
  .lr-f{grid-template-columns:78px 1fr;gap:7px}
  .lr-f label{font-size:12px}
  .lr-f input,.lr-f select{height:38px;font-size:15px;padding:0 9px}
  /* 표 : 가로 스크롤 (칸 쪼개짐 방지) */
  .lr-open .fold-bd,.lr-open .tbl-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .lr-open .grid{min-width:660px}
  .lr-open .grid td,.lr-open .grid th{white-space:nowrap;word-break:keep-all;font-size:12px;padding:6px 7px}
  .lr-lot{overflow-x:auto}
  .lr-lot table{min-width:420px}
  .lr-lot input{height:34px;font-size:15px}
  .lr-open h5{padding:9px 10px;font-size:12.5px}
  .lr-fold>h5 .cnt{font-size:11px}
  /* 하단 버튼 : 고정 + 가로 스크롤 */
  .lr-mf{position:sticky;bottom:0;flex:none;padding:9px 10px;gap:7px;overflow-x:auto;z-index:3;
    box-shadow:0 -2px 8px rgba(20,40,60,.08)}
  .lr-mf .btn{height:40px;padding:0 14px;font-size:14px;white-space:nowrap;flex:none}
  .lr-mf .msg{font-size:12px}
  /* 공정 다이어그램 */
  .lr-chain{padding:9px 8px}
  .fx-node{min-width:112px}
  /* 목록 그리드도 가로 스크롤 */
  .lr-list .grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .lr-list .grid{min-width:900px}
  .ck-tb{flex-wrap:wrap;gap:5px}
  .ck-tb input{width:100% !important}
}
.lr-lot{margin-top:9px;border:1px solid #dde4ea}
.lr-lot .lh{display:flex;align-items:center;gap:7px;padding:4px 8px;background:#f4f7fa;
  border-bottom:1px solid #dde4ea;font-size:11px;color:#41556a;font-weight:700}
.lr-lot .lh .sum{margin-left:auto;color:#1d568c}
.lr-lot table{width:100%;border-collapse:collapse}
.lr-lot th{background:#fafbfc;border-bottom:1px solid #e4e9ee;font-size:11px;color:#526171;
  height:23px;font-weight:700}
.lr-lot td{border-bottom:1px solid #eef1f4;padding:3px 5px}
.lr-lot input{height:24px;border:1px solid #aeb9c4;padding:0 6px;font:inherit;width:100%}
.lr-lot .del{width:24px;height:22px;border:1px solid #c9d2da;background:#fff;color:#a0505a;
  cursor:pointer;border-radius:2px}
.lr-lot .add{height:21px;padding:0 8px;border:1px solid #6f8398;background:#fff;color:#41556a;
  border-radius:2px;font-size:11px;font-weight:700;cursor:pointer}
</style>
<script src="ki_config.js"></script>
<script src="ki_core.js"></script>
</head>
<body>
<script>
(async function(){
  if(!await KI.guard('lot-route'))return;
  const $=KI.$, el=KI.el, esc=KI.esc;
  const cur=KI.chrome('lot-route');
  const CAN_S=KI.can('lot-route','save'), CAN_E=KI.can('lot-route','edit'),
        CAN_D=KI.can('lot-route','delete');
  const TODAY=new Date().toISOString().slice(0,10);
  let ROWS=[], OSP=[], VEN=[], PROC=[], RT=[], MOLDS=[], RCPT=[], MVIN=[], MVST={}, sel=null, NEW=false, editNo=null;

  const ui=KI.page(cur,[
    ['신규등록','',()=>openNew()],
    ['새로고침','',()=>load()],
    ['엑셀다운로드','',()=>csv()],
    ['인쇄','',()=>window.print()]
  ]);
  { const nb=[].slice.call(ui.act.querySelectorAll('button')).find(b=>b.textContent.trim()==='신규등록');
    if(nb){ nb.style.background='#e8862e'; nb.style.borderColor='#c96f1a'; nb.style.color='#fff'; nb.style.fontWeight='700'; } }
  const nt=el('div','note');
  nt.innerHTML='LOT의 <b>표준공정 대비 진척</b>과 현재 위치입니다. 행을 클릭하거나 <b>[▸]</b>을 누르면 '+
    '해당 LOT 정보가 채워진 채로 <b>다음 공정 반출 · 입고</b>를 바로 등록할 수 있습니다. '+
    '표준공정이 모두 끝난 LOT은 <b>[🏭 사내입고]</b>로 종결하고, 모달의 <b>[🖨 이동표(QR)]</b>로 공정이동표를 발행하세요.';
  ui.pg.appendChild(nt);

  const L=el('div','lr-list');
  const tb=el('div','ck-tb');
  tb.innerHTML='<span style="font-weight:700;color:#526171">검색</span>'+
    '<input type="text" id="q" placeholder="LOT · JOB · 품번 · 외주처" style="height:24px;border:1px solid #aeb9c4;padding:0 6px;width:220px">'+
    '<span style="font-weight:700;color:#526171;margin-left:8px">상태</span>'+
    '<select id="fs"><option value="">전체</option><option>진행중</option><option>외주 반출중</option>'+
      '<option>표준완료</option><option value="사내입고 대기">사내입고 대기</option>'+
      '<option value="사내입고 완료">사내입고 완료</option><option>미매칭</option></select>'+
    '<button class="btn primary" id="btnQ" style="height:24px;padding:0 14px;margin-left:8px">조회</button>'+
    '<span class="sp" id="cnt"></span>';
  const gw=el('div','grid-wrap'); const tbl=el('table','grid');
  tbl.innerHTML='<thead><tr>'+
    '<th style="width:110px" data-sk="job">JOB</th>'+
    '<th style="width:104px" data-sk="map">품번</th>'+
    '<th style="width:104px" data-sk="part">LOT</th>'+
    '<th style="width:120px" data-sk="std">표준공정</th>'+
    '<th style="width:340px">공정 진행</th>'+
    '<th style="width:126px">현재 위치(보유처)</th><th style="width:92px">이동일자</th>'+
    '<th style="width:120px">진척</th>'+
    '<th style="width:64px">삭제</th></tr></thead><tbody></tbody>';
  gw.appendChild(tbl); L.appendChild(tb); L.appendChild(gw); ui.pg.appendChild(L);
  const tbody=tbl.querySelector('tbody');
  ['q','fs'].forEach(id=>$('#'+id).addEventListener('input',draw));
  $('#btnQ').addEventListener('click',()=>load());

  /* ── 제목행 정렬 : 공용 헬퍼 (오름차순 ▲ → 내림차순 ▼ → 등록순 ↕) ── */
  const SORT=KI.sortHead(tbl, ()=>draw(), (c,k)=>
      k==='job' ? (c.job||'') : k==='map' ? (c.map_part||'')
    : k==='part'? (c.part||'') : (c.std?c.std.standard_process_name:''));
  const sortList=rows=>SORT.apply(rows);

  /* ── 진행등록 모달 ── */
  const dim=el('div','lr-dim'); const mo=el('div','lr-mo');
  mo.innerHTML='<div class="lr-mh"><span id="mTtl">진행등록</span><button class="x" id="mX">✕</button></div>'+
    '<div class="lr-mb">'+
      '<div class="lr-info" id="infoBox">'+
        '<b>JOB</b><span id="iJob"></span><b>LOT</b><span id="iPart"></span>'+
        '<b>품번</b><span id="iMap"></span><b>금형제번</b><span id="iMold"></span>'+
        '<b>표준공정</b><span id="iStd"></span><b>진척</b><span id="iRate"></span>'+
        '<b>현재 공정</b><span id="iCur"></span><b>현재 위치</b><span id="iVen"></span>'+
      '</div>'+
      '<div class="lr-chain" id="iChain"></div>'+
      '<div id="openBox"></div>'+
      '<div id="moveBox"></div>'+
      '<div class="lr-open lr-fold" id="outFold" style="margin-top:10px">'+
      '<h5><span class="arw">▶</span>📤 다음 공정 진행등록 (반출)'+
      '<span class="cnt" id="outCnt">클릭하여 펼치기</span></h5>'+
      '<div class="fold-bd"><div style="padding:9px 10px"><div class="lr-f">'+
        '<label>JOB</label><span style="display:flex;gap:4px;min-width:0">'+
          '<input type="text" id="fJob" placeholder="JOB 번호" style="flex:1;min-width:0">'+
          '<button type="button" id="fJobGen" title="JOB-YYMMDD## 형태로 자동생성" '+
            'style="height:26px;padding:0 9px;border:1px solid #9aa8b6;'+
            'background:linear-gradient(#fff,#e1e7ec);color:#405163;white-space:nowrap;font-weight:700">자동생성</button>'+
        '</span>'+
        '<label>품번</label><input type="text" id="fMap" list="dlMap" autocomplete="off" placeholder="제품번호 입력 후 선택">'+
        '<label>표준공정 *</label><select id="fRoute"></select>'+
        '<label>가공공정 *</label><select id="fMp"></select>'+
        '<label>이동 구분 *</label><select id="fKind">'+
          '<option value="외주">🚚 외주 이동 (협력사)</option>'+
          '<option value="사내">🏭 사내 이동 (사내 작업장)</option></select>'+
        '<label id="fVenL">외주처 *</label>'+
          '<span style="display:flex;gap:4px;min-width:0">'+
            '<select id="fVen" style="flex:1;min-width:0"></select>'+
            '<input type="text" id="fDept" list="dlDept" autocomplete="off" '+
              'placeholder="사내 작업장 · 담당부서" style="flex:1;min-width:0;display:none">'+
          '</span>'+
        '<label>출고(반출)일</label><input type="date" id="fSdate">'+
        '<label>납기일</label><input type="date" id="fEdate">'+
        '<label>단가</label><input type="text" id="fQuote" placeholder="숫자만">'+
        '<label>총수량</label><input type="text" id="fQty" readonly value="0" '+
          'style="background:#f4f7fa;font-weight:800;color:#1d568c;text-align:right">'+
        '<label id="fFromL">출발 보유분</label><select id="fFrom"></select>'+
      '</div><div id="mapInfo" style="margin-top:5px;color:#5b7fa5;font-size:11px"></div>'+

  /* 이동 구분 전환 — 외주는 협력사 목록, 사내는 작업장 자유 입력 */

  $('#fRoute').addEventListener('change',()=>fillMp($('#fRoute').value,''));
  /* 순차 이동 확인 : 완료·건너뛴 공정 경고 */
  $('#fMp').addEventListener('change',()=>{
    const rt=routeOf($('#fRoute').value), m=$('#mMsg');
    if(!rt||!sel) return;

    else { m.className='msg'; m.textContent=''; }
  });
  const pName=c=>{const p=PROC.find(x=>x.process_code===c);return p?p.process_name:''};
  /* 물류흐름 자동 문구 — 특기사항 앞머리에 기록 */
  const node=(mp,ven)=>[mp?(pName(mp)?mp+'·'+pName(mp):mp):'', ven||''].filter(Boolean).join(' ')||'사내';
  const flow=(from,to,q)=>'▶ '+from+' → '+to+(q?' · '+Number(q).toLocaleString()+'EA':'');
  const rmkJoin=(...a)=>a.filter(x=>x&&String(x).trim()).join(' | ')||null;
  const routeOf=no=>RT.find(r=>String(r.standard_process_no)===String(no));
  /* 표준공정경로(기준정보 › 외주기준)의 단계만 가공공정으로 선택 — 순차 이동 관리 */
  function fillMp(routeNo,keep){
    const mp=$('#fMp'), rt=routeOf(routeNo), done=sel?sel.seen:new Set();
    const steps=rt&&Array.isArray(rt.steps)?rt.steps:[];
    mp.innerHTML='<option value="">선택</option>'+(
      steps.length
        ? steps.map((x,i)=>'<option value="'+esc(x)+'">'+(i+1)+'. '+esc(x)+
            (pName(x)?' · '+esc(pName(x)):'')+(done.has(x)?' ✓완료':'')+'</option>').join('')
        : PROC.map(pr=>'<option value="'+esc(pr.process_code)+'">'+esc(pr.process_code)+' · '+
            esc(pr.process_name)+'</option>').join(''));
    if(keep){
      if(!steps.length || steps.includes(keep)) mp.value=keep;
      else { mp.insertAdjacentHTML('beforeend','<option value="'+esc(keep)+'">'+esc(keep)+
             (pName(keep)?' · '+esc(pName(keep)):'')+' (경로 외)</option>'); mp.value=keep; }
    }
  }
  function matchRoute(seq){
    let best=null;
    RT.forEach(rt=>{ const sd=rt.steps||[]; const hit=sd.filter(x=>seq.includes(x)).length;
      if(hit&&(!best||hit>best.hit)) best={rt:rt,hit:hit}; });
    return best;
  }
  function calc(r){
    /* 레거시 경유이력(steps)에 없는 단계는 QR·수동 이동이력(도착·입고)으로 보완 */
    const base=Array.isArray(r.steps)?r.steps:[];
    const add=(MVST[String(r.part||'')]||[])
      .filter(x=>x.mp && !base.some(s=>s.mp===x.mp));
    const st=base.concat(add).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
    const seen0=new Set(st.map(s=>s.mp));
    let last=st[st.length-1]||{}, moving=false;
    /* 입고 전(반출중)이라도 현재 위치를 표시 : 미입고 외주건 중 최근 출고건
       단, 도착확인이 된 건은 '이동중'이 아니라 그 업체에서 '작업중' */
    const op=ospOf(r.part).filter(o=>o.sdate&&!o.idate)
               .sort((a,b)=>String(b.sdate||'').localeCompare(String(a.sdate||''))
                          ||(Number(b.no)||0)-(Number(a.no)||0))[0];
    if(op && String(op.sdate||'')>=String(last.date||'')){
      last={mp:op.mp,vendor:op.vendor,date:op.sdate};
      moving=!seen0.has(op.mp);
    }
    /* 표준공정 : 진행등록에 저장된 route_no 우선 → 없으면 반출건의 route_no → 그래도 없으면 역추적
       (진행이력 뷰에는 route_no가 없어 반출건에서 보완해야 정확) */
    const rno = r.route_no || (ospOf(r.part).slice()
        .sort((a,b)=>(Number(b.no)||0)-(Number(a.no)||0))
        .find(o=>o.route_no)||{}).route_no || '';
    const fixed=rno?RT.find(x=>String(x.standard_process_no)===String(rno)):null;
    const m=fixed?{rt:fixed}:matchRoute(st.map(s=>s.mp)), sd=m?(m.rt.steps||[]):[];
    const seen=new Set(st.map(s=>s.mp));
    const hit=sd.filter(x=>seen.has(x)), total=sd.length||st.length||1;
    const done=m?hit.length:st.length;
    let rest=sd.filter(x=>!seen.has(x));
    /* 반출중인 단계는 '진행중'으로 분리 — 다음 공정은 그 다음 단계 */
    const wipMp = (moving && last.mp && !seen.has(last.mp)) ? last.mp : '';
    const wip = wipMp && sd.includes(wipMp) ? 1 : 0;
    if(wipMp) rest = rest.filter(x=>x!==wipMp);
    const rc=RCPT.find(x=>String(x.part||'')===String(r.part))
      ||MVIN.find(x=>String(x.part||'')===String(r.part))||null;
    return {no:r.no, job:r.job, part:r.part, proc:r.proc,
      map_part:r.map_part||(ospOf(r.part).find(o2=>o2.map_part)||{}).map_part||'',
      recv:rc||null,
      route_no:rno||'', moving:moving, steps:st, last:last, std:m?m.rt:null,
      sd:sd, seen:seen, done:done, total:total, rest:rest, wip:wip, wipMp:wipMp,
      rate: total?Math.round(done/total*100):0,
      wipRate: total?Math.round((done+wip)/total*100):0};
  }
  /* ── 제품의 현재 물리적 위치 ───────────────────────────────
     외주는 [사내 → 1공정 → 사내복귀 → 2공정 → 사내복귀 …] 로 왕복하므로
     공정을 마친 시점의 위치는 그 공정이 아니라 <b>사내</b>다.
       'recv' 사내입고 종결 / 'wip' 외주 보유(반출중) / 'home' 사내 보유
     · wipMp2 : 반출중인 공정 (이미 완료한 공정으로 재반출한 경우 포함) */
  const ospOf = part => OSP.filter(o=>String(o.part||'')===String(part) ||
    (Array.isArray(o.lots)&&o.lots.some(x=>String(x.lot||'')===String(part))));
  /* 미입고(입고일 없는) 외주건 = 제품이 아직 그 업체에 있다
     · 도착확인 전  → 이동중(반출중)
     · 도착확인 후  → 그 업체에서 작업중  (둘 다 사내에는 없다) */
  const openAll = c => ospOf(c.part).filter(o=>o.sdate&&!o.idate)
      .sort((a,b)=>String(b.sdate||'').localeCompare(String(a.sdate||''))
                 ||(Number(b.no)||0)-(Number(a.no)||0));
  const isIn = o => String(o&&o.move_kind||'외주')==='사내';
  /* 외주 미결건 = 제품이 협력사에 있음 / 사내 미결건 = 제품은 경일FB 안에 있음 */
  const openOsp = c => openAll(c).find(o=>!isIn(o))||null;
  const openIn  = c => openAll(c).find(isIn)||null;
  const wipMpOf = c => { const o=openOsp(c); return o?(o.mp||''):''; };
  const inMpOf  = c => { const o=openIn(c);  return o?(o.mp||''):''; };
  /* 제품의 현재 물리적 위치 : recv 종결 / wip 외주 보유 / home 사내 보유 */
  const posOf = c => c.recv ? 'recv' : (wipMpOf(c) ? 'wip' : 'home');
  /* 목록 · CSV 의 [현재 외주처] : 사내로 입고되면 직전 외주처가 아니라 경일FB */
  const holderOf = c => {
    const p=posOf(c);
    if(p==='recv') return '경일FB (사내입고 완료)';
    if(p==='wip'){ const o=openOsp(c); return (o&&o.vendor)||c.last.vendor||'-'; }
    const oi=openIn(c);
    return oi ? ('경일FB · '+(oi.vendor||'사내 작업장')) : '경일FB (사내 보유)';
  };
  /* 현재 상태 문구 */
  const stateOf = c => {
    const p=posOf(c);
    if(p==='recv') return '사내입고 완료';
    if(p==='wip')  return c.seen.has(wipMpOf(c))?'외주 작업중':'이동중';
    if(openIn(c))  return '사내 작업중';
    return c.std&&!c.rest.length?'사내입고 대기':'사내 보유';
  };
  function ospState(part){
    const o=ospOf(part).filter(x=>x.sdate&&!x.idate);
    if(o.length) return {t:'반출중', n:o.length, rows:o};
    return {t:'-', n:0, rows:[]};
  }

  /* ── 목록용 미니 공정체인 ──
     사내 🚚 MS(업체) 🚚 HQ(업체) … 🚚 사내
     · 완료 단계 = 초록 · 이동중 구간의 🚚 는 서서히 깜빡임
     · 출고처가 확정된(반출건이 있는) 단계는 외주처명, 미확정은 표준공정만 표시 */
  function chainCell(c){
    if(!c.std) return '<span style="color:#96a2ad">(표준공정 미매칭)</span>';
    const sd=c.std.steps||[];
    const venOf = mp => { const o=ospOf(c.part).filter(x=>x.mp===mp)
        .sort((a,b)=>(Number(b.no)||0)-(Number(a.no)||0))[0]; return o?(o.vendor||''):''; };
    const dateOf = mp => (c.steps.find(x=>x.mp===mp)||{}).date||'';
    const pos=posOf(c), wip2=(pos==='wip')?wipMpOf(c):'', in2=(pos==='home')?inMpOf(c):'';
    /* 외주 공정은 끝날 때마다 이 '사내'로 되돌아오므로 사내 노드는 하나만 둔다
       (출발 · 공정 간 복귀 · 최종 사내입고를 모두 이 노드가 표시) */
    const cls = pos==='recv' ? ' ok cur' : (pos==='home' ? ' cur' : '');
    const tip = pos==='recv'
        ? '사내입고 완료 '+esc((c.recv&&c.recv.in_date)||'')+
          (Number(c.recv&&c.recv.short_qty)>0?' · 부족 '+Number(c.recv.short_qty).toLocaleString():'')
      : pos==='home'
        ? (c.std&&!c.rest.length?'현재 위치 · 사내 보유 (사내입고 대기)':'현재 위치 · 사내 보유')
        : '사내 출발 · 복귀 지점';
    let html='<span class="cn home'+cls+'" title="'+tip+'">'+
      (pos==='recv'?'✓ ':'')+'🏭 사내'+
      (pos==='recv'?'<em>'+esc((c.recv&&c.recv.in_date)||'')+'</em>':'')+'</span>';
    sd.forEach((mp,i)=>{
      const wip=(mp===wip2), inw=(!wip&&mp===in2), done=(c.seen.has(mp)&&!wip&&!inw);
      const cur=false;
      /* 앞 구간 차량 : 이 단계로 이동중이면 깜빡임 */
      html+='<span class="cv'+(wip?' go':(inw?' in':(done?' ok':'')))+'">'+(inw?'🏭':'🚚')+'</span>';
      const v=venOf(mp);
      html+='<span class="cn'+(cur?' cur':(done?' ok':(wip?' wip':(inw?' inw':''))))+'" title="'+esc(mp+(pName(mp)?' · '+pName(mp):''))+
            (dateOf(mp)?' / '+esc(dateOf(mp)):'')+'">'+(done?'✓ ':'')+esc(mp)+
            (v?'<em>'+esc(v)+'</em>':'')+'</span>';
    });
    return html;
  }

  function draw(){
    const q=$('#q').value.trim().toLowerCase(), f=$('#fs').value;
    tbody.innerHTML='';
    const list=sortList(ROWS.map(calc).filter(c=>{
      if(q && ![c.part,c.job,c.map_part,c.last.vendor].some(v=>String(v||'').toLowerCase().includes(q))) return false;
      const os=ospState(c.part).t;
      if(f==='외주 반출중') return os==='반출중';
      if(f==='표준완료')  return c.std && !c.rest.length;
      if(f==='사내입고 대기') return c.std && !c.rest.length && !c.wip && os!=='반출중' && !c.recv;
      if(f==='사내입고 완료') return !!c.recv;
      if(f==='미매칭')    return !c.std;
      if(f==='진행중')    return c.std && c.rest.length;
      return true;
    }));
    list.forEach(c=>{
      const os=ospState(c.part);

            (c.wip?'<i class="wip" style="width:'+Math.min(c.wipRate,100)+'%"></i>':'')+
            '<i class="'+(c.rate>=100?'full':'')+'" style="width:'+Math.min(c.rate,100)+'%"></i></div>'+
          '<span style="font-size:10px;color:#7b8794;white-space:nowrap">'+c.done+'/'+c.total+
            (c.wip?' <b style="color:#2e77bd">+1</b>':'')+'</span></div></td>'+
        '<td class="center" style="white-space:nowrap">'+
          (CAN_D?'<button class="lr-go del" style="background:#fff;color:#a0505a;border-color:#c9a0a8">삭제</button>':'')+
        '</td>';
      const db=t.querySelector('.del');
      if(db) db.addEventListener('click',ev=>{ ev.stopPropagation(); delRow(c); });
      t.addEventListener('click',()=>open(c));

    if(!list.length) tbody.innerHTML='<tr><td colspan="9" class="center" style="height:52px;color:#8894a0">조건에 맞는 LOT이 없습니다.</td></tr>';

  /* ── 사내 → 외주 → 사내 흐름 다이어그램 ──
     mv(현장 기록)가 있으면 도착·입고 실제 일자를 우선 사용하고, 현재 위치를 짙은 색으로 강조 */
  function drawFlow(c,mv){
    mv=mv||[];
    const md=d=>d?String(d).slice(5).replace('-','/'):'';
    const arr=(io2,x)=>mv.filter(v=>v.mp===x&&(v.io==='도착'||v.io==='입고'))
                  .sort((a,b)=>String(b.move_date||'').localeCompare(String(a.move_date||'')))[0];
    const outOf=x=>mv.filter(v=>v.mp===x&&v.io==='출고')
                  .sort((a,b)=>String(b.move_date||'').localeCompare(String(a.move_date||'')))[0];
    const inh=mv.find(v=>v.io==='사내입고');
    const node=(cls,cur,t,n2,st2)=>'<div class="fx-node '+cls+(cur?' st-cur':'')+'">'+
      '<div class="t">'+t+'</div>'+(n2?'<div class="n">'+n2+'</div>':'')+
      (st2?'<div class="s">'+st2+'</div>':'')+'</div>';
    const arrow=cls=>'<div class="fx-arrow'+(cls?' '+cls:'')+'">→</div>';
    const seq = c.sd.length ? c.sd : c.steps.map(x=>x.mp);   /* 미매칭 시 실제 경유 순서 */
    /* 현재 위치 : 종결 > 반출중 > 마지막 완료 공정 > 사내
       완료 판정 : 진행이력(steps) 또는 현장 기록(도착·입고) 중 하나라도 있으면 완료 */
    const doneOf=x=>!!c.steps.find(s2=>s2.mp===x)||c.seen.has(x)||!!arr(null,x);
    const closed=!!c.recv||!!inh;
    const wipMp2=closed?'':wipMpOf(c);
    const inMp2 =closed?'':inMpOf(c);
    const inVen =(openIn(c)||{}).vendor||'';
    /* 완료 공정은 '사내 복귀'를 뜻하므로 현재 위치가 되지 않는다 */
    const curPos= closed?'recv' : wipMp2?('wip:'+wipMp2) : 'home';
    const nDone = seq.filter(doneOf).length;
    const allDone = seq.length && seq.every(doneOf);
    const rIn=c.recv?c.recv.in_date:(inh?inh.move_date:'');
    const rQty=c.recv?Number(c.recv.qty)||0:(inh?Number(inh.in_qty)||0:0);
    const rShort=c.recv?Number(c.recv.short_qty)||0:(inh?Number(inh.short_qty)||0:0);
    /* 외주는 공정마다 이 '사내'로 되돌아오므로 사내 노드는 하나만 둔다
       (출발 · 공정 간 복귀 · 최종 사내입고 종결을 모두 이 노드가 표시) */
    let html=node(closed?'st-done':'st-home', closed||curPos==='home', '🏭 사내',
      closed ? '종결' : (curPos==='home'&&nDone?'보유중':'출발'),
      closed ? ('✓ 사내입고 '+md(rIn)+' · '+rQty.toLocaleString()+
                (rShort?' <span style="color:#ffd9d9">(부족 '+rShort+')</span>':''))
      : curPos!=='home' ? '반출 완료'
      : inMp2  ? '현재 위치 · 사내 '+esc(inVen||'작업장')+' 작업중'
      : allDone ? '현재 위치 · 전공정 완료 · 사내입고 대기'
      : nDone   ? '현재 위치 · '+nDone+'/'+seq.length+' 완료 · 다음 반출 대기'
                : '현재 위치 · 출발 대기');
    seq.forEach((x,i)=>{
      const info=c.steps.find(s2=>s2.mp===x);
      const wip=(x===wipMp2), inw=(!wip && x===inMp2), done=(doneOf(x)&&!wip&&!inw);
      const nx=(!done && !wip && !inw && x===c.rest[0]);
      const a2=arr(null,x), o2=outOf(x);
      const dDate=(a2&&a2.move_date)||(info&&info.date)||'';      /* 실제 도착·입고일 우선 */
      const dVen =(a2&&a2.vendor)||(info&&info.vendor)||'';
      const wDate=(o2&&o2.move_date)||c.last.date||'';
      const prevDone = i===0 ? (c.steps.length>0||c.moving) : doneOf(seq[i-1])||seq[i-1]===wipMp2;
      html+=arrow(done?'a-done':((wip||inw)&&prevDone)?'a-wip':'');
      html+=node(done?'st-done':wip?'st-wip':inw?'st-in':nx?'st-next':'st-rest',
        curPos==='wip:'+x,
        esc(x), esc(pName(x)||''),
        inw?'🏭 '+esc(inVen||'사내 작업장')+' 작업중'
        :done?'✓ 완료 · 사내복귀'+(dVen?' · '+esc(dVen):'')+(dDate?' · '+md(dDate):'')
        :wip?((arr(null,x)||c.seen.has(x))
              ? '🏭 '+esc((a2&&a2.vendor)||c.last.vendor||'')+' 작업중'+(dDate?' · 도착 '+md(dDate):'')
              : '<span class="truck">🚚</span> '+esc(c.last.vendor||'')+' 반출중'+(wDate?' · '+md(wDate):''))
        :nx?'다음 공정':'대기');
    });
    $('#iChain').innerHTML='<div class="fx">'+html+'</div>'+
      '<div class="fx-lg">'+
      '<span><i class="g1"></i>현재 위치(사내 보유 · 출발/복귀 지점)</span>'+
      '<span><i class="g2"></i>공정 완료 · 사내복귀</span>'+
      '<span><i class="g3"></i>반출중(외주 보유)</span>'+
      '<span><i class="g5"></i>사내 작업장 이동</span>'+
      '<span><i class="g4"></i>다음 공정</span></div>';
  }

    $('#infoBox').style.display=''; $('#iChain').style.display='';

          op.filter(o=>String(o.move_kind||'외주')==='사내').length+'</h5><div class="tbl-x">'+
        '<table class="grid"><thead><tr><th style="width:56px">구분</th>'+
        '<th style="width:80px">가공공정</th><th style="width:120px">이동처</th>'+
        '<th>LOT · 수량</th>'+
        '<th style="width:88px">출고일</th><th style="width:88px">납기</th><th style="width:60px">경과</th>'+
        '<th style="width:150px">수정 · 입고</th></tr></thead><tbody>'+
        op.map(o=>{const d=Math.round((new Date(TODAY)-new Date(o.sdate))/864e5);
          const late=o.edate&&o.edate<TODAY;
          const ink=String(o.move_kind||'외주')==='사내';
          return '<tr><td class="center"><span class="badge" style="background:'+
            (ink?'#fdf1e4;color:#8a5a12':'#e9f2fc;color:#1d568c')+'">'+(ink?'사내':'외주')+'</span></td>'+
          '<td class="center">'+esc(o.mp||'')+'</td><td>'+esc(o.vendor||'')+'</td>'+
          '<td>'+lotText(o)+'</td>'+
          '<td class="center">'+esc(o.sdate||'')+'</td>'+
          '<td class="center"'+(late?' style="color:#b23030;font-weight:700"':'')+'>'+esc(o.edate||'-')+'</td>'+
          '<td class="num">'+d+'일</td>'+
          '<td class="center" style="white-space:nowrap">'+
          '<button class="lr-go" data-ed="'+o.no+'" style="background:#fff;color:#1d568c;margin-right:4px">✎ 수정</button>'+
          '<button class="lr-go" data-in="'+o.no+'" style="background:#2f7d4d;border-color:#2f7d4d">📦 입고</button></td></tr>';
        }).join('')+'</tbody></table></div></div>'
      : '';
    $('#openBox').querySelectorAll('[data-in]').forEach(b=>
      b.addEventListener('click',()=>receive(b.dataset.in)));
    $('#openBox').querySelectorAll('[data-ed]').forEach(b=>
      b.addEventListener('click',()=>editOrder(b.dataset.ed)));
    /* 표준공정 · 다음 공정 기본값 */
    $('#fRoute').value=c.std?String(c.std.standard_process_no):'';
    fillMp($('#fRoute').value, c.rest[0]||'');
    $('#fKind').value='외주'; syncKind();
    $('#fVen').value=c.last.vendor||''; $('#fDept').value='';
    $('#fSdate').value=TODAY;
    const e=new Date(); e.setDate(e.getDate()+7); $('#fEdate').value=e.toISOString().slice(0,10);
    $('#fQuote').value='';
    const prev=ospOf(c.part).filter(o=>(o.map_part||o.mold_no))[0];
    $('#fMap').value=c.map_part||(prev?(prev.map_part||(MOLDS.find(x=>x.mold_no===prev.mold_no)||{}).part_no||''):'');
    syncMap();
    /* 출발지 : 미입고 반출건이 있으면 그 건에서 이관(자동), 없으면 사내 신규 반출.
       미입고 건이 2개 이상일 때만 선택이 필요하므로 그때만 노출한다. */
    $('#fFrom').innerHTML='<option value="">사내 → 외주 (신규 반출)</option>'+
      op.map(o=>'<option value="'+o.no+'">'+esc(o.mp||'')+' · '+esc(o.vendor||'')+
        ' 보유분 ('+esc(o.sdate||'')+' 반출)</option>').join('');
    $('#fFrom').value = op.length ? String(op[0].no) : '';
    showFrom(op.length>1); fromNote();
    /* 수량 : 첫 반출 수량을 기본값으로 유지 */
    const first=ospOf(c.part).slice().sort((a,b)=>(Number(a.no)||0)-(Number(b.no)||0))[0];
    const base=first
      ? (Array.isArray(first.lots)&&first.lots.length ? first.lots
         : (first.qty?[{lot:first.lot||c.part,qty:first.qty}]:null))
      : null;
    lotBody.innerHTML='';
    (base&&base.length?base:[{lot:c.part||'',qty:''}]).forEach(x=>lotRow(x.lot||c.part||'',x.qty));
    $('#mMsg').textContent=''; $('#mMsg').className='msg';
    /* 이미 사내입고 종결된 LOT : 사내입고 · 반출 등록 모두 잠근다 */
    const closed=!!c.recv;
    const rq=closed?Number(c.recv.qty)||0:0, rs2=closed?Number(c.recv.short_qty)||0:0;
    $('#mS').style.display=((CAN_S||CAN_E)&&!closed)?'':'none';
    $('#mTag').style.display='';
    $('#mRf').style.display='';
    $('#mInh').style.display=((CAN_S||CAN_E)&&c.std&&!c.rest.length&&!c.wip&&!c.moving&&!closed)?'':'none';
    $('#mInh').disabled=false;
    if(closed){
      $('#mMsg').className='msg';
      $('#mMsg').innerHTML='<span style="color:#1d5a35">✅ 사내입고 완료 · '+esc(c.recv.in_date||'')+
        ' · '+rq.toLocaleString()+(rs2?' (부족 '+rs2.toLocaleString()+')':'')+
        ' — 종결된 LOT이라 추가 반출·입고를 할 수 없습니다.</span>';
      setOutFold(false);
    }
    { const fh=$('#outFold'); if(fh) fh.style.display=closed?'none':''; }
    loadMoves(c.part);
    dim.classList.add('on'); mo.style.display='';
  }

  /* ── 신규등록 (진행목록에 없는 LOT 직접 등록) ── */
  /* ── JOB 번호 자동생성 : JOB-YYMMDD## (당일 일련번호, 중복 회피) ── */
  function genJob(){
    const d=new Date(), ymd=d.toISOString().slice(2,10).replace(/-/g,'');
    const used=new Set();
    ROWS.forEach(r=>{ if(r.job) used.add(String(r.job).toUpperCase()); });
    OSP.forEach(o=>{ if(o.job) used.add(String(o.job).toUpperCase()); });
    for(let i=1;i<=99;i++){
      const j='JOB-'+ymd+String(i).padStart(2,'0');
      if(!used.has(j)) return j;
    }
    return 'JOB-'+ymd+String(Date.now()%100).padStart(2,'0');
  }
  document.addEventListener('click',e=>{
    if(e.target&&e.target.id==='fJobGen'){
      const f=$('#fJob'); if(f.readOnly) return;
      f.value=genJob(); f.focus();
    }
  });

  function openNew(){
    if(!(CAN_S||CAN_E)) return KI.msg('❌ 등록 권한이 없습니다.');
    sel=null; NEW=true; mode('ins');
    $('#mTtl').textContent='진행등록 — 신규';
    /* 종결 LOT을 보고 난 뒤에도 입력폼이 숨겨진 채 열리지 않도록 복원 */

    $('#mMsg').textContent=''; $('#mMsg').className='msg';

    $('#infoBox').style.display='none'; $('#iChain').style.display='none';
    $('#openBox').innerHTML='';
    $('#fJob').value=''; $('#fJob').readOnly=false;
    const g2=$('#fJobGen'); if(g2) g2.style.display='';
    $('#fRoute').value=''; fillMp('',''); $('#fVen').value=''; $('#fDept').value='';
    $('#fKind').value='외주'; syncKind();
    $('#fSdate').value=TODAY;
    const e=new Date(); e.setDate(e.getDate()+7); $('#fEdate').value=e.toISOString().slice(0,10);
    $('#fQuote').value=''; $('#fMap').value=''; syncMap();
    $('#fFrom').innerHTML='<option value="">사내 → 외주 (신규 반출)</option>'; showFrom(false); fromNote();
    lotBody.innerHTML=''; lotRow('','');
    $('#mS').style.display='';
    $('#mTag').style.display='none'; $('#mInh').style.display='none'; $('#moveBox').innerHTML='';
    { const rf=$('#mRf'); if(rf) rf.style.display='none'; }
    dim.classList.add('on'); mo.style.display='';
    if(window.openOutForm) window.openOutForm();   /* 신규등록은 입력폼을 바로 펼침 */
    $('#fJob').focus();
  }

  /* ── 기존 반출건 수정 ── */
  function editOrder(no){
    const o=OSP.find(x=>String(x.no)===String(no)); if(!o) return;
    if(!(CAN_S||CAN_E)) return KI.msg('❌ 수정 권한이 없습니다.');
    editNo=o.no; NEW=false; mode('edit');
    $('#fJob').value=o.job||'';
    const g3=$('#fJobGen'); if(g3) g3.style.display='none';
    $('#fRoute').value=o.route_no||(sel&&sel.std?String(sel.std.standard_process_no):'');
    fillMp($('#fRoute').value,o.mp||'');
    $('#fKind').value=String(o.move_kind||'외주')==='사내'?'사내':'외주'; syncKind();
    if($('#fKind').value==='사내') $('#fDept').value=o.vendor||''; else $('#fVen').value=o.vendor||'';
    $('#fSdate').value=o.sdate||''; $('#fEdate').value=o.edate||'';
    $('#fQuote').value=o.quote==null?'':o.quote;
    $('#fMap').value=o.map_part||(MOLDS.find(x=>x.mold_no===o.mold_no)||{}).part_no||''; syncMap();
    const L=Array.isArray(o.lots)&&o.lots.length ? o.lots
          : (o.lot?String(o.lot).split(',').map(x=>({lot:x.trim(),qty:null})):[{lot:o.part,qty:o.qty}]);
    lotBody.innerHTML=''; L.forEach(x=>lotRow(x.lot,x.qty));
    if(!lotBody.children.length) lotRow(o.part||'','');
    $('#fFrom').value=''; showFrom(false); fromNote();
    $('#mMsg').className='msg'; $('#mMsg').textContent='✎ 반출번호 '+o.no+' 수정 중입니다.';
    if(window.openOutForm) window.openOutForm();   /* 수정도 입력폼을 바로 펼침 */
    mo.scrollTop=mo.scrollHeight;
  }
  function cancelEdit(){
    mode('ins'); editNo=null;
    if(sel) open(sel); else openNew();
  }
  $('#mEC').addEventListener('click',cancelEdit);

  /* 선택된 출발지를 안내문에 표시 (선택칸이 숨겨져 있어도 확인 가능) */
  function fromNote(){
    const box=$('#fromInfo'); if(!box) return;
    const v=$('#fFrom').value;
    if(!v){ box.innerHTML='📤 출발 <b>사내</b> — 신규 반출로 등록됩니다.'; return; }
    const o=OSP.find(x=>String(x.no)===String(v))||{};
    box.innerHTML='📤 출발 <b>'+esc(o.mp||'')+' · '+esc(o.vendor||'')+'</b> 보유분에서 이관'+
      (o.qty!=null?' <span style="color:#7b8794">(반출 '+Number(o.qty).toLocaleString()+')</span>':'');
  }

  /* 출발 보유분 선택칸 노출 제어 — 미입고 건이 2개 이상일 때만 필요 */
  function showFrom(on){
    const l=$('#fFromL'), sl=$('#fFrom');
    if(!l||!sl) return;
    l.style.display = on?'':'none';
    sl.style.display = on?'':'none';
  }

  /* 품번(제품번호) → 기준정보 › 금형정보 기준으로 금형제번 자동 매칭 */
  const moldOf = v => MOLDS.find(x=>String(x.part_no||'')===String(v));
  function syncMap(){
    const v=$('#fMap').value.trim();
    const m=moldOf(v);
    $('#mapInfo').innerHTML = m ? '🧩 품번 <b>'+esc(m.part_no)+'</b> · 금형제번 <b>'+esc(m.mold_no||'-')+
        '</b>'+(m.asset_owner?' · 자산처 '+esc(m.asset_owner):'')
      : (v?'<span style="color:#b05c12">⚠ 금형정보에 등록되지 않은 품번입니다.</span>':'');
  }
  $('#fMap').addEventListener('input',syncMap);
  $('#fFrom').addEventListener('change',fromNote);

  /* ── 반출 LOT · 수량 (다건) ── */
  const lotBody=$('#lotBody');
  function lotRow(lot,qty){
    const t=el('tr');
    t.innerHTML='<td class="center no"></td>'+
      '<td><input type="text" class="lLot" value="'+esc(lot||'')+'" placeholder="LOT 번호"></td>'+
      '<td><input type="text" class="lQty" value="'+(qty==null?'':esc(String(qty)))+
        '" placeholder="숫자만" style="text-align:right"></td>'+
      '<td class="center"><button class="del" title="행 삭제">✕</button></td>';
    t.querySelector('.del').addEventListener('click',()=>{ t.remove(); lotSync(); });
    t.querySelectorAll('input').forEach(i=>i.addEventListener('input',lotSync));
    lotBody.appendChild(t); lotSync(); return t;
  }
  function lotList(){
    return [...lotBody.querySelectorAll('tr')].map(t=>({
      lot:t.querySelector('.lLot').value.trim(),
      qty:Number(t.querySelector('.lQty').value.replace(/[^0-9.]/g,''))||0
    })).filter(x=>x.lot||x.qty);
  }
  function lotSync(){
    [...lotBody.querySelectorAll('tr')].forEach((t,i)=>t.querySelector('.no').textContent=i+1);
    const L=lotList(), sum=L.reduce((a,b)=>a+b.qty,0);
    $('#fSum').textContent='LOT '+L.length+'건 · 합계 '+sum.toLocaleString();
    $('#fQty').value=sum.toLocaleString();
  }
  const lotText=o=>{
    const L=Array.isArray(o.lots)?o.lots:(o.lot?[{lot:o.lot,qty:o.qty}]:[]);
    if(!L.length) return '-';
    return L.map(x=>esc(x.lot)+(x.qty?' <b>'+Number(x.qty).toLocaleString()+'</b>':'')).join(', ');
  };
  $('#fAdd').addEventListener('click',()=>lotRow('',''));

  async function save(){
    const m=$('#mMsg');
    if(!sel && !NEW && !editNo) return;
    if(sel && sel.recv && !editNo){
      m.className='msg err';
      m.textContent='❌ 이미 사내입고 종결된 LOT입니다. 추가 반출을 등록할 수 없습니다.';
      return;
    }
    /* 접혀 있으면 먼저 펼쳐 입력 내용을 보여준다 */
    const fd=$('#outFold');
    if(fd && !fd.classList.contains('open')){
      setOutFold(true);
      m.className='msg'; m.textContent='반출 정보를 확인한 뒤 다시 [반출 등록]을 누르세요.';
      fd.scrollIntoView({block:'nearest'});
      return;
    }
    const lots=lotList();
    if(!lots.length || lots.some(x=>!x.lot)){
      m.className='msg err'; m.textContent='반출 LOT 번호를 입력하세요.'; return; }
    const part = sel ? sel.part : lots[0].lot;   /* LOT 표의 첫 행이 대표 LOT */
    if(!$('#fRoute').value && RT.length){
      m.className='msg err'; m.textContent='표준공정을 선택하세요.'; return; }
    const mp=$('#fMp').value;
    const kind=$('#fKind').value||'외주';
    const ven=(kind==='사내')?$('#fDept').value.trim():$('#fVen').value;
    if(!mp){ m.className='msg err'; m.textContent='가공공정을 선택하세요.'; return; }
    if(!ven){ m.className='msg err';

        }else{

  async function inhouse(c){
    if(!(CAN_S||CAN_E)) return KI.msg('❌ 등록 권한이 없습니다.');
    const B=$('#mInh'); if(B&&B.disabled) return;
    /* 이미 종결된 LOT은 중복 등록하지 않는다 (화면이 오래되어 버튼이 남아 있는 경우 방어) */
    if(c.recv){
      if(B){ B.disabled=true; B.style.display='none'; }
      return alert('이미 사내입고 종결된 LOT입니다.\n입고일 '+(c.recv.in_date||'')+
                   ' · 수량 '+(Number(c.recv.qty)||0).toLocaleString());
    }
    if(c.rest.length) return alert('아직 남은 공정이 있습니다 ('+c.rest.join(' · ')+').');
    if(c.wip||c.moving) return alert('외주 반출중인 건이 있어 종결할 수 없습니다. 먼저 입고 처리하세요.');
    const last=ospOf(c.part).slice().sort((a,b)=>(Number(b.no)||0)-(Number(a.no)||0))[0]||{};
    const baseQ=Number(last.qty)||0;
    const inS=prompt('['+c.part+'] 사내입고 수량을 입력하세요'+(baseQ?' (최종 반출 '+baseQ.toLocaleString()+')':''), String(baseQ||''));
    if(inS===null)return;
    const inQ=Number(String(inS).replace(/[^0-9.]/g,''))||0;
    const short=baseQ?Math.max(baseQ-inQ,0):0;
    let reason='';
    if(short>0){ reason=prompt('부족 '+short.toLocaleString()+' — 사유를 입력하세요 (불량 등)','불량')||''; }
    const rmk=prompt('특기사항 (없으면 비워두세요)','')||'';
    if(!confirm('['+c.part+'] 사내입고로 LOT을 종결하시겠습니까?\n\n'+
        '입고수량 : '+inQ.toLocaleString()+(short?'  (부족 '+short.toLocaleString()+')':'')+'\n'+
        '입고일 : '+TODAY+'\n\n'+

      await KI.upsert(TBL.lotReceipt+'?on_conflict=part',[{part:c.part, job:c.job||null, in_date:TODAY,
        qty:inQ||null, short_qty:short, reason:reason||null,
        worker:(KI.me()||{}).emp_name||'', remark:rmk||null}]);

        out_qty:baseQ||null, in_qty:inQ||null, short_qty:short, reason:reason||null,
        remark:rmkJoin(flow(node(last.mp,last.vendor),'사내입고 종결',inQ)+
                       (short?' (반출 '+baseQ.toLocaleString()+' · 부족 '+short.toLocaleString()+')':''), rmk),
        worker:(KI.me()||{}).emp_name||'', source:'수동'}]);

  /* ── 현장 기록 (QR 입출고 · 특기사항) ── */
  /* 이동일자 오름차순으로 보유처를 추적해 각 건의 출고처 → 입고처를 산출 */
  function flowMap(mv){
    const asc=mv.slice().sort((a,b)=>String(a.move_date||'').localeCompare(String(b.move_date||''))
      ||(Number(a.move_id)||0)-(Number(b.move_id)||0));
    const map={}; let loc='사내'; const prev={};
    asc.forEach(v=>{
      const here=node(v.mp,v.vendor);
      if(v.io==='출고'){        map[v.move_id]={f:loc, t:here, q:v.out_qty}; prev[here]=loc; loc=here; }
      else if(v.io==='도착'){   map[v.move_id]={f:prev[here]||'사내', t:here, q:v.in_qty}; loc=here; }
      else if(v.io==='입고'){   map[v.move_id]={f:here, t:'사내 복귀', q:v.in_qty}; loc='사내'; }
      else if(v.io==='사내입고'){map[v.move_id]={f:(v.mp||v.vendor)?here:loc, t:'사내입고 (종결)', q:v.in_qty}; loc='사내'; }
      else                      map[v.move_id]={f:'', t:'', q:null};
    });
    return map;
  }

          .sort((a,b)=>(Number(b.no)||0)-(Number(a.no)||0))[0]; return o?(o.vendor||''):''; };
      return ['사내'+(c.recv?'✓':'')].concat((c.std.steps||[]).map(mp=>{

  async function load(){
    const [rows,osp,ven,proc,rt,molds,rcpt,mvin,mvst]=await Promise.all([
      KI.get(OBJ.lotProg+'?select=*&order=no.asc'),
      KI.get(OBJ.ospOrder+'?select=*&order=no.desc'),
      KI.get(OBJ.vendor+'?select=vendor_name&order=vendor_name.asc'),
      KI.get(OBJ.process+'?select=process_code,process_name&order=sort_order.asc'),
      KI.get(OBJ.stdRoute+'?select=*'),
      KI.get(OBJ.moldSpec+'?select=mold_no,part_no,asset_owner&order=mold_no.asc'),
      KI.get(OBJ.lotReceipt+'?select=part,in_date,qty,short_qty').catch(()=>[]),
      KI.get(OBJ.lotMove+'?select=part,move_date,in_qty,short_qty&io=eq.'+encodeURIComponent('사내입고')).catch(()=>[]),
      KI.get(OBJ.lotMove+'?select=part,io,mp,vendor,move_date&io=in.('+
        encodeURIComponent('"도착","입고"')+')&order=move_date.asc').catch(()=>[])
    ]);
    ROWS=rows; OSP=osp; VEN=ven; PROC=proc; RT=rt; MOLDS=molds; RCPT=rcpt;
    MVIN=(mvin||[]).map(v=>({part:v.part,in_date:v.move_date,qty:v.in_qty,short_qty:v.short_qty}));
    MVST={}; (mvst||[]).forEach(v=>{ const k=String(v.part||''); if(!k||!v.mp) return;
      (MVST[k]=MVST[k]||[]).push({mp:v.mp, vendor:v.vendor||'', date:v.move_date||''}); });
    /* 진행이력이 아직 없는 반출건(입고 전)도 목록에 노출 */
    const have=new Set(ROWS.map(r=>String(r.part||'')));
    OSP.forEach(o=>{ const k=String(o.part||'');
      if(!k||have.has(k)) return; have.add(k);
      ROWS=ROWS.concat([{no:null,job:o.job,proc:o.proc,part:o.part,steps:[],
        map_part:o.map_part||'',route_no:o.route_no||''}]); });
    const rs=$('#fRoute'), vn=$('#fVen'), mp=$('#fMp'), rv=rs.value, mv=mp.value, vv=vn.value;
    rs.innerHTML='<option value="">선택</option>'+RT.map(r=>'<option value="'+esc(String(r.standard_process_no))+'">'+
      esc(r.standard_process_name||'')+' ('+((r.steps||[]).length)+'단계)</option>').join('');
    vn.innerHTML='<option value="">선택</option>'+VEN.map(v=>'<option>'+esc(v.vendor_name)+'</option>').join('');
    /* 사내 작업장 후보 : 기존 사내 이동 기록에서 자동 수집 */
    const deps=[...new Set(OSP.filter(o=>String(o.move_kind||'')==='사내')
      .map(o=>String(o.vendor||'').trim()).filter(Boolean))].sort();
    const dd=$('#dlDept'); if(dd) dd.innerHTML=deps.map(d=>'<option>'+esc(d)+'</option>').join('');
    rs.value=rv; vn.value=vv; fillMp(rv,mv);
    dl.innerHTML=MOLDS.filter(m=>m.part_no).map(m=>'<option value="'+esc(m.part_no)+'">'+
      esc(m.mold_no||'')+(m.asset_owner?' · '+esc(m.asset_owner):'')+'</option>').join('');
    draw();
    KI.msg('LOT '+ROWS.length+'건 · 외주 반출중 '+OSP.filter(o=>o.sdate&&!o.idate).length+'건');
  }
  try{ await load(); }
  catch(e){ tbody.innerHTML='<tr><td colspan="9" class="center" style="height:60px;color:#b0442f">❌ '+
    KI.esc(e.message)+'</td></tr>'; KI.msg('❌ '+e.message); }
})();
</script>
<script src="ki_demo.js"></script>
<script src="ki_demo_data.js"></script>
<script>KIDemo.attach('lot-route',{jobBtn:'fJobGen',partCol:2});</script>
