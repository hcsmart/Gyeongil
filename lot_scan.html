<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR(수동, 수정) — SCM Smart</title>
<link rel="stylesheet" href="ki_style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 'Malgun Gothic','맑은 고딕',sans-serif;background:#eef1f4;color:#1d2833;
  height:auto;overflow:auto;padding-top:calc(var(--top1,42px) + 4px);padding-bottom:40px}
.top{background:linear-gradient(#3d7ab5,#2e6497);color:#fff;padding:12px 14px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.top small{margin-left:auto;font-weight:400;font-size:11px;opacity:.85}
.wrap{max-width:560px;margin:0 auto;padding:10px}
.card{background:#fff;border:1px solid #c6d0da;margin-bottom:10px}
.card h3{font-size:13px;background:#f0f4f8;border-bottom:1px solid #d9e1e8;padding:8px 11px;color:#2e4a63}
.card .bd{padding:10px 11px}
.kv{display:grid;grid-template-columns:82px 1fr;gap:4px 8px;font-size:13px}
.kv b{color:#526171;font-weight:700}
.chain{margin-top:8px;line-height:2.1;font-size:12px}
.chain span{padding:2px 8px;border-radius:2px;background:#eef1f4;color:#7b8794;white-space:nowrap}
.chain .done{background:#2f7d4d;color:#fff;font-weight:700}
.chain .wip{background:#2e77bd;color:#fff;font-weight:700}
.chain .next{background:#fff;border:1px dashed #2e77bd;color:#1d568c;font-weight:700}
.chain .inw{background:#e8862e;color:#fff;font-weight:700}
.row{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:12px;font-weight:700;color:#526171}
@media(max-width:420px){.row{grid-template-columns:1fr;gap:3px;margin-bottom:10px}
  .row label{font-size:12.5px}}
input,select,textarea{width:100%;border:1px solid #aeb9c4;padding:8px;font:inherit;font-size:14px}
textarea{min-height:64px}
.bt{width:100%;height:44px;border:0;font-size:15px;font-weight:800;color:#fff;cursor:pointer;margin-top:4px}
.bt.in{background:#2f7d4d}.bt.out{background:#2e77bd}.bt.home{background:#7b3fa0}.bt.memo{background:#526171}
/* 탭 : 폭을 균등 분할하고 카드 밖으로 넘치지 않게 (모바일 터치 44px 이상) */
.qtab{display:flex;width:100%;height:auto;padding:0;margin:0;background:#eef2f6;
  border:0;border-bottom:2px solid #2e6497;overflow:hidden}
.qtab button{flex:1 1 0;min-width:0;height:46px;padding:0 2px;border:0;border-right:1px solid #dde4ea;
  background:#eef2f6;color:#526171;font-weight:700;font-size:13px;line-height:1.2;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-tap-highlight-color:transparent}
.qtab button:last-child{border-right:0}
.qtab button:active{background:#dde6ee}
.qtab button.on{background:#2e6497;color:#fff;box-shadow:inset 0 -3px 0 #1b4670}
.qtab button i{font-style:normal;font-size:14px;flex:none}
.qtab button span{overflow:hidden;text-overflow:ellipsis}
@media(max-width:400px){.qtab button{font-size:12px;gap:2px}.qtab button i{font-size:13px}}
@media(max-width:340px){.qtab button i{display:none}}
.pane{display:none}.pane.on{display:block}
.short{color:#b23030;font-weight:800;font-size:12px}
.part{color:#1d568c;font-weight:800;font-size:12px}
.msg{padding:9px 12px;font-weight:700;font-size:13px}
.msg.ok{color:#15803d}.msg.err{color:#b23030}
.hist td{border-bottom:1px solid #eef1f4;padding:5px 4px;font-size:12px}
.badge{display:inline-block;padding:1px 7px;border:0;border-radius:2px;font-size:11px;font-weight:700}
.b-in{background:#e2f0e6;color:#15803d}.b-out{background:#e9f2fc;color:#1d568c}.b-etc{background:#f1f3f5;color:#526171}
.pk{border:1px solid #d6dde4;border-left:4px solid #2e77bd;padding:9px 11px;margin-bottom:8px;background:#fbfcfd;cursor:pointer}
.pk:active{background:#eef5fc}
.pk b{color:#22537f;font-size:15px}
.dnote{margin:-2px 0 9px 100px;padding:8px 10px;border-radius:4px;font-size:12.5px;font-weight:700;line-height:1.5}
.dnote.home{background:#eef7f0;border:1px solid #a8d6ba;color:#1d5a35}
.dnote.ven{background:#e9f2fc;border:1px solid #b6d3ee;color:#1d568c}
.dnote.dup{background:#fdf3e7;border:1px solid #e6c48f;color:#8a5a12}
.bt[disabled]{opacity:.55;cursor:not-allowed}
@media(max-width:520px){.dnote{margin-left:0}}
.pk small{display:block;color:#526171;margin-top:2px}
</style>
<script src="ki_config.js"></script>
<script src="ki_core.js"></script>
</head>
<body>
<div class="top">⌨ QR(수동, 수정) <small id="who"></small></div>
<div class="wrap" id="wrap">불러오는 중...</div>
<script>
/* QR 스캔 → 미로그인 시 index.html 로 튕기며 ?lot= 이 사라지므로 미리 저장 */
try{
  const _l=new URLSearchParams(location.search).get('lot');
  if(_l) localStorage.setItem('ki_scan_lot',_l);
}catch(e){}

(async function(){
  if(!await KI.guard('lot-scan'))return;
  document.body.classList.add('scanpage');
  KI.chrome('lot-scan');                 /* 상단 메뉴바 표시 */
  const $=KI.$, el=KI.el, esc=KI.esc;
  const TODAY=new Date().toISOString().slice(0,10);
  const me=(KI.me()||{});
  $('#who').textContent=(me.emp_name||'')+(me.dept?' · '+me.dept:'');
  const wrap=$('#wrap');
  let PART=new URLSearchParams(location.search).get('lot')||'';
  if(!PART){ try{ PART=localStorage.getItem('ki_scan_lot')||''; }catch(e){} 
    if(PART) history.replaceState(null,'','?lot='+encodeURIComponent(PART)); }
  let PROG=null, OSP=[], RT=null, STEPS=[], SEEN=new Set(), RCPT=null, MOVES=[], ALLMV=[], PROC=[], VEN=[];
  const num=v=>Number(v)||0;

  /* 반출건 잔량 = 출고수량 − 이후 이관(부분출고)된 수량 합계 */
  const movedOf = (no,mv)=>(mv||ALLMV).filter(m=>m.io==='출고'&&String(m.osp_no||'')===String(no))
                    .reduce((a,b)=>a+num(b.out_qty),0);
  const arrQtyOf = (no,mv)=>{ const a=(mv||ALLMV).filter(m=>(m.io==='도착'||m.io==='입고')&&
                       String(m.osp_no||'')===String(no)&&m.in_qty!=null)[0];
                     return a?num(a.in_qty):null; };
  const remainOf = (o,mv)=>{ const a=arrQtyOf(o.no,mv);
                     return Math.max((a==null?num(o.qty):a)-movedOf(o.no,mv),0); };
  const arrivedOf = (o,mv)=>(mv||ALLMV).find(m=>(m.io==='도착'||m.io==='입고')&&String(m.osp_no||'')===String(o.no))||null;

  /* ── LOT 미지정 : 직접 입력 + 미결(입고대기·부분출고 잔량) LOT 불러오기 ── */
  async function boot(){
    if(PART){ load(); return; }
    wrap.innerHTML='<div class="card"><h3>LOT 선택 — 이동표가 없으면 LOT · JOB 번호로 검색</h3><div class="bd">'+
      '<div class="row"><label>LOT · JOB</label><input id="qLot" placeholder="LOT 번호 또는 JOB 번호"></div>'+
      '<button class="bt out" id="qGo">조회</button>'+
      '<div id="qHit" style="margin-top:8px"></div></div></div>'+
      '<div class="card" id="mineCard" style="display:none"><h3 id="mineTtl">🏭 우리 업체 LOT</h3><div class="bd" id="mineList"></div></div>'+
      '<div class="card"><h3>📋 미결 LOT — 입고대기 · 부분출고 잔량</h3><div class="bd" id="openList">불러오는 중...</div></div>';
    const pick=v=>{ PART=v; try{ localStorage.setItem('ki_scan_lot',v); }catch(e){}
      history.replaceState(null,'','?lot='+encodeURIComponent(PART)); load(); };
    $('#qGo').addEventListener('click',async()=>{
      const v=$('#qLot').value.trim(); if(!v)return;
      const hit=$('#qHit'); hit.textContent='검색 중...';
      try{
        const rows=await KI.get(OBJ.ospOrder+'?select=no,part,job,mp,vendor,sdate,idate,qty'+
          '&or=(part.eq.'+encodeURIComponent(v)+',job.eq.'+encodeURIComponent(v)+')'+
          '&order=no.desc&limit=50');
        const parts=[...new Set(rows.map(r=>String(r.part||'')).filter(Boolean))];
        if(parts.length<=1){ pick(parts[0]||v); return; }   /* 0건이면 LOT으로 간주해 그대로 조회 */
        hit.innerHTML='<div style="font-size:12px;color:#526171;margin-bottom:4px">JOB <b>'+esc(v)+
          '</b> 에 여러 LOT이 있습니다 — 선택하세요.</div>'+
          parts.map(pt=>{ const r=rows.find(x=>String(x.part)===pt)||{};
            return '<div class="pk" data-lot="'+esc(pt)+'"><b>'+esc(pt)+'</b>'+
              '<small>'+esc(r.mp||'')+' · '+esc(r.vendor||'')+' · '+esc(r.sdate||'')+
              (r.idate?'':' <span class="part">(미결)</span>')+'</small></div>'; }).join('');
        hit.querySelectorAll('.pk').forEach(d=>d.addEventListener('click',()=>pick(d.dataset.lot)));
      }catch(e){ hit.innerHTML='<span class="short">❌ '+esc(e.message)+'</span>'; }
    });
    $('#qLot').addEventListener('keydown',e=>{ if(e.key==='Enter')$('#qGo').click(); });
    try{
      const [open,mv,ven]=await Promise.all([
        KI.get(OBJ.ospOrder+'?select=no,part,job,mp,vendor,sdate,edate,qty&idate=is.null&sdate=not.is.null&order=sdate.desc&limit=100'),
        KI.get(OBJ.lotMove+'?select=osp_no,io,out_qty&osp_no=not.is.null&limit=1000').catch(()=>[]),
        KI.get(OBJ.vendor+'?select=vendor_name').catch(()=>[])
      ]);
      /* 계정 소속(dept · user_group · factory)이 외주업체명과 일치하면 업체 모드 */
      const names=ven.map(v=>v.vendor_name);
      const MYVEN=[me.dept,me.user_group,me.factory].find(x=>x&&names.includes(x))||null;
      if(MYVEN){
        const mine=open.filter(o=>String(o.vendor||'')===MYVEN);
        $('#mineCard').style.display='';
        $('#mineTtl').textContent='🏭 '+MYVEN+' — 도착 예정 · 작업중 LOT ('+mine.length+'건)';
        $('#mineList').innerHTML = mine.length ? mine.map(o=>{
            const rem=remainOf(o,mv.filter(m=>m.io==='출고')), part=rem<num(o.qty);
            const arr=arrivedOf(o,mv);
            return '<div class="pk" data-lot="'+esc(o.part||'')+'" style="border-left-color:'+(arr?'#2f7d4d':'#b06a12')+'">'+
              '<b>'+esc(o.part||'')+'</b>'+(o.job?' <small style="display:inline;color:#7b8794">JOB '+esc(o.job)+'</small>':'')+
              '<small>'+esc(o.mp||'')+' · '+esc(o.sdate||'')+' 출고 '+num(o.qty).toLocaleString()+
              ' — '+(arr?'<span style="color:#15803d;font-weight:700">작업중 (도착✓ · 출고 대기)</span>'
                       :'<span style="color:#b06a12;font-weight:700">도착 예정 (도착확인 필요)</span>')+
              (part?' · <span class="part">잔량 '+rem.toLocaleString()+'</span>':'')+'</small></div>';
          }).join('')
          : '<span style="color:#8894a0">우리 업체로 배정된 미결 LOT이 없습니다.</span>';
        $('#mineList').querySelectorAll('.pk').forEach(d=>d.addEventListener('click',()=>pick(d.dataset.lot)));
      }
      const box=$('#openList');
      if(!open.length){ box.innerHTML='<span style="color:#8894a0">미결 반출건이 없습니다.</span>'; return; }
      box.innerHTML=open.map(o=>{
        const rem=remainOf(o,mv.filter(m=>m.io==='출고')), part=rem<num(o.qty);
        const arr=arrivedOf(o,mv);
        return '<div class="pk" data-lot="'+esc(o.part||'')+'"><b>'+esc(o.part||'')+'</b>'+
          (o.job?' <small style="display:inline;color:#7b8794">JOB '+esc(o.job)+'</small>':'')+
          '<small>'+esc(o.mp||'')+' · '+esc(o.vendor||'')+' · '+esc(o.sdate||'')+' 출고 '+
          num(o.qty).toLocaleString()+(arr?' · <span style="color:#15803d;font-weight:700">도착✓</span>':'')+
          (part?' — <span class="part">잔량 '+rem.toLocaleString()+' (부분출고)</span>':'')+'</small></div>';
      }).join('');
      box.querySelectorAll('.pk').forEach(d=>d.addEventListener('click',()=>{
        PART=d.dataset.lot; history.replaceState(null,'','?lot='+encodeURIComponent(PART)); load(); }));
    }catch(e){ $('#openList').textContent='❌ '+e.message; }
  }

  async function load(){
    wrap.innerHTML='불러오는 중...';
    const [prog,osp,rts,rcpt,mvAll,proc,ven]=await Promise.all([
      KI.get(OBJ.lotProg+'?select=*&part=eq.'+encodeURIComponent(PART)+'&order=no.asc&limit=1'),
      KI.get(OBJ.ospOrder+'?select=*&part=eq.'+encodeURIComponent(PART)+'&order=no.asc'),
      KI.get(OBJ.stdRoute+'?select=*'),
      KI.get(OBJ.lotReceipt+'?select=*&part=eq.'+encodeURIComponent(PART)+'&limit=1').catch(()=>[]),
      KI.get(OBJ.lotMove+'?select=*&part=eq.'+encodeURIComponent(PART)+'&order=created_at.desc&limit=500').catch(()=>[]),
      KI.get(OBJ.process+'?select=process_code,process_name&order=sort_order.asc').catch(()=>[]),
      KI.get(OBJ.vendor+'?select=vendor_name&order=vendor_name.asc').catch(()=>[])
    ]);
    PROG=prog[0]||null; OSP=osp; RCPT=rcpt[0]||null; ALLMV=mvAll; MOVES=mvAll.slice(0,10); PROC=proc; VEN=ven;
    const last=OSP[OSP.length-1]||{};
    RT = rts.find(x=>String(x.standard_process_no)===String((PROG||{}).route_no||last.route_no||''));
    if(!RT){
      let best=null;
      rts.forEach(r=>{ const sd=r.steps||[]; const seq=(PROG&&PROG.steps||[]).map(s=>s.mp);
        const hit=sd.filter(x=>seq.includes(x)).length;
        if(hit&&(!best||hit>best.hit)) best={rt:r,hit:hit}; });
      RT=best?best.rt:null;
    }
    STEPS=RT&&Array.isArray(RT.steps)?RT.steps:[];
    SEEN=new Set((PROG&&Array.isArray(PROG.steps)?PROG.steps:[]).map(s=>s.mp));
    draw();
  }
  const pName=c=>{const p=PROC.find(x=>x.process_code===c);return p?p.process_name:''};

  function draw(){
    /* 사내 작업장 이동 건은 제품이 경일FB 안에 있으므로 협력사 QR 대상이 아니다
       (사내 이동의 입고 처리는 PC 진행등록에서) */
    const openAll=OSP.filter(o=>o.sdate&&!o.idate);
    const openIn =openAll.filter(o=>String(o.move_kind||'외주')==='사내');
    const open   =openAll.filter(o=>String(o.move_kind||'외주')!=='사내');
    const rest=STEPS.filter(x=>!SEEN.has(x)&&!openAll.some(o=>o.mp===x));
    const doneAll=STEPS.length&&!rest.length&&!openAll.length;
    const last=OSP[OSP.length-1]||{};

    wrap.innerHTML=
    '<div class="card"><h3>📦 LOT 정보 '+
      '<a href="lot_scan.html" id="otherLot" style="float:right;font-size:11px;color:#2e77bd">다른 LOT ›</a>'+
      '<a href="lot_tag.html?lot='+encodeURIComponent(PART)+'" target="_blank" style="float:right;font-size:11px;color:#7b8794;margin-right:12px">🖨 이동표 재발행(분실 시)</a></h3><div class="bd">'+
      '<div class="kv"><b>LOT</b><span style="font-weight:800;font-size:16px;color:#22537f">'+esc(PART)+'</span>'+
      '<b>JOB</b><span>'+esc((PROG||{}).job||last.job||'-')+'</span>'+
      '<b>표준공정</b><span>'+(RT?esc(RT.standard_process_name):'(미매칭)')+'</span>'+
      '<b>총수량</b><span>'+(last.qty!=null?num(last.qty).toLocaleString():'-')+'</span>'+
      '<b>사내입고</b><span>'+(RCPT?'✅ '+esc(RCPT.in_date)+' · '+num(RCPT.qty).toLocaleString():'미입고')+'</span></div>'+
      (STEPS.length?'<div class="chain">'+STEPS.map(x=>{
        /* 진행중(외주 보유) 이 완료보다 우선 — 도착확인만 된 공정은 아직 진행중이다 */
        const w=open.some(o=>o.mp===x), iw=(!w&&openIn.some(o=>o.mp===x));
        const d=(SEEN.has(x)&&!w&&!iw), n=(!d&&!w&&!iw&&x===rest[0]);
        return '<span class="'+(d?'done':w?'wip':iw?'inw':n?'next':'')+'">'+esc(x)+(pName(x)?' '+esc(pName(x)):'')+
               (d?' ✓':w?' (진행중)':iw?' (사내 작업중)':n?' (다음)':'')+'</span>';
      }).join(' → ')+'</div>':'')+
    '</div></div>'+

    (openIn.length?'<div class="card" style="padding:10px 12px"><div class="dnote home" style="margin:0">'+
      '🏭 <b>사내 작업장 이동중</b> — '+esc(openIn.map(o=>(o.mp||'')+' · '+(o.vendor||'')).join(', '))+
      '<br>경일FB 내부 이동이라 이 화면에서 처리할 항목이 아닙니다.</div></div>':'')+
    '<div class="card"><div class="qtab">'+
      '<button data-t="in" class="on"><i>📥</i><span>도착확인</span></button>'+
      '<button data-t="out"><i>📤</i><span>출고</span></button>'+
      (doneAll&&!RCPT?'<button data-t="home"><i>🏭</i><span>사내입고</span></button>':'')+
      '<button data-t="memo"><i>📝</i><span>특기사항</span></button></div>'+

      /* ── 도착확인 : 외주업체가 LOT 수령 시 리딩 — 업체 · 수량 확인 기록 ── */
      '<div class="pane on" data-p="in"><div class="bd">'+
      (open.length? '<div class="row"><label>대상 반출건</label><select id="inNo">'+
          open.map(o=>{const rem=remainOf(o), arr=arrivedOf(o);
            return '<option value="'+o.no+'">'+esc(o.mp)+' · '+esc(o.vendor||'')+' ('+esc(o.sdate)+' 출고 '+
              num(o.qty).toLocaleString()+(rem<num(o.qty)?' · 잔량 '+rem.toLocaleString():'')+')'+
              (arr?' — 도착✓':'')+'</option>';}).join('')+'</select></div>'+
        '<div class="row"><label>확인 업체</label><select id="inVen">'+
          VEN.map(v=>'<option>'+esc(v.vendor_name)+'</option>').join('')+'</select></div>'+
        '<div class="row"><label>도착일</label><input type="date" id="inDate" value="'+TODAY+'"></div>'+
        '<div class="row"><label>입고수량</label><input type="number" id="inQty" inputmode="numeric"></div>'+
        '<div id="inShort" class="short" style="margin:-4px 0 8px 100px"></div>'+
        '<div class="row" id="inRsnRow" style="display:none"><label>부족사유</label><input id="inRsn" placeholder="불량 · 파손 등 (선택)"></div>'+
        '<div class="row"><label>특기사항</label><textarea id="inRmk" placeholder="현장 특기사항을 기록하세요"></textarea></div>'+
        '<div class="dnote" id="inCloseNote" style="display:none;margin:-4px 0 8px 100px"></div>'+
        '<div class="dnote dup" id="inDup" style="display:none"></div>'+
        '<button class="bt in" id="btIn">📥 도착확인 등록</button>'
        :'<div style="color:#8894a0;padding:8px 0">도착확인 대기 중인 반출건이 없습니다.</div>')+
      '</div></div>'+

      /* ── 출고 : 신규 반출 또는 미결 반출건에서 이관(부분출고 지원) ── */
      '<div class="pane" data-p="out"><div class="bd">'+
        '<div class="row"><label>출발</label><select id="outFrom">'+
          /* 제품이 외주처에 있으면(미결 반출건 존재) 사내 출발 출고는 성립하지 않는다 */
          '<option value=""'+(open.length?' disabled':'')+'>신규 출고 (사내 출발)'+
            (open.length?' — 사내 보유분 없음':'')+'</option>'+
          open.map(o=>{const rem=remainOf(o);
            return '<option value="'+o.no+'"'+(rem<=0?' disabled':'')+'>'+esc(o.mp)+' · '+esc(o.vendor||'')+
              ' 보유분 (잔량 '+rem.toLocaleString()+')'+(rem<=0?' — 출고 불가':'')+'</option>';}).join('')+'</select></div>'+
        /* 작업 완료품은 대부분 경일FB로 복귀 → 기본값을 사내입고로 둔다 */
        '<div class="row" id="outDestRow"><label>보내는 곳</label><select id="outDest" disabled>'+
          '<option value="home">🏭 경일FB 사내입고 (고정)</option>'+
          '<option value="ven" disabled>🚚 다음 외주처 직송 (사용 안 함)</option></select></div>'+
        '<div class="dnote" id="outDNote"></div>'+
        '<div class="row" id="outMpRow"><label>다음 공정</label><select id="outMp">'+
          (STEPS.length
            ? STEPS.map(x=>'<option value="'+esc(x)+'"'+(x===rest[0]?' selected':'')+'>'+esc(x)+
                (pName(x)?' · '+esc(pName(x)):'')+(SEEN.has(x)?' ✓완료':'')+'</option>').join('')
            : PROC.map(p=>'<option value="'+esc(p.process_code)+'">'+esc(p.process_code)+' · '+esc(p.process_name)+'</option>').join(''))+
        '</select></div>'+
        '<div class="row" id="outVenRow"><label>받는 외주처</label><select id="outVen"><option value="">선택</option>'+
          VEN.map(v=>'<option>'+esc(v.vendor_name)+'</option>').join('')+'</select></div>'+
        '<div class="row"><label id="outDateL">출고일</label><input type="date" id="outDate" value="'+TODAY+'"></div>'+
        '<div class="row"><label id="outQtyL">출고수량</label><input type="number" id="outQty" inputmode="numeric"></div>'+
        '<div id="outInfo" style="margin:-4px 0 8px 100px;font-size:12px"></div>'+
        '<div class="row" id="outCloseRow" style="display:none"><label>마감</label>'+
          '<label style="font-weight:400;font-size:13px"><input type="checkbox" id="outClose" '+
          'style="width:auto;margin-right:6px">잔여 없음 — 부족으로 반출건 마감</label></div>'+
        '<div class="row"><label>특기사항</label><textarea id="outRmk" placeholder="부분출고 · 부족 사유 등 (선택)"></textarea></div>'+
        '<div class="dnote dup" id="outWhy" style="display:none"></div>'+
        '<button class="bt out" id="btOut">📤 출고(반출) 등록</button>'+
      '</div></div>'+

      /* ── 사내입고 ── */
      (doneAll&&!RCPT?'<div class="pane" data-p="home"><div class="bd">'+
        '<div class="row"><label>입고일</label><input type="date" id="hDate" value="'+TODAY+'"></div>'+
        '<div class="row"><label>입고수량</label><input type="number" id="hQty" inputmode="numeric" value="'+
          ((OSP[0]||{}).qty!=null?num(OSP[0].qty):'')+'"></div>'+
        '<div id="hShort" class="short" style="margin:-4px 0 8px 100px"></div>'+
        '<div class="row" id="hRsnRow" style="display:none"><label>부족사유</label><input id="hRsn" placeholder="선택"></div>'+
        '<div class="row"><label>특기사항</label><textarea id="hRmk"></textarea></div>'+
        '<button class="bt home" id="btHome">🏭 사내입고 (LOT 종결)</button>'+
      '</div></div>':'')+

      /* ── 특기사항 ── */
      '<div class="pane" data-p="memo"><div class="bd">'+
        '<div class="row"><label>특기사항</label><textarea id="mRmk" placeholder="불량 발생 · 지연 사유 등 자유 기록"></textarea></div>'+
        '<button class="bt memo" id="btMemo">📝 기록 저장</button>'+
      '</div></div>'+
      '<div class="msg" id="msg"></div>'+
    '</div>'+

    '<div class="card"><h3>🕘 최근 기록</h3><div class="bd">'+
      (MOVES.length?'<table class="hist" style="width:100%;border-collapse:collapse">'+
        MOVES.map(v=>'<tr><td style="width:76px">'+esc(v.move_date||'')+'</td>'+
          '<td style="width:66px"><span class="badge '+(v.io==='입고'||v.io==='사내입고'||v.io==='도착'?'b-in':v.io==='출고'?'b-out':'b-etc')+'">'+esc(v.io)+'</span></td>'+
          '<td>'+esc(v.mp||'')+(v.vendor?' · '+esc(v.vendor):'')+
          (num(v.short_qty)>0?' <span class="short">부족 '+num(v.short_qty).toLocaleString()+'</span>':'')+
          (v.remark?'<br><small style="color:#526171">'+esc(v.remark)+'</small>':'')+'</td></tr>').join('')+'</table>'
      :'<span style="color:#8894a0">기록이 없습니다.</span>')+
    '</div></div>';

    const ol=$('#otherLot');
    if(ol) ol.addEventListener('click',()=>{ try{ localStorage.removeItem('ki_scan_lot'); }catch(e){} });

    /* 탭 */
    wrap.querySelectorAll('.qtab').forEach(t=>t.addEventListener('click',e=>{
      const b=e.target.closest('button[data-t]'); if(!b) return;
      wrap.querySelectorAll('.qtab button').forEach(x=>x.classList.toggle('on',x===b));
      wrap.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.dataset.p===b.dataset.t));
      try{ b.scrollIntoView({block:'nearest'}); }catch(_){}
    }));

    const msg=(t,ok)=>{ const m=$('#msg'); m.className='msg '+(ok?'ok':'err'); m.textContent=t; };
    /* 등록 버튼 중복 클릭 방지 : 저장 시작 시 잠그고, 실패했을 때만 되돌린다
       (성공하면 잠금 상태로 두고 load() 로 화면을 새로 그린다) */
    const lockBtn=b=>{ if(!b)return; b.dataset.lbl=b.textContent; b.disabled=true; b.textContent='⏳ 등록중...'; };
    const freeBtn=b=>{ if(!b)return; b.disabled=false; if(b.dataset.lbl) b.textContent=b.dataset.lbl; };
    const fmtN=v=>Number(v||0).toLocaleString();

    /* ── 입고 : 부족수량 자동계산 (사유는 선택) ── */
    if(open.length){
      const cur=()=>open.find(o=>String(o.no)===$('#inNo').value)||open[0];
      const sync=()=>{ const o=cur(), base=remainOf(o), inQ=num($('#inQty').value);
        const sh=Math.max(base-inQ,0);
        $('#inShort').textContent=sh>0?'⚠ 부족 '+sh.toLocaleString()+' (사유는 선택 입력)':'';
        $('#inRsnRow').style.display=sh>0?'':'none'; };
      $('#inNo').addEventListener('change',()=>{ $('#inQty').value=remainOf(cur())||''; sync(); });
      $('#inQty').addEventListener('input',sync);
      $('#inQty').value=remainOf(cur())||''; sync();
      /* 확인 업체 기본값 = 반출건의 외주처 */
      const syncVen=()=>{ const o=cur(); if(o&&o.vendor) $('#inVen').value=o.vendor; };
      $('#inNo').addEventListener('change',syncVen); syncVen();
      /* 이미 도착확인된 반출건은 버튼을 잠근다 (두 번 눌러 중복 등록되는 것 방지)
         · 단, [사내 복귀] 체크 시에는 별개 처리이므로 허용 */
      const syncArr=()=>{
        const o=cur(), a=arrivedOf(o), b=$('#btIn');
        b.disabled=!!a;
        b.textContent=a?'✅ 이미 도착확인됨':'📥 도착확인 등록';
        const box=$('#inDup');
        box.style.display=(a?'':'none');
        box.innerHTML = a
          ? '⚠ 이 반출건은 <b>'+esc(a.move_date||'')+'</b> 에 이미 도착확인되었습니다. 중복 등록할 수 없습니다.<br>'+
            '가공이 끝나 경일FB로 보낼 때는 <b>[📤 출고]</b> 탭에서 등록하세요.'
          : '';
      };
      /* 도착확인은 '받았다'는 기록만 남긴다. 반출건 마감(사내 복귀)은
         [📤 출고] 탭의 <b>경일FB 사내입고</b>로 처리한다 — 경로를 하나로 둔다. */
      const syncClose=()=>{
        const o=cur(), base=remainOf(o), inQ=num($('#inQty').value);
        const note=$('#inCloseNote');
        const partial = inQ>0 && base>0 && inQ<base;
        note.style.display=partial?'':'none';
        note.innerHTML=partial
          ? '· 잔량 <b>'+fmtN(base)+'</b> 중 <b>'+fmtN(inQ)+'</b> 만 도착했습니다 — '+
            '남은 <b>'+fmtN(base-inQ)+'</b> 은 그 업체에 그대로 남습니다.'
          : '';
        syncArr();
      };
      $('#inNo').addEventListener('change',syncClose);
      $('#inQty').addEventListener('input',syncClose);
      syncClose();
      $('#btIn').addEventListener('click',async()=>{
        const B=$('#btIn'); if(B.disabled) return;
        const o=cur(), base=remainOf(o), inQ=num($('#inQty').value);
        const sh=Math.max(base-inQ,0), closeIt=false;   /* 도착확인 전용 — 마감은 [출고] 탭에서 */
        if(!inQ) return msg('입고수량을 입력하세요.');
        if(arrivedOf(o)) return msg('이미 도착확인된 반출건입니다.');
        if(!confirm('[도착확인] 등록하시겠습니까?\n\n'+
            'LOT : '+PART+'\n'+
            '공정 : '+(o.mp||'')+' · '+($('#inVen').value||o.vendor||'')+'\n'+
            '수량 : '+fmtN(inQ)+(sh>0?'  (부족 '+fmtN(sh)+')':'')+'\n'+
            '일자 : '+($('#inDate').value||TODAY)+'\n\n'+
            '※ 등록 후에는 버튼이 잠기며 중복 등록되지 않습니다.')) return;
        lockBtn(B);
        try{
          await KI.ins(TBL.lotMove,[{part:PART, osp_no:Number(o.no)||null,
            io:'도착',
            mp:o.mp||null, vendor:$('#inVen').value||o.vendor||null, move_date:$('#inDate').value||TODAY,
            out_qty:base||null, in_qty:inQ||null, short_qty:sh,
            reason:($('#inRsn')&&$('#inRsn').value.trim())||null,
            remark:$('#inRmk').value.trim()||null, worker:me.emp_name||'', source:'QR'}]);
          msg('✓ 도착확인 등록 — 작업 완료 후 [📤 출고]에서 경일FB로 보내세요.'+
              (sh?' (잔량 '+sh.toLocaleString()+' 은 그대로 유지)':''),1);
          setTimeout(load,700);
        }catch(e){ msg('❌ '+e.message); freeBtn(B); }
      });
    }

    /* ── 출고 : 신규 또는 미결 반출건에서 이관 — 부분출고 시 잔량 미결 유지 ── */
    (function(){
      const srcOf=()=>open.find(o=>String(o.no)===$('#outFrom').value)||null;
      /* 보내는 곳 : home = 경일FB 사내 복귀(반출건 마감) / ven = 다음 외주처 직송
         · 신규 출고(사내 출발)는 사내 복귀가 성립하지 않으므로 외주처 고정 */
      /* 외주 공정을 마친 제품은 반드시 경일FB로 복귀해 검사 후 다음 공정으로 반출한다
         → 외주처 보유분 출고는 [경일FB 사내입고] 고정 (외주처 간 직송 금지)
         → 신규 출고(사내 출발)만 외주처로 반출 */
      const isHomeDest=()=>!!srcOf();
      function syncDest(){
        /* 미결 반출건이 있는데 [사내 출발] 이 선택되면 보유분으로 되돌린다 */
        if(!srcOf() && open.length){
          const f=open.find(o=>remainOf(o)>0)||open[0];
          $('#outFrom').value=String(f.no);
          $('#outQty').value=remainOf(f)||'';
        }
        const src=srcOf(), sel=$('#outDest');
        $('#outDestRow').style.display = src?'':'none';
        sel.value = src?'home':'ven';
        sel.disabled = true;                       /* 선택 불가 — 규칙 고정 */
        const home=isHomeDest();
        $('#outMpRow').style.display = home?'none':'';
        $('#outVenRow').style.display = home?'none':'';
        $('#outDNote').className='dnote '+(home?'home':'ven');
        $('#outDNote').innerHTML = home
          ? '🏭 <b>경일FB로 입고</b>합니다 — 외주 공정이 끝난 제품은 <b>반드시 경일FB로 복귀</b>해 '+
            '검사 후 다음 공정으로 반출합니다. (외주처 간 직송 불가)'
          : '🚚 <b>외주 반출</b> — 협력사로 보냅니다.';
        $('#outDateL').textContent = home?'입고일':'출고일';
        $('#outQtyL').textContent  = home?'입고수량':'출고수량';
        $('#btOut').textContent    = home?'🏭 경일FB 사내입고 등록':'📤 출고(반출) 등록';
        sync();
      }
      /* 출고 가능 여부 : 잔량 없음 · 수량 오류 · 필수 미선택이면 등록 버튼을 잠근다 */
      function syncBtn(){
        const B=$('#btOut'); if(!B || B.dataset.lbl) return;   /* 등록중이면 건드리지 않음 */
        const src=srcOf(), home=isHomeDest(), q=num($('#outQty').value);
        const rem=src?remainOf(src):0;
        let why='';
        if(!src && open.length) why='제품이 <b>외주처에 있습니다</b> — 사내 출발 출고는 등록할 수 없습니다. '+
                                    '위 [출발]에서 보유분을 선택하세요.';
        else if(src && rem<=0)  why='이 보유분은 <b>잔량이 없습니다</b> — 이미 전량 이관·복귀되었습니다.';
        else if(!q)            why='수량을 입력하세요.';
        else if(src && q>rem)  why='잔량(<b>'+rem.toLocaleString()+'</b>)보다 많이 '+(home?'입고':'출고')+'할 수 없습니다.';
        else if(!home && !$('#outMp').value)  why='다음 공정을 선택하세요.';
        else if(!home && !$('#outVen').value) why='<b>받는 외주처</b>를 선택하세요.';
        else if(!home && src)                 why='외주처 보유분은 <b>경일FB 사내입고</b>로만 출고할 수 있습니다.';
        B.disabled=!!why;
        const w=$('#outWhy');
        w.innerHTML = why?('⛔ '+why):'';
        w.style.display = why?'':'none';
      }
      const sync=()=>{
        const src=srcOf(), home=isHomeDest();
        setTimeout(syncBtn,0);
        if(src && home){
          const rem=remainOf(src), q=num($('#outQty').value), left=Math.max(rem-q,0);
          $('#outCloseRow').style.display = left>0?'':'none';
          $('#outInfo').innerHTML = q>rem
            ? '<span class="short">⚠ 잔량('+rem.toLocaleString()+')보다 많습니다</span>'
            : (left>0
               ? '<span class="part">잔량 '+left.toLocaleString()+' 미결 유지 — 전부 회수했다면 아래 [잔여 없음]을 체크하세요</span>'
               : '<span style="color:#15803d;font-weight:700">전량 사내 복귀 — 반출건이 마감됩니다</span>');
          return;
        }
        $('#outCloseRow').style.display='none';
        if(src){
          const rem=remainOf(src), q=num($('#outQty').value);
          if(!$('#outQty').value) $('#outQty').value=rem||'';
          const left=Math.max(rem-num($('#outQty').value),0);
          $('#outInfo').innerHTML = num($('#outQty').value)>rem
            ? '<span class="short">⚠ 잔량('+rem.toLocaleString()+')보다 많습니다</span>'
            : (left>0?'<span class="part">부분출고 — 잔량 '+left.toLocaleString()+' 미결 유지 (다음 작업 후 이 LOT을 다시 불러 출고)</span>'
                     :'<span style="color:#15803d;font-weight:700">전량 이관 — 반출건이 마감됩니다</span>');
        }else{
          const base=num(last.qty);
          const sh=base?Math.max(base-num($('#outQty').value),0):0;
          $('#outInfo').innerHTML = sh>0?'<span class="short">직전 수량 대비 부족 '+sh.toLocaleString()+' (특기사항에 사유 기록 권장)</span>':'';
        }
      };
      $('#outFrom').addEventListener('change',()=>{ const s2=srcOf();
        $('#outQty').value=s2?(remainOf(s2)||''):(num(last.qty)||''); syncDest(); });
      $('#outDest').addEventListener('change',syncDest);
      $('#outQty').addEventListener('input',sync);
      ['#outMp','#outVen','#outClose'].forEach(k=>{ const e2=$(k);
        if(e2) e2.addEventListener('change',syncBtn); });
      /* 미결 반출건이 있으면 [그 보유분 → 경일FB 사내입고] 를 기본값으로 */
      const first=open.find(o=>remainOf(o)>0)||open[0];
      if(first){ $('#outFrom').value=String(first.no); $('#outQty').value=remainOf(first)||''; }
      else $('#outQty').value=num(last.qty)||'';
      syncDest();
      $('#btOut').addEventListener('click',async()=>{
        const B=$('#btOut'); if(B.disabled) return;
        const q=num($('#outQty').value);
        const src=srcOf();
        /* ── 경일FB 사내 복귀 : 발주 생성 없이 반출건만 마감 ── */
        if(src && isHomeDest()){
          const rem=remainOf(src), left=Math.max(rem-q,0);
          if(!q) return msg('입고수량을 입력하세요.');
          if(q>rem) return msg('잔량('+rem.toLocaleString()+')보다 많이 입고할 수 없습니다.');
          const closeIt = left<=0 || $('#outClose').checked;
          const sh = closeIt?left:0;
          if(!confirm('[경일FB 사내입고] 등록하시겠습니까?\n\n'+
              'LOT : '+PART+'\n'+
              '보유처 : '+(src.mp||'')+' · '+(src.vendor||'')+'\n'+
              '입고수량 : '+fmtN(q)+(sh>0?'  (부족 '+fmtN(sh)+')':'')+'\n'+
              (closeIt?'반출건 마감':'부분 복귀 — 잔량 '+fmtN(left)+' 유지')+'\n\n'+
              '※ 등록 후에는 버튼이 잠기며 중복 등록되지 않습니다.')) return;
          lockBtn(B);
          try{
            if(closeIt) await KI.upd(TBL.ospOrder,'no=eq.'+src.no,
              {idate:$('#outDate').value||TODAY, st:'완료'});
            await KI.ins(TBL.lotMove,[{part:PART, osp_no:Number(src.no)||null, io:'입고',
              mp:src.mp||null, vendor:src.vendor||null, move_date:$('#outDate').value||TODAY,
              out_qty:rem||null, in_qty:q||null, short_qty:sh,
              remark:(closeIt?'':'부분 복귀 — 잔량 '+left.toLocaleString()+' 유지. ')+
                '경일FB 사내입고. '+($('#outRmk').value.trim()||''),
              worker:me.emp_name||'', source:'QR'}]);
            msg(closeIt
              ? '✓ 경일FB 사내입고 — 반출건 마감'+(sh?' (부족 '+sh.toLocaleString()+')':'')+
                '. 검사 후 [출고]에서 다음 공정으로 반출하세요.'
              : '✓ 부분 사내입고 — 잔량 '+left.toLocaleString()+' 은 업체에 남아 있습니다.',1);
            setTimeout(load,700);
          }catch(e){ msg('❌ '+e.message); freeBtn(B); }
          return;
        }
        if(src) return msg('외주처 보유분은 경일FB 사내입고로만 출고할 수 있습니다.');
        if(open.length) return msg('제품이 외주처에 있어 사내 출발 출고를 등록할 수 없습니다.');
        const mp=$('#outMp').value, ven=$('#outVen').value;
        if(!mp) return msg('가공공정을 선택하세요.');
        if(!ven) return msg('받는 외주처를 선택하세요.');
        if(!q)  return msg('출고수량을 입력하세요.');
        if(src){
          const rem=remainOf(src);
          if(rem<=0) return msg('이 보유분은 잔량이 없어 출고할 수 없습니다.');
          if(q>rem)  return msg('잔량('+rem.toLocaleString()+')보다 많이 출고할 수 없습니다.');
        }
        if(!confirm('[출고(반출)] 등록하시겠습니까?\n\n'+
            'LOT : '+PART+'\n'+
            '다음 공정 : '+mp+'\n'+
            '받는 외주처 : '+ven+'\n'+
            '출고수량 : '+fmtN(q)+'\n'+
            '출고일 : '+($('#outDate').value||TODAY)+'\n\n'+
            '※ 등록 후에는 버튼이 잠기며 중복 등록되지 않습니다.')) return;
        lockBtn(B);
        try{
          await KI.ins(TBL.ospOrder,[{part:PART, job:(PROG||{}).job||last.job||null, mp:mp, vendor:ven,
            map_part:last.map_part||null, mold_no:last.mold_no||null,
            route_no:(PROG||{}).route_no||last.route_no||null,
            lot:PART, qty:q, lots:[{lot:PART,qty:q}],
            sdate:$('#outDate').value||TODAY, edate:null, quote:null, st:'진행', odate:null}]);
          if(src){
            const rem=remainOf(src), left=Math.max(rem-q,0);
            await KI.ins(TBL.lotMove,[{part:PART, osp_no:Number(src.no)||null, io:'출고',
              mp:mp, vendor:ven, move_date:$('#outDate').value||TODAY, out_qty:q,
              short_qty:0, remark:(left>0?'부분출고 — 잔량 '+left.toLocaleString()+' 유지. ':'')+
                ($('#outRmk').value.trim()||''), worker:me.emp_name||'', source:'QR'}]);
            if(left<=0) await KI.upd(TBL.ospOrder,'no=eq.'+src.no,
              {idate:$('#outDate').value||TODAY, st:'완료'});
            msg(left>0?'✓ 부분출고 등록 — 잔량 '+left.toLocaleString()+' 미결 유지. 다음 업체 화면에 자동 표시됩니다.'
                      :'✓ 전량 이관 등록 — 반출건 마감. 다음 업체 화면에 자동 표시됩니다.',1);
          }else{
            await KI.ins(TBL.lotMove,[{part:PART, io:'출고', mp:mp, vendor:ven,
              move_date:$('#outDate').value||TODAY, out_qty:q,
              remark:$('#outRmk').value.trim()||null, worker:me.emp_name||'', source:'QR'}]);
            msg('✓ '+mp+' 공정으로 출고 등록되었습니다. 다음 업체 화면에 자동 표시됩니다.',1);
          }
          setTimeout(load,700);
        }catch(e){ msg('❌ '+e.message); freeBtn(B); }
      });
    })();

    /* ── 사내입고 (사유는 선택) ── */
    if($('#btHome')){
      const base=num((OSP[0]||{}).qty);   /* 최초 반출수량 기준 */
      const sync=()=>{ const q=num($('#hQty').value), sh=base?Math.max(base-q,0):0;
        $('#hShort').textContent=sh>0?'⚠ 부족 '+sh.toLocaleString()+' (사유는 선택 입력)':'';
        $('#hRsnRow').style.display=sh>0?'':'none'; };
      $('#hQty').addEventListener('input',sync); sync();
      $('#btHome').addEventListener('click',async()=>{
        const B=$('#btHome'); if(B.disabled) return;
        const q=num($('#hQty').value), sh=base?Math.max(base-q,0):0;
        if(!q) return msg('입고수량을 입력하세요.');
        if(!confirm('[사내입고 — LOT 종결] 등록하시겠습니까?\n\n'+
            'LOT : '+PART+'\n'+
            '입고수량 : '+fmtN(q)+(sh>0?'  (부족 '+fmtN(sh)+')':'')+'\n'+
            '입고일 : '+($('#hDate').value||TODAY)+'\n\n'+
            '※ 종결하면 이 이동표 QR은 더 이상 사용할 수 없습니다.')) return;
        lockBtn(B);
        try{
          await KI.ins(TBL.lotReceipt,[{part:PART, job:(PROG||{}).job||last.job||null,
            in_date:$('#hDate').value||TODAY, qty:q||null, short_qty:sh,
            reason:($('#hRsn')&&$('#hRsn').value.trim())||null,
            worker:me.emp_name||'', remark:$('#hRmk').value.trim()||null}]);
          await KI.ins(TBL.lotMove,[{part:PART, io:'사내입고', move_date:$('#hDate').value||TODAY,
            in_qty:q||null, short_qty:sh, reason:($('#hRsn')&&$('#hRsn').value.trim())||null,
            remark:$('#hRmk').value.trim()||null, worker:me.emp_name||'', source:'QR'}]);
          msg('✓ 사내입고 완료 — LOT이 종결되었습니다.',1);
          setTimeout(load,700);
        }catch(e){ msg('❌ '+e.message); freeBtn(B); }
      });
    }

    /* ── 특기사항만 기록 ── */
    $('#btMemo').addEventListener('click',async()=>{
      const B=$('#btMemo'); if(B.disabled) return;
      const t=$('#mRmk').value.trim();
      if(!t) return msg('특기사항을 입력하세요.');
      lockBtn(B);
      try{
        await KI.ins(TBL.lotMove,[{part:PART, io:'기록', move_date:TODAY,
          remark:t, worker:me.emp_name||'', source:'QR'}]);
        msg('✓ 특기사항이 기록되었습니다.',1);
        setTimeout(load,700);
      }catch(e){ msg('❌ '+e.message); freeBtn(B); }
    });
  }

  await boot();
})().catch(e=>{ document.getElementById('wrap').textContent='❌ '+e.message; });
</script>
</body>
</html>
