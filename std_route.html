<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GI MES</title>
<link rel="stylesheet" href="ki_style.css">
<style>
/* ── 색상 규칙 (전 화면 공통) ──
   외주 이동 : 파랑 #2e77bd    사내 이동 : 주황 #e8862e  */
.sr-wrap{display:flex;gap:7px;margin:7px;flex:1;min-height:340px;align-items:stretch}
.sr-l{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid #8494a4;background:#fff}
.sr-r{width:460px;flex:none;display:flex;flex-direction:column;border:1px solid #8494a4;background:#fff}
.sr-l .grid-wrap{margin:0;border:0;flex:1}
.sr-h{height:26px;display:flex;align-items:center;gap:7px;padding:0 9px;background:#eef2f6;
  border-bottom:1px solid #cfd8e0;font-size:11px;font-weight:800;color:#41556a}
.sr-h .sp{margin-left:auto;font-weight:400;color:#7b8b9c}
.sr-b{padding:9px 10px;overflow:auto;flex:1}
.grid tr.clk{cursor:pointer}
.grid tr.clk:hover td{background:#eef5fc}
.grid tr.on td{background:#dfeaf6}
.sr-f{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;margin-bottom:9px}
.sr-f label{color:#526171;font-weight:700;font-size:11px}
.sr-f input,.sr-f select{height:26px;border:1px solid #aeb9c4;padding:0 6px;font:inherit;width:100%}
.sr-mf{display:flex;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid #e0e6eb;background:#fafbfc}
.sr-mf .msg{font-weight:700;font-size:11px}
.sr-mf .msg.ok{color:#1f7a45}.sr-mf .msg.err{color:#b23030}

/* 단계 편집 */
.st-box{border:1px solid #dde4ea}
.st-box .hh{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#f4f7fa;
  border-bottom:1px solid #dde4ea;font-size:11px;font-weight:700;color:#41556a}
.st-box .hh .sum{margin-left:auto;font-weight:400;color:#7b8b9c}
.st-list{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto}
.st-list li{display:flex;align-items:center;gap:6px;padding:5px 7px;border-bottom:1px solid #eef1f4}
.st-list li:last-child{border-bottom:0}
.st-list .seq{width:20px;text-align:center;font-size:10px;font-weight:800;color:#8b98a5}
.st-list .nm{flex:1;min-width:0;font-weight:800;font-size:12px;color:#33465a;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:5px solid #2e77bd;padding-left:7px}
.st-list .nm em{font-style:normal;font-weight:400;font-size:10.5px;color:#7b8794;margin-left:5px}
.st-list li.k-in .nm{border-left-color:#e8862e}
.st-list li.k-in{background:#fff8f1}
.st-list li.k-out{background:#f6f9fd}
.kd{height:22px;border:1px solid #2e77bd;background:#2e77bd;color:#fff;border-radius:2px;
  font-size:10.5px;font-weight:800;cursor:pointer;padding:0 8px;white-space:nowrap}
.kd.in{border-color:#c96f1a;background:#e8862e}
.mb{width:22px;height:22px;border:1px solid #c9d2da;background:#fff;color:#41556a;
  border-radius:2px;cursor:pointer;font-size:11px;line-height:1}
.mb.del{color:#a0505a;border-color:#c9a0a8}
.mb:disabled{opacity:.35;cursor:default}
.addrow{display:flex;gap:5px;padding:6px 7px;background:#fbfcfd;border-top:1px solid #dde4ea}
.addrow select{flex:1;min-width:0;height:26px;border:1px solid #aeb9c4;padding:0 6px;font:inherit}
.addrow button{height:26px;padding:0 11px;border:1px solid #6f8398;background:#fff;color:#41556a;
  border-radius:2px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}

/* 경로 미리보기 · 목록 체인 */
.rc{display:inline-flex;align-items:center;gap:3px;margin:1px 0;padding:2px 7px;border:1px solid #bcd0e4;
  border-radius:3px;background:#eef5fc;color:#1d568c;font-size:10.5px;font-weight:800;
  vertical-align:middle;white-space:nowrap}
.rc.in{border-color:#ecd0a8;background:#fdf1e3;color:#a75f11}
.rc.home{border-color:#cfd7de;background:#eef1f4;color:#5b6b7b}
.rar{display:inline-block;margin:0 2px;color:#9fb0c0;font-weight:800;vertical-align:middle}
.rar.in{color:#e8862e}
td.rchain{white-space:nowrap;overflow-x:auto;max-width:420px}
td.rchain::-webkit-scrollbar{height:5px}
td.rchain::-webkit-scrollbar-thumb{background:#cbd5df;border-radius:3px}
.lg{display:flex;gap:12px;align-items:center;font-size:10.5px;color:#5b6b7b;padding:5px 9px;
  border:1px solid #dde4ea;background:#fbfcfd;margin:0 7px}
.lg b{font-weight:800}
@media (max-width:900px){
  .sr-wrap{flex-direction:column}
  .sr-r{width:auto}
  .sr-l .grid-wrap{overflow-x:auto}
  .sr-l .grid{min-width:720px}
}
</style>
<script src="ki_config.js"></script>
<script src="ki_core.js"></script>
</head>
<body>
<script>
(async function(){
  if(!await KI.guard('std-route'))return;
  const $=KI.$, el=KI.el, esc=KI.esc;
  const cur=KI.chrome('std-route');
  const CAN_S=KI.can('std-route','save'), CAN_E=KI.can('std-route','edit'),
        CAN_D=KI.can('std-route','delete');
  let RT=[], PROC=[], sel=null, STEPS=[], IN=new Set();

  const ui=KI.page(cur,[
    ['조회','primary',()=>load()],
    ['등록','',()=>newRoute()],
    ['엑셀다운로드','',()=>csv()],
    ['인쇄','',()=>window.print()]
  ]);
  const nt=el('div','note');
  nt.innerHTML='표준공정경로에 <b>사내공정</b>을 함께 등록합니다. 각 단계의 '+
    '<b>[외주]/[사내]</b> 버튼을 눌러 구분을 바꾸면 LOT 진행등록 · 공정이동표에 그대로 반영됩니다.<br>'+
    '<b>외주</b>는 협력사로 반출(파랑), <b>사내</b>는 사내 작업장 간 이동(주황)으로 처리되며 '+
    '사내 이동은 단가 · 납기 없이 이동일과 이동처(작업장)만 기록합니다.';
  ui.pg.appendChild(nt);

  const lg=el('div','lg');
  lg.innerHTML='<span><span class="rc">외주 공정</span> 협력사 반출 · 입고</span>'+
    '<span><span class="rc in">사내 공정</span> 사내 작업장 이동</span>'+
    '<span><span class="rc home">🏭 사내</span> 출발 · 최종입고</span>';
  ui.pg.appendChild(lg);

  const wrap=el('div','sr-wrap');
  const L=el('div','sr-l'), R=el('div','sr-r');
  const lh=el('div','sr-h'); lh.innerHTML='표준 공정경로 <span class="sp" id="cnt"></span>';
  const gw=el('div','grid-wrap'); const tbl=el('table','grid');
  tbl.innerHTML='<thead><tr>'+
    '<th style="width:46px">No</th><th style="width:96px">표준공정번호</th>'+
    '<th style="width:150px">표준공정명</th><th style="width:56px">단계</th>'+
    '<th style="width:72px">외주/사내</th><th>가공공정 순서</th>'+
    '<th style="width:56px">삭제</th></tr></thead><tbody></tbody>';
  gw.appendChild(tbl); L.appendChild(lh); L.appendChild(gw);

  const rh=el('div','sr-h'); rh.innerHTML='<span id="rTtl">경로 편집</span>';
  const rb=el('div','sr-b');
  rb.innerHTML='<div class="sr-f">'+
      '<label>표준공정번호 *</label><input type="number" id="eNo">'+
      '<label>표준공정명 *</label><input type="text" id="eName" placeholder="예: 4공정_MHGW">'+
    '</div>'+
    '<div class="st-box">'+
      '<div class="hh">가공공정 순서 · 구분<span class="sum" id="eSum"></span></div>'+
      '<ul class="st-list" id="stList"></ul>'+
      '<div class="addrow">'+
        '<select id="addMp"></select>'+
        '<select id="addKd" style="flex:0 0 92px"><option value="외주">외주</option><option value="사내">사내</option></select>'+
        '<button type="button" id="addBt">+ 단계 추가</button>'+
      '</div>'+
    '</div>'+
    '<div style="margin-top:9px;padding:8px 9px;border:1px solid #dde4ea;background:#fbfcfd">'+
      '<div style="font-size:11px;font-weight:700;color:#41556a;margin-bottom:5px">이동 경로 미리보기</div>'+
      '<div id="prev" style="overflow-x:auto;white-space:nowrap"></div></div>';
  const rf=el('div','sr-mf');
  rf.innerHTML='<span class="msg" id="eMsg"></span>'+
    '<button class="btn" id="eNew" style="margin-left:auto">새 경로</button>'+
    '<button class="btn primary" id="eSave">💾 저장</button>';
  R.appendChild(rh); R.appendChild(rb); R.appendChild(rf);
  wrap.appendChild(L); wrap.appendChild(R); ui.pg.appendChild(wrap);
  const tbody=tbl.querySelector('tbody');

  const pName=c=>{const p=PROC.find(x=>x.process_code===c);return p?p.process_name:''};
  const kindOf=(rt,mp)=>{
    const inh=Array.isArray(rt&&rt.inhouse)?rt.inhouse:[];
    return inh.indexOf(mp)>=0?'사내':'외주';
  };
  /* 경로 체인 HTML — 사내(주황) · 외주(파랑) */
  function chainHtml(steps,inh){
    const set=new Set(Array.isArray(inh)?inh:[]);
    let h='<span class="rc home">🏭 사내</span>';
    (steps||[]).forEach(x=>{
      const i=set.has(x);
      h+='<span class="rar'+(i?' in':'')+'">'+(i?'⇢':'→')+'</span>'+
         '<span class="rc'+(i?' in':'')+'" title="'+esc(x+(pName(x)?' · '+pName(x):''))+'">'+
         (i?'🏭 ':'🚚 ')+esc(x)+'</span>';
    });
    h+='<span class="rar">→</span><span class="rc home">🏭 사내입고</span>';
    return h;
  }

  function draw(){
    tbody.innerHTML='';
    RT.forEach((r,i)=>{
      const st=Array.isArray(r.steps)?r.steps:[];
      const inh=Array.isArray(r.inhouse)?r.inhouse:[];
      const ni=st.filter(x=>inh.indexOf(x)>=0).length;
      const t=el('tr','clk');
      if(sel&&String(sel.standard_process_no)===String(r.standard_process_no)) t.className='clk on';
      t.innerHTML='<td class="center">'+(i+1)+'</td>'+
        '<td class="center">'+esc(String(r.standard_process_no))+'</td>'+
        '<td style="font-weight:800;color:#22537f">'+esc(r.standard_process_name||'')+'</td>'+
        '<td class="num">'+st.length+'</td>'+
        '<td class="center" style="white-space:nowrap">'+
          '<span class="rc" style="padding:1px 5px">외 '+(st.length-ni)+'</span> '+
          '<span class="rc in" style="padding:1px 5px">내 '+ni+'</span></td>'+
        '<td class="rchain">'+chainHtml(st,inh)+'</td>'+
        '<td class="center">'+(CAN_D?'<button class="mb del" title="삭제">✕</button>':'')+'</td>';
      const db=t.querySelector('.del');
      if(db) db.addEventListener('click',ev=>{ ev.stopPropagation(); delRoute(r); });
      t.addEventListener('click',()=>edit(r));
      tbody.appendChild(t);
    });
    if(!RT.length) tbody.innerHTML='<tr><td colspan="7" class="center" style="height:52px;color:#8894a0">등록된 표준공정경로가 없습니다.</td></tr>';
    $('#cnt').textContent=RT.length+'건';
  }

  /* ── 단계 편집 ── */
  function drawSteps(){
    const ul=$('#stList'); ul.innerHTML='';
    STEPS.forEach((mp,i)=>{
      const isIn=IN.has(mp);
      const li=el('li',isIn?'k-in':'k-out');
      li.innerHTML='<span class="seq">'+(i+1)+'</span>'+
        '<span class="nm">'+esc(mp)+'<em>'+esc(pName(mp)||'')+'</em></span>'+
        '<button class="kd'+(isIn?' in':'')+'" data-k="'+i+'">'+(isIn?'🏭 사내':'🚚 외주')+'</button>'+
        '<button class="mb" data-u="'+i+'"'+(i===0?' disabled':'')+'>▲</button>'+
        '<button class="mb" data-d="'+i+'"'+(i===STEPS.length-1?' disabled':'')+'>▼</button>'+
        '<button class="mb del" data-x="'+i+'">✕</button>';
      ul.appendChild(li);
    });
    if(!STEPS.length) ul.innerHTML='<li style="color:#8894a0;justify-content:center;padding:14px">아래에서 가공공정을 추가하세요.</li>';
    ul.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{
      const mp=STEPS[+b.dataset.k]; if(IN.has(mp)) IN.delete(mp); else IN.add(mp); drawSteps(); }));
    ul.querySelectorAll('[data-u]').forEach(b=>b.addEventListener('click',()=>{
      const i=+b.dataset.u; if(i<1)return; const t=STEPS[i-1]; STEPS[i-1]=STEPS[i]; STEPS[i]=t; drawSteps(); }));
    ul.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{
      const i=+b.dataset.d; if(i>=STEPS.length-1)return; const t=STEPS[i+1]; STEPS[i+1]=STEPS[i]; STEPS[i]=t; drawSteps(); }));
    ul.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>{
      const mp=STEPS.splice(+b.dataset.x,1)[0]; IN.delete(mp); drawSteps(); }));
    const ni=STEPS.filter(x=>IN.has(x)).length;
    $('#eSum').textContent=STEPS.length+'단계 · 외주 '+(STEPS.length-ni)+' · 사내 '+ni;
    $('#prev').innerHTML=STEPS.length?chainHtml(STEPS,[...IN]):'<span style="color:#8894a0;font-size:11px">단계를 추가하면 경로가 표시됩니다.</span>';
  }
  $('#addBt').addEventListener('click',()=>{
    const mp=$('#addMp').value, m=$('#eMsg');
    if(!mp){ m.className='msg err'; m.textContent='추가할 가공공정을 선택하세요.'; return; }
    if(STEPS.indexOf(mp)>=0){ m.className='msg err'; m.textContent='⚠ 이미 경로에 포함된 공정입니다.'; return; }
    STEPS.push(mp);
    if($('#addKd').value==='사내') IN.add(mp); else IN.delete(mp);
    m.className='msg'; m.textContent=''; drawSteps();
  });

  function newRoute(){
    if(!(CAN_S||CAN_E)) return KI.msg('❌ 등록 권한이 없습니다.');
    sel=null; STEPS=[]; IN=new Set();
    const nx=RT.reduce((a,b)=>Math.max(a,Number(b.standard_process_no)||0),0)+1;
    $('#rTtl').textContent='경로 편집 — 신규';
    $('#eNo').value=nx; $('#eNo').readOnly=false; $('#eName').value='';
    $('#eMsg').className='msg'; $('#eMsg').textContent='';
    drawSteps(); draw(); $('#eName').focus();
  }
  $('#eNew').addEventListener('click',newRoute);

  function edit(r){
    sel=r; STEPS=(Array.isArray(r.steps)?r.steps:[]).slice();
    IN=new Set((Array.isArray(r.inhouse)?r.inhouse:[]).filter(x=>STEPS.indexOf(x)>=0));
    $('#rTtl').textContent='경로 편집 — '+(r.standard_process_name||'');
    $('#eNo').value=r.standard_process_no; $('#eNo').readOnly=true;
    $('#eName').value=r.standard_process_name||'';
    $('#eMsg').className='msg'; $('#eMsg').textContent='';
    drawSteps(); draw();
  }

  async function save(){
    const m=$('#eMsg');
    if(!(CAN_S||CAN_E)) return KI.msg('❌ 저장 권한이 없습니다.');
    const no=$('#eNo').value.trim(), nm=$('#eName').value.trim();
    if(!no){ m.className='msg err'; m.textContent='표준공정번호를 입력하세요.'; return; }
    if(!nm){ m.className='msg err'; m.textContent='표준공정명을 입력하세요.'; return; }
    if(!STEPS.length){ m.className='msg err'; m.textContent='가공공정을 1단계 이상 추가하세요.'; return; }
    const inh=STEPS.filter(x=>IN.has(x));
    const body={standard_process_no:Number(no), standard_process_name:nm,
                steps:STEPS, inhouse:inh};
    m.className='msg'; m.textContent='저장중...';
    try{
      if(sel){
        await KI.upd(TBL.stdRouteT,'standard_process_no=eq.'+sel.standard_process_no,
          {standard_process_name:nm, steps:STEPS, inhouse:inh});
      }else{
        if(RT.some(r=>String(r.standard_process_no)===String(no))){
          m.className='msg err'; m.textContent='⚠ 이미 사용 중인 표준공정번호입니다.'; return; }
        body.row_no=RT.reduce((a,b)=>Math.max(a,Number(b.row_no)||0),0)+1;
        await KI.ins(TBL.stdRouteT,[body]);
      }
      m.className='msg ok'; m.textContent='✓ 저장되었습니다. (외주 '+(STEPS.length-inh.length)+' · 사내 '+inh.length+')';
      KI.msg('✓ '+nm+' 저장 — '+STEPS.length+'단계');
      const keep=Number(no);
      await load();
      const r=RT.find(x=>Number(x.standard_process_no)===keep); if(r) edit(r);
    }catch(e){ m.className='msg err'; m.textContent='❌ '+e.message; }
  }
  $('#eSave').addEventListener('click',save);

  async function delRoute(r){
    if(!CAN_D) return KI.msg('❌ 삭제 권한이 없습니다.');
    if(!confirm('['+(r.standard_process_name||'')+'] 표준공정경로를 삭제할까요?\n'+
                '이 경로를 사용 중인 LOT의 진척 표시가 (미매칭)으로 바뀝니다.')) return;
    try{
      await KI.del(TBL.stdRouteT,'standard_process_no=eq.'+r.standard_process_no);
      KI.msg('✓ 삭제되었습니다.');
      if(sel&&sel.standard_process_no===r.standard_process_no){ sel=null; STEPS=[]; IN=new Set(); drawSteps(); }
      await load();
    }catch(e){ KI.msg('❌ '+e.message); }
  }

  function csv(){
    const head=['표준공정번호','표준공정명','단계수','외주','사내','가공공정 순서(구분)'];
    const body=RT.map(r=>{
      const st=Array.isArray(r.steps)?r.steps:[], inh=Array.isArray(r.inhouse)?r.inhouse:[];
      const ni=st.filter(x=>inh.indexOf(x)>=0).length;
      return [r.standard_process_no,r.standard_process_name,st.length,st.length-ni,ni,
        ['사내'].concat(st.map(x=>x+'['+(inh.indexOf(x)>=0?'사내':'외주')+']')).concat(['사내입고']).join(' → ')]
        .map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',');
    });
    const a=el('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+head.join(',')+'\n'+body.join('\n')],{type:'text/csv'}));
    a.download='표준공정경로_'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  }

  async function load(){
    const [rt,proc]=await Promise.all([
      KI.get(OBJ.stdRoute+'?select=*&order=standard_process_no.asc'),
      KI.get(OBJ.process+'?select=process_code,process_name,process_group,sort_order&order=sort_order.asc')
    ]);
    RT=rt; PROC=proc;
    const gagong=PROC.filter(p=>p.process_group==='가공');
    const keep=$('#addMp').value;
    $('#addMp').innerHTML='<option value="">가공공정 선택</option>'+
      (gagong.length?gagong:PROC).map(p=>'<option value="'+esc(p.process_code)+'">'+
        esc(p.process_code)+' · '+esc(p.process_name||'')+'</option>').join('');
    $('#addMp').value=keep;
    draw();
    if(sel){ const r=RT.find(x=>String(x.standard_process_no)===String(sel.standard_process_no));
      if(r){ sel=r; drawSteps(); } }
    const ni=RT.reduce((a,r)=>a+((Array.isArray(r.inhouse)?r.inhouse:[]).length),0);
    KI.msg('표준공정경로 '+RT.length+'건 · 사내공정 '+ni+'단계');
  }
  try{ await load(); drawSteps(); }
  catch(e){ tbody.innerHTML='<tr><td colspan="7" class="center" style="height:60px;color:#b0442f">❌ '+
    KI.esc(e.message)+'</td></tr>'; KI.msg('❌ '+e.message); }
})();
</script>
</body>
</html>
